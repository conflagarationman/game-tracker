name: Backfill Cover Art

# Weekly, not daily — box art doesn't change day to day, and re-checking already-resolved
# or already-known-unmatched titles more often than that would just burn API quota for
# nothing. This exists so a game added via add.html/the Worker gets real art within a week
# with zero manual step; workflow_dispatch is still there for "I don't want to wait."
on:
  schedule:
    - cron: '0 14 * * 0'   # Sundays ~2pm UTC — offset from sync-games.yml's 1pm daily run
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  backfill:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # GITHUB_STEP_SUMMARY lets the script publish the unmatched titles, and what the
      # catalogue called them instead, onto the run page — so a leftover is an actionable
      # one-line alias rather than something buried in step logs.
      - name: Backfill missing cover art from SteamGridDB
        env:
          STEAMGRIDDB_API_KEY: ${{ secrets.STEAMGRIDDB_API_KEY }}
        run: node scripts/backfill-covers.mjs

      - name: Commit results if anything changed
        run: |
          git config user.name "game-tracker-bot"
          git config user.email "actions@users.noreply.github.com"
          git add covers.json
          git diff --staged --quiet || git commit -m "Backfill cover art from SteamGridDB"
          git pull --rebase origin main
          git push
