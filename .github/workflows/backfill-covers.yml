name: Backfill Cover Art

# Manual only, no schedule — box art doesn't change day to day, and re-checking
# already-resolved or already-known-unmatched titles on a cron would just burn API quota
# for nothing. Run this from the Actions tab whenever new games get added to games.json.
on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  backfill:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Backfill missing cover art from SteamGridDB
        env:
          STEAMGRIDDB_API_KEY: ${{ secrets.STEAMGRIDDB_API_KEY }}
        run: node scripts/backfill-covers.mjs

      - name: Commit results if anything changed
        run: |
          git config user.name "game-tracker-bot"
          git config user.email "actions@users.noreply.github.com"
          git add covers.json
          git diff --staged --quiet || git commit -m "Backfill cover art from SteamGridDB"
          git pull --rebase origin main
          git push
