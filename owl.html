<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kaepora Gaebora</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>%F0%9F%A6%89</text></svg>">
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* Same palette as index.html, plus OoT's text-box colours: key words in red, places in blue,
   and the Yes/No choices in green with a pointing cursor. */
:root{
  --bg:#0e0e10;--surface:#17171a;--surface2:#1f1f24;--border:#2a2a30;--border2:#3a3a42;
  --text:#f0f0f0;--muted:#888890;--dim:#555560;--accent:#c8f542;
  --box:#0a1230eb;--box-edge:#6878b8;--hy-red:#ff5a5a;--hy-blue:#6ab4ff;--hy-green:#5cf07a;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
body{background:var(--bg);color:var(--text);font-family:'Syne',sans-serif;min-height:100vh;
  padding:1rem 16px max(2rem,env(safe-area-inset-bottom));}
.wrap{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:1rem;}
.top{display:flex;align-items:center;justify-content:space-between;gap:.75rem;}
.back{font-family:'DM Mono',monospace;font-size:.7rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);text-decoration:none;
  padding:.4rem .8rem;border:1px solid var(--border2);border-radius:99px;white-space:nowrap;}
.back:hover{color:var(--text);}
/* Syne's 800 weight is wide: at 1.4rem the title alone overflowed a 375px phone. */
h1{font-size:1.4rem;font-weight:800;letter-spacing:-.03em;color:var(--accent);white-space:nowrap;min-width:0;}
@media (max-width:440px){ h1{font-size:1.1rem;} .back{padding:.35rem .6rem;} .back-l{display:none;} }
.music{flex:none;width:34px;height:34px;border-radius:50%;border:1px solid var(--border2);background:transparent;color:var(--muted);
  font-size:1rem;cursor:pointer;}
.music:hover,.music:focus-visible{color:var(--text);border-color:var(--muted);outline:none;}
.music[aria-pressed="true"]{color:#0e0e10;background:var(--accent);border-color:var(--accent);}
/* The music box: YouTube's player must stay visible while it plays, so it gets a small,
   tidy frame at the bottom of the page instead of a bare video in the middle of it. */
.musicbox{align-self:center;width:min(100%,320px);margin-top:.5rem;padding:.55rem .6rem .65rem;border-radius:14px;
  background:linear-gradient(180deg,#3a2716,#24170c);border:1px solid #5a3d22;box-shadow:inset 0 0 0 2px #00000055,0 10px 24px #0008;}
.musicbox[hidden]{display:none;}
.mb-head{display:flex;align-items:center;gap:.5rem;margin-bottom:.45rem;font-family:'DM Mono',monospace;font-size:.68rem;color:#e8d7b8;min-width:0;}
.mb-note{color:var(--accent);animation:point .6s ease-in-out infinite alternate;}
.mb-title{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.mb-by,.mb-by a{color:#b89b74;}
.mb-x{background:none;border:none;color:#b89b74;cursor:pointer;font-size:.8rem;padding:.2rem .35rem;border-radius:6px;}
.mb-x:hover,.mb-x:focus-visible{color:#fff;outline:none;background:#ffffff14;}
.mb-screen{border-radius:8px;overflow:hidden;height:200px;background:#000;}
.mb-screen iframe,.mb-screen #yt{width:100%;height:100%;display:block;border:0;}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;}

/* ─── The scene: Hyrule Field at night ───────────────── */
.scene{position:relative;height:262px;border-radius:16px;overflow:hidden;border:1px solid #232a48;
  background:linear-gradient(180deg,#070b1c 0%,#101a3c 55%,#1c2a52 100%);}
.scene svg.land{position:absolute;inset:auto 0 0 0;width:100%;height:96px;}
.moon{position:absolute;top:22px;right:34px;width:54px;height:54px;border-radius:50%;
  background:radial-gradient(circle at 38% 38%,#fffbe8 0%,#f3e6b3 55%,#d8c68a 100%);
  box-shadow:0 0 24px 6px #f6e9b855,0 0 80px 30px #f6e9b81c;}
.moon::after{content:'';position:absolute;width:12px;height:12px;border-radius:50%;background:#d3c086aa;top:28px;left:14px;
  box-shadow:16px -12px 0 -3px #d3c08688,20px 8px 0 -4px #d3c08677;}
.star{position:absolute;width:2px;height:2px;border-radius:50%;background:#fff;opacity:.8;animation:twinkle 3s ease-in-out infinite;}
@keyframes twinkle{0%,100%{opacity:.85;}50%{opacity:.2;}}
.owl .bird{transform-box:view-box;transform-origin:80px 163px;}
.owl{position:absolute;left:50%;bottom:24px;width:190px;height:auto;margin-left:-95px;overflow:visible;}
/* Perched, he rocks and breathes around his feet rather than floating: the pivot is where the
   talons grip the branch, so they never leave it. Only the arrival moves the whole bird. */
.owl .breathe{transform-box:view-box;transform-origin:80px 163px;animation:breathe 4.2s ease-in-out infinite;}
.owl.arrive .bird{animation:swoop 1.1s cubic-bezier(.2,.7,.3,1) both;}
.owl .head{transform-box:view-box;transform-origin:80px 82px;transition:transform .45s cubic-bezier(.3,1.6,.5,1);}
.owl.tilt .head{transform:rotate(-11deg);}
.owl.tilt-r .head{transform:rotate(9deg);}
.owl .pupils{transition:transform .3s ease;}
.owl.look-down .pupils{transform:translate(0,3px);}
.owl .lid{transform-box:fill-box;transform-origin:50% 0;transform:scaleY(0);animation:blink 5.5s infinite;}
.owl.talking .beak-low{animation:talk .16s ease-in-out infinite alternate;}
.owl.flap .wing-l{animation:flapL .22s ease-in-out 6 alternate;}
.owl.flap .wing-r{animation:flapR .22s ease-in-out 6 alternate;}
.owl .wing-l{transform-box:fill-box;transform-origin:90% 10%;}
.owl .wing-r{transform-box:fill-box;transform-origin:10% 10%;}
@keyframes breathe{0%,50%,100%{transform:none;}25%{transform:rotate(-1.6deg) scale(1.01,1.025);}75%{transform:rotate(1.6deg) scale(1.01,1.025);}}
@keyframes swoop{from{transform:translate(-160px,-150px) rotate(-25deg) scale(.6);opacity:0;}60%{opacity:1;}to{transform:none;}}
@keyframes blink{0%,93%,100%{transform:scaleY(0);}96%{transform:scaleY(1);}}
@keyframes talk{from{transform:translateY(0);}to{transform:translateY(2.5px);}}
@keyframes flapL{to{transform:rotate(40deg);}}
@keyframes flapR{to{transform:rotate(-40deg);}}

/* ─── The text box: translucent navy, double bevel, blinking ▼ ── */
.box{position:relative;background:var(--box);border:2px solid var(--box-edge);border-radius:14px;
  box-shadow:inset 0 0 0 3px #00000099,inset 0 0 0 4px #ffffff10,0 12px 30px #000a;padding:1rem 1.15rem 1.7rem;min-height:7.8rem;
  cursor:pointer;font-size:1.05rem;line-height:1.55;font-weight:600;margin-top:-1.6rem;z-index:1;}
.box .r{color:var(--hy-red);} .box .b{color:var(--hy-blue);}
.box .more{position:absolute;right:.95rem;bottom:.5rem;color:var(--hy-red);font-size:.8rem;opacity:0;}
.box.done:not(.asking):not(.waiting) .more{opacity:1;animation:nudge .7s ease-in-out infinite alternate;}
@keyframes nudge{to{transform:translateY(3px);}}
/* In-box choices, OoT's green Yes/No with a ▶ cursor that follows hover and the arrow keys. */
.opts{display:none;flex-direction:column;gap:.15rem;margin-top:.55rem;padding-left:1.4rem;}
.box.asking .opts{display:flex;}
.opt{position:relative;background:none;border:none;font:inherit;color:var(--hy-green);text-align:left;cursor:pointer;padding:.15rem .2rem;width:max-content;}
.opt::before{content:'▶';position:absolute;left:-1.3rem;top:.2rem;font-size:.8rem;color:var(--hy-green);opacity:0;}
.opt.on::before{opacity:1;animation:point .5s ease-in-out infinite alternate;}
.opt:focus{outline:none;} .opt:focus-visible{text-decoration:underline;}
@keyframes point{to{transform:translateX(3px);}}

.choices{display:flex;flex-wrap:wrap;gap:.5rem;justify-content:center;}
.choice{font-family:'Syne',sans-serif;font-weight:700;font-size:.95rem;color:var(--text);background:var(--surface);
  border:1px solid var(--border2);border-radius:99px;padding:.6rem 1.1rem;cursor:pointer;animation:rise .3s ease both;}
.choice:hover,.choice:focus-visible{border-color:var(--accent);outline:none;}
.choice.again{border-color:#c8f54270;color:var(--accent);}
.choice:disabled{opacity:.5;cursor:default;}
.choice small{display:block;font-family:'DM Mono',monospace;font-weight:400;font-size:.65rem;color:var(--muted);margin-top:.15rem;}
@keyframes rise{from{opacity:0;transform:translateY(6px);}}

/* The pick, slid in once the owl names it. */
.pick{display:none;gap:.9rem;align-items:center;background:linear-gradient(135deg,var(--surface2),var(--surface));
  border:1px solid var(--border);border-radius:12px;padding:.75rem;animation:rise .4s ease both;}
.pick.show{display:flex;}
.cover{width:72px;height:96px;flex:none;border-radius:8px;object-fit:cover;background:var(--surface2);box-shadow:0 6px 16px #0008;}
.cover-fallback{width:72px;height:96px;flex:none;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:1.8rem;}
.pick-main{min-width:0;display:flex;flex-direction:column;gap:.3rem;}
.pick-title{font-weight:800;font-size:1.05rem;line-height:1.2;overflow-wrap:anywhere;}
.plat{font-family:'DM Mono',monospace;font-size:.65rem;text-transform:uppercase;letter-spacing:.06em;padding:.15rem .5rem;border-radius:99px;align-self:flex-start;}
.badges{display:flex;gap:.35rem;flex-wrap:wrap;}
.plat.kind{background:#c8f54218;color:var(--accent);}
.why{font-family:'DM Mono',monospace;font-size:.75rem;color:var(--muted);line-height:1.5;}
.foot{display:flex;justify-content:center;align-items:center;gap:1rem;font-family:'DM Mono',monospace;font-size:.65rem;color:var(--dim);}
.redo{background:none;border:none;color:var(--muted);font:inherit;text-transform:uppercase;letter-spacing:.08em;cursor:pointer;text-decoration:underline;padding:.4rem;}
.redo[hidden]{display:none;}

@media (prefers-reduced-motion:reduce){
  *,*::before{animation:none !important;transition:none !important;}
}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <a class="back" href="index.html" aria-label="Back to the tracker">←<span class="back-l"> Tracker</span></a>
    <h1>Kaepora Gaebora</h1>

    <svg class="owl arrive" id="owl" viewBox="0 0 160 180" xmlns="http://www.w3.org/2000/svg">

        <linearGradient id="gWing" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7a5430"/><stop offset="1" stop-color="#4a3019"/></linearGradient>

          <rect class="lid" x="87" y="50" width="28" height="28" rx="14" fill="#7c5531"/>
          <!-- the big stern brows -->

        </g>
        </g>
        <!-- talons: outside .breathe, so they stay gripping the branch -->

  </div>

  <div class="box" id="box" tabindex="0">
    <span id="text" aria-hidden="true"></span>
    <div class="opts" id="opts" role="radiogroup" aria-label="Your answer"></div>

  <!-- The typewriter would read out one letter at a time; this gets each whole line instead. -->

<script src="worker-config.js"></script>
<script src="pick.js"></script>
<script>
// ─── Kaepora Gaebora ───────────────────────────────────
// The owl from Ocarina of Time, who gives long-winded advice and then asks whether you'd like
// to hear it again. Here "Yes" is the reroll (the next game down GTPick's ranking) and "No" is
// the commitment: it moves the game to Now Playing through the Worker, exactly like the
// picker's ▶ Start on index.html. The ranking itself is pick.js; this page is only the owl.
const PL={steam:'Steam',steamdeck:'Steam Deck',pc:'PC',ps5:'PS5',switch:'Switch',switch2:'Switch 2',ayn:'AYN Thor',retro:'Retro',wiiu:'Wii U'};
const PC={steam:'#00e5ff',steamdeck:'#a06bff',pc:'#9aa7b8',ps5:'#ff6b4a',switch:'#ff4a6b',switch2:'#4aff8c',ayn:'#ff4af0',retro:'#ffb84a',wiiu:'#009ac7'};
const PLAT_EMOJI={steam:'🖥',steamdeck:'🎮',pc:'💻',ps5:'🎮',switch:'🎮',switch2:'🎮',ayn:'📱',retro:'👾',wiiu:'🎮'};
const CAN_EDIT = !!(typeof WORKER !== 'undefined' && WORKER.url && WORKER.key);
const DEVICE_SAY = { any:'whatever is nearest', pc:'the PC', deck:'the Deck', thor:'the Thor', switch:'the Switch', ps5:'the PS5', wiiu:'the Wii U' };
const MOOD_ASK = { chill:'Something easy on the mind', deep:'Something to sink into', finish:'Wrap something up' };

let G = [], COVERS = {}, PLAY = null, GOTM = null, SRC = {};
let ANS = { device:null, time:null, mood:null };
let PICKS = [], AT = 0, timer = null, finishTyping = null;
// Bumped by every fresh ask(). An await that wakes up in an older conversation (a slow save,
// a line cut off by "Change my answers") checks this and goes quiet instead of talking over it.
let CONV = 0;
try { Object.assign(ANS, JSON.parse(localStorage.getItem('gt_owl') || '{}')); } catch(e){}

function esc(s){ return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
// Lines are built as HTML from these, so user text (titles, genres) is escaped exactly once and
// can't be mistaken for colour markup.
const red = (s) => `<span class="r">${esc(s)}</span>`;
const blue = (s) => `<span class="b">${esc(s)}</span>`;
function todayStr(){
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}
const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
const $ = (id) => document.getElementById(id);

function owlPose(...classes){
  const owl = $('owl');
  owl.classList.remove('tilt', 'tilt-r', 'look-down');
  classes.forEach(c => c && owl.classList.add(c));
}
function flap(){
  const owl = $('owl');
  owl.classList.remove('flap'); void owl.getBoundingClientRect(); owl.classList.add('flap');
}
$('owl').addEventListener('animationend', e => { if (e.animationName.startsWith('flap')) $('owl').classList.remove('flap'); });

// Typed out a couple of characters at a time; tapping the box finishes the line at once.
function say(html){
  return new Promise(resolve => {
    clearInterval(timer);
    const box = $('box'), out = $('text'), owl = $('owl');
    choices([]); opts([]);                          // nothing to answer while the owl is talking
    box.classList.remove('done');
    const tmp = document.createElement('div'); tmp.innerHTML = html;
    $('said').textContent = tmp.textContent;
    const end = () => { clearInterval(timer); out.innerHTML = html; box.classList.add('done'); owl.classList.remove('talking'); finishTyping = null; resolve(); };
    finishTyping = end;
    if (reduced) return end();
    const total = tmp.textContent.length; let n = 0;
    owl.classList.add('talking');
    timer = setInterval(() => {
      n += 2;
      if (n >= total) return end();
      out.innerHTML = clip(html, n);
    }, 22);
  });
}
// The first n visible characters of a marked-up string, tags kept balanced.
function clip(html, n){
  let out = '', seen = 0, open = 0;
  for (let i = 0; i < html.length && seen < n; i++){
    if (html[i] === '<'){
      const j = html.indexOf('>', i); const tag = html.slice(i, j+1);
      open += tag.startsWith('</') ? -1 : 1; out += tag; i = j; continue;
    }
    if (html[i] === '&'){ const j = html.indexOf(';', i); out += html.slice(i, j+1); i = j; seen++; continue; }
    out += html[i]; seen++;
  }
  return out + '</span>'.repeat(Math.max(0, open));
}
$('box').addEventListener('click', e => { if (finishTyping && !e.target.closest('.opt')) finishTyping(); });
$('box').addEventListener('keydown', e => { if ((e.key==='Enter'||e.key===' ') && finishTyping){ e.preventDefault(); finishTyping(); } });

// Answers below the box, for the questions with more than two options.
function choices(list){
  const el = $('choices');
  el.innerHTML = '';
  $('box').classList.toggle('waiting', list.length > 0);   // answers below, so no ▼
  list.forEach(([label, fn, cls, sub]) => {
    const b = document.createElement('button');
    b.type = 'button'; b.className = 'choice' + (cls ? ' ' + cls : '');
    b.textContent = label;
    if (sub){ const s = document.createElement('small'); s.textContent = sub; b.appendChild(s); }
    b.onclick = () => { el.querySelectorAll('button').forEach(x => x.disabled = true); fn(); };
    el.appendChild(b);
  });
}

// Yes/No inside the box, OoT style. The cursor starts on the first option, as it always did.
function opts(list){
  const el = $('opts'), box = $('box');
  el.innerHTML = '';
  box.classList.toggle('asking', list.length > 0);
  if (!list.length) return;
  const btns = list.map(([label, fn, cls], i) => {
    const b = document.createElement('button');
    b.type = 'button'; b.className = 'opt' + (cls ? ' ' + cls : ''); b.textContent = label;
    b.setAttribute('role', 'radio');
    b.onclick = () => { if (b.disabled) return; btns.forEach(x => x.disabled = true); fn(); };
    b.onmouseenter = b.onfocus = () => move(i);
    el.appendChild(b);
    return b;
  });
  let at = 0;
  function move(i){
    at = (i + btns.length) % btns.length;
    btns.forEach((b, j) => { b.classList.toggle('on', j === at); b.setAttribute('aria-checked', j === at); b.tabIndex = j === at ? 0 : -1; });
  }
  el.onkeydown = (e) => {
    if (e.key === 'ArrowDown' || e.key === 'ArrowRight'){ e.preventDefault(); move(at + 1); btns[at].focus(); }
    if (e.key === 'ArrowUp' || e.key === 'ArrowLeft'){ e.preventDefault(); move(at - 1); btns[at].focus(); }
  };
  move(0);
  btns[0].focus({ preventScroll:true });
}

// ─── The conversation ──────────────────────────────────
async function ask(){
  const conv = ++CONV;
  $('pick').classList.remove('show');
  $('count').textContent = '';
  $('redo').hidden = true;
  const { DEVICES, TIMES, MOODS, devicesWithGames } = GTPick;
  const devs = devicesWithGames(G);
  owlPose('tilt');
  await say(`Hoo hoot! Jonny… look up here! Before you go anywhere, answer me this. What have you got in your hands?`);
  if (conv !== CONV) return;
  owlPose('look-down');
  const list = devs.map(k => [DEVICES[k].label, () => { ANS.device = k; askTime(); }]);
  // One tap to repeat the last conversation, while the device it named still has games.
  if (devs.includes(ANS.device) && TIMES[ANS.time] && MOODS[ANS.mood])
    list.unshift(['Same as last time', decide, 'again', `${DEVICES[ANS.device].label} · ${TIMES[ANS.time].label} · ${MOODS[ANS.mood].label}`]);
  choices(list);

  async function askTime(){
    owlPose('tilt-r');
    await say(`${blue(DEVICE_SAY[ANS.device] || DEVICES[ANS.device].label)}, hoo. And how long until you must be on your way?`);
    if (conv !== CONV) return;
    owlPose('look-down');
    choices(Object.entries(TIMES).map(([k,t]) => [t.label, () => { ANS.time = k; askMood(); }]));
  }
  async function askMood(){
    owlPose('tilt');
    await say('Hoo hoo. And what does your heart want tonight?');
    if (conv !== CONV) return;
    owlPose('look-down');
    choices(Object.keys(MOODS).map(k => [MOOD_ASK[k], () => { ANS.mood = k; decide(); }]));
  }
}

async function decide(){
  const conv = CONV;
  try { localStorage.setItem('gt_owl', JSON.stringify(ANS)); } catch(e){}
  PICKS = GTPick.owlLineup(G, SRC, { device:ANS.device, time:ANS.time, mood:ANS.mood, play:PLAY, gotm:GOTM });
  AT = 0;
  if (!PICKS.length){
    owlPose();
    await say(`Hoo… I've nothing for ${blue(DEVICE_SAY[ANS.device] || ANS.device)}. Add something to Up Next, and come find me again.`);
    if (conv === CONV) choices([['Ask again', ask]]);
    return;
  }
  reveal(true);
}

const OPENERS = [
  'Listen well. The road ahead leads to',
  'Very well, then. Hoo. I see',
  'Hmm… this time, look toward',
  'Then hear this, and listen closely:',
  'Hoo hoot! Perhaps instead',
];
// Wildcards come from outside the tracker, so the owl introduces each kind in his own way.
const WILD_OPENERS = {
  'someday':         'From the pile you set aside for someday…',
  'steam-favourite': 'An old friend you haven\'t visited in a while:',
  'steam-unplayed':  'Hoo! Something you own and have never even opened:',
  'retro-started':   'Unfinished business, from your old adventures:',
  'retro-club':      'The club is still waiting on this one:',
  'retro-canon':     'A legend of an older age, never set down in your log:',
};
const MOOD_SAY = { chill:'easy on the mind', deep:'one to sink into', finish:'close to done' };

async function reveal(first){
  const conv = CONV;
  const p = PICKS[AT];
  $('pick').classList.remove('show');
  $('count').textContent = `${AT+1} of ${PICKS.length}`;
  $('redo').hidden = false;
  owlPose();
  // Honest when the best he has doesn't match the mood you asked for.
  if (first && ANS.mood && !p.fits){
    await say(`Hoo… nothing on ${blue(DEVICE_SAY[ANS.device] || ANS.device)} is truly ${esc(MOOD_SAY[ANS.mood] || 'what you asked for')}. If you insist…`);
    if (conv !== CONV) return;
  }
  const opener = WILD_OPENERS[p.kind] || (first ? OPENERS[0] : OPENERS[1 + (AT - 1) % (OPENERS.length - 1)]);
  const why = p.reasons.length ? ' ' + esc(p.reasons.join('. ')) + '.' : '';
  await say(`${esc(opener)} ${red(p.t)}.${why}`);
  if (conv !== CONV) return;
  showCard(p);
  owlPose('tilt');
  await say('Hoo hoot! …Did you get all that? Do you want to hear it again?');
  if (conv !== CONV) return;
  opts([['Yes', again], ['No', () => commit(p)]]);
}

async function again(){
  const conv = CONV;
  AT++;
  if (AT >= PICKS.length){
    AT = 0;
    flap();
    owlPose();
    await say("Hoo… that's every road I know. Very well. From the beginning, then.");
    if (conv !== CONV) return;
  }
  reveal(false);
}

async function commit(p){
  const conv = CONV;
  const g = p.g;
  owlPose();
  let line;
  if ((g && (g.s === 'playing' || g.s === 'ongoing')) || !CAN_EDIT){
    line = `Hoo hoo hoo! Then off you go to ${red(p.t)}. I'll be watching.`;
  } else {
    await say('Hoo…');
    const ok = g ? await startGame(g) : await addGame(p);
    if (conv !== CONV) return;
    line = ok
      ? `Hoo hoo hoo! ${red(p.t)} is in Now Playing. Off you go. I'll be watching.`
      : `Hoo… the message didn't reach the tracker. Go play ${red(p.t)} anyway, and mark it later.`;
  }
  flap();
  await say(line);
  if (conv !== CONV) return;
  choices([['Ask me again', ask], ['Back to the tracker', () => { location.href = 'index.html'; }]]);
}

async function postWorker(path, body){
  try {
    const res = await fetch(WORKER.url + path, {
      method:'POST',
      headers:{ 'Content-Type':'application/json', 'X-Sync-Key': WORKER.key },
      body: JSON.stringify(body),
    });
    if (!res.ok) throw new Error(`request failed (${res.status})`);
    return true;
  } catch (err) {
    console.error('Save failed', path, err);
    return false;
  }
}
// A tracked or Someday game: the same edit as the picker's ▶ Start on index.html.
async function startGame(g){
  const ok = await postWorker('/games/edit', { id: g.id, s:'playing', start: todayStr() });
  if (ok) g.s = 'playing';
  return ok;
}
// A wildcard isn't in the tracker yet: add it as Now Playing, like add.html would. The Worker
// assigns the id and kicks off the sync and cover backfill, which fill in hours, art and HLTB.
async function addGame(p){
  const w = p.w || {};
  const body = { t: p.t, p: p.p, s:'playing', start: todayStr() };
  if (w.g) body.g = w.g;
  if (w.year) body.y = w.year;
  if (w.kind === 'retro-club' && w.tag) body.gotm = w.tag;
  const ok = await postWorker('/games/add', body);
  if (ok) PICKS = PICKS.filter(x => x !== p);
  return ok;
}

const KIND_BADGE = {
  'someday':'Someday', 'steam-favourite':'Old favourite', 'steam-unplayed':'Never started',
  'retro-started':'Unfinished', 'retro-club':'Club pick', 'retro-canon':'Must-play',
};
function coverFor(p){
  if (p.g) return COVERS[p.g.t.toLowerCase()] || null;
  if (p.w && p.w.appid) return `https://cdn.cloudflare.steamstatic.com/steam/apps/${p.w.appid}/library_600x900.jpg`;
  return null;
}
function showCard(p){
  const url = coverFor(p), color = PC[p.p] || '#555';
  const fallback = `<div class="cover-fallback" style="background:${color}20;color:${color}${url ? ';display:none' : ''}">${PLAT_EMOJI[p.p] || '🎮'}</div>`;
  const art = url ? `<img class="cover" src="${esc(url)}" alt="" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'">${fallback}` : fallback;
  const plat = (p.w && p.w.console) || PL[p.p] || p.p;
  const kind = KIND_BADGE[p.kind] ? `<span class="plat kind">${esc(KIND_BADGE[p.kind])}</span>` : '';
  const el = $('pick');
  el.innerHTML = `${art}<div class="pick-main"><div class="pick-title">${esc(p.t)}</div>
    <div class="badges"><span class="plat" style="background:${color}22;color:${color}">${esc(plat)}</span>${kind}</div>
    <div class="why">${p.reasons.map(esc).join(' · ')}</div></div>`;
  el.classList.add('show');
}

// ─── Music ─────────────────────────────────────────────
// The 8-Bit Big Band's cover of Kaepora Gaebora's theme, through YouTube's own embedded player.
// YouTube's terms require the player to stay visible (at least 200x200) rather than hidden for
// audio only, and hosting the audio ourselves would redistribute someone else's recording, so
// it lives in a small music box at the bottom of the page, credited, while it plays.
//
// On by default, but browsers only allow sound after a tap or key press, so it starts on the
// first one (answering his first question is one). Nothing loads from YouTube before that.
// Turning it off with the ♪ (or the box's own ✕) is remembered.
const THEME = '3KzclsqNxtw';
let YT_PLAYER = null, ytLoading = null;
function loadYouTube(){
  if (ytLoading) return ytLoading;
  ytLoading = new Promise((resolve, reject) => {
    window.onYouTubeIframeAPIReady = resolve;
    const s = document.createElement('script');
    s.src = 'https://www.youtube.com/iframe_api';
    s.onerror = () => { ytLoading = null; reject(new Error('YouTube unreachable')); };
    document.head.appendChild(s);
  });
  return ytLoading;
}
async function musicOn(){
  $('music').setAttribute('aria-pressed', 'true');
  $('musicbox').hidden = false;
  try {
    await loadYouTube();
    if (YT_PLAYER){ YT_PLAYER.playVideo(); return; }
    YT_PLAYER = new YT.Player('yt', {
      videoId: THEME,
      playerVars: { autoplay: 1, loop: 1, playlist: THEME, playsinline: 1, rel: 0, modestbranding: 1 },
      events: { onReady: e => { e.target.setVolume(50); e.target.playVideo(); } },
    });
  } catch (err) {
    console.warn('Music unavailable', err);
    musicOff(false);
    $('music').title = "Couldn't reach YouTube";
  }
}
function musicOff(remember = true){
  $('music').setAttribute('aria-pressed', 'false');
  $('musicbox').hidden = true;
  if (YT_PLAYER && YT_PLAYER.pauseVideo) YT_PLAYER.pauseVideo();
  if (remember) try { localStorage.setItem('gt_owl_music', '0'); } catch(e){}
}
function toggleMusic(){
  if ($('music').getAttribute('aria-pressed') === 'true') return musicOff();
  try { localStorage.setItem('gt_owl_music', '1'); } catch(e){}
  musicOn();
}
try {
  if (localStorage.getItem('gt_owl_music') !== '0'){
    const first = (e) => {
      document.removeEventListener('pointerdown', first); document.removeEventListener('keydown', first);
      if (!(e.target.closest && e.target.closest('#music, #musicbox'))) musicOn();
    };
    document.addEventListener('pointerdown', first); document.addEventListener('keydown', first);
  }
} catch(e){}

// A sky of stars, placed once. Kept out of the top-right so the moon has room.
(function stars(){
  const scene = $('scene');
  for (let i = 0; i < 38; i++){
    const s = document.createElement('div'); s.className = 'star';
    let x, y; do { x = Math.random() * 100; y = Math.random() * 55; } while (x > 72 && y < 38);
    const size = Math.random() < .2 ? 3 : 2;
    Object.assign(s.style, { left: x + '%', top: y + '%', width: size + 'px', height: size + 'px', animationDelay: (Math.random() * 3).toFixed(2) + 's' });
    scene.insertBefore(s, scene.firstChild);
  }
})();

// ─── Load ──────────────────────────────────────────────
// Same cache-busting reads and GOTM window refresh as index.html (see the notes there).
const fresh = (file) => fetch(`${file}?_=${Date.now()}`);
function refreshGotmWindows(gotm, now = new Date()){
  if (!gotm || !Array.isArray(gotm.picks)) return gotm;
  const nowIdx = now.getFullYear() * 12 + now.getMonth();
  for (const p of gotm.picks){
    const m = /^(\d{4})-(\d{2})$/.exec(p.month || '');
    if (!m) continue;
    p.monthsLeft = Number(m[1]) * 12 + (Number(m[2]) - 1) + 12 - nowIdx;
    p.retired = p.monthsLeft <= 0;
  }
  return gotm;
}
Promise.all([
  fresh('games.json').then(r => r.json()),
  fresh('covers.json').then(r => r.ok ? r.json() : {}).catch(() => ({})),
  fresh('gotm.json').then(r => r.ok ? r.json() : null).catch(() => null),
  fresh('play-check.json').then(r => r.ok ? r.json() : null).catch(() => null),
  // The owl's wildcards; any of these missing just means fewer of them.
  fresh('library.json').then(r => r.ok ? r.json() : {}).catch(() => ({})),
  fresh('library-meta.json').then(r => r.ok ? r.json() : {}).catch(() => ({})),
  fresh('retro-canon.json').then(r => r.ok ? r.json() : []).catch(() => []),
  // Let him land before he starts talking.
  new Promise(r => setTimeout(r, reduced ? 0 : 900)),
]).then(([games, covers, gotm, play, library, meta, canon]) => {
  G = games; COVERS = covers; GOTM = refreshGotmWindows(gotm); PLAY = play;
  SRC = { library, meta, canon, gotm: GOTM };
  ask();
}).catch(err => {
  console.error('Failed to load game data', err);
  say(`Hoo… I can't see the tracker from here (${esc(err.message || 'network error')}). Try again in a moment.`);
  choices([['Try again', () => location.reload()]]);
});
