<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Game Tracker</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>%F0%9F%8E%AE</text></svg>">
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg:#0e0e10;--surface:#17171a;--surface2:#1f1f24;
  --border:#2a2a30;--border2:#3a3a42;--text:#f0f0f0;
  --muted:#888890;--dim:#555560;--accent:#c8f542;
  --playing:#42c8f5;--done:#42f5a0;--dropped:#f54242;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
body{background:var(--bg);color:var(--text);font-family:'Syne',sans-serif;min-height:100vh;padding:2rem 1rem;padding-bottom:max(2rem,env(safe-area-inset-bottom));}
.header{display:flex;align-items:baseline;gap:1rem;margin-bottom:0.5rem;position:sticky;top:0;z-index:10;background:var(--bg);padding:0.75rem 0;}
h1{font-size:2rem;font-weight:800;letter-spacing:-0.04em;color:var(--accent);}
.edit-toggle{font-family:'DM Mono',monospace;font-size:0.65rem;text-transform:uppercase;letter-spacing:0.08em;padding:0.4rem 0.8rem;border-radius:99px;border:1px solid var(--border2);background:transparent;color:var(--muted);cursor:pointer;}
.edit-toggle.active{background:var(--accent);color:#0e0e10;border-color:var(--accent);font-weight:700;}
.add-link{margin-left:auto;font-family:'DM Mono',monospace;font-size:0.65rem;text-transform:uppercase;letter-spacing:0.08em;padding:0.4rem 0.8rem;border-radius:99px;border:1px solid var(--accent);background:#c8f54218;color:var(--accent);text-decoration:none;font-weight:700;white-space:nowrap;}
.add-link:hover{background:#c8f54230;}

/* Cards link to their own edit form. draggable=false + user-drag:none because anchors are
   natively draggable, which would otherwise fight Edit mode's pointer-drag for the same
   gesture. The link is a plain wrapper — all card visuals stay on the card inside it, so
   hover and drop-target styling are untouched. */
.card-link{display:block;text-decoration:none;color:inherit;-webkit-user-drag:none;}
.card-link:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:10px;}

/* Edit mode: draggable cards in the three active-management sections only (never Archive/
   Year Log). Continuous pointer-drag — and the touch-action:none it needs to stop the
   browser's own scroll gesture from fighting it — is a fine-pointer-only affordance now;
   coarse pointers (touch) get the tap-to-move flow below instead, which needs no gesture
   capture at all, so scrolling stays completely normal on phones in Edit mode. */
@media (hover:hover) and (pointer:fine){
  body.edit-mode #now .hero-card,body.edit-mode #queue .card,body.edit-mode #soon .card{
    touch-action:none;cursor:grab;
  }
}
.dragging{box-shadow:0 12px 32px rgba(0,0,0,0.5);}
#now.drop-hover,#queue.drop-hover,#soon.drop-hover,#now.move-target,#queue.move-target,#soon.move-target{
  outline:2px dashed var(--accent);outline-offset:6px;border-radius:8px;background:#c8f54212;
}
.move-picked{outline:2px solid var(--accent);outline-offset:2px;opacity:0.6;border-radius:10px;}

/* Mobile tap-to-move bar: fixed to the bottom, matches the phone-first safe-area handling
   already used on <body>. Sits above everything (z-index) since it's a modal-ish "you're in
   the middle of an action" affordance, not passive chrome. */
.move-bar{
  position:fixed;left:0;right:0;bottom:0;z-index:1001;display:flex;align-items:center;gap:0.75rem;
  padding:0.85rem 1rem;padding-bottom:max(0.85rem,env(safe-area-inset-bottom));
  background:var(--surface);border-top:1px solid var(--border2);box-shadow:0 -8px 24px rgba(0,0,0,0.4);
}
.move-bar-title{flex:1;min-width:0;font-size:0.85rem;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.move-bar-hint{font-family:'DM Mono',monospace;font-size:0.62rem;color:var(--muted);text-transform:uppercase;letter-spacing:0.06em;white-space:nowrap;}
.move-bar button{font-family:'DM Mono',monospace;font-size:0.68rem;text-transform:uppercase;letter-spacing:0.06em;
  padding:0.5rem 0.9rem;border-radius:8px;border:1px solid var(--border2);background:transparent;color:var(--text);cursor:pointer;}
.updated{font-family:'DM Mono',monospace;font-size:0.62rem;color:var(--dim);margin-bottom:1.5rem;}
/* Amber once the sync is older than a scheduled run: the stamp used to show a plain date, so
   a sync that had been broken for weeks looked no different from one that ran this morning. */
.updated.stale{color:#f5a042;}

/* Page-level load failure, so an error can't be mistaken for an empty tracker. */
.banner{display:none;align-items:center;gap:0.75rem;flex-wrap:wrap;background:#f5424218;
  border:1px solid #f5424230;color:#f54242;border-radius:8px;padding:0.75rem 0.9rem;
  font-family:'DM Mono',monospace;font-size:0.72rem;margin-bottom:1.5rem;}
.banner-btn{font-family:'DM Mono',monospace;font-size:0.68rem;text-transform:uppercase;
  letter-spacing:0.08em;padding:0.35rem 0.7rem;border-radius:6px;cursor:pointer;
  background:transparent;color:#f54242;border:1px solid #f5424260;}

/* GOTM club strip. Club picks stay claimable for 12 months and then expire, so the ordering
   that matters is time remaining, not recency — this is a deadline list, not a feed. */
.gotm-sec{background:var(--surface);border:1px solid var(--border);border-radius:10px;
  padding:0.85rem 0.9rem;margin-bottom:1.5rem;}
.gotm-head{display:flex;align-items:baseline;gap:0.6rem;flex-wrap:wrap;margin-bottom:0.15rem;}
.gotm-head h2{font-size:0.72rem;font-family:'DM Mono',monospace;text-transform:uppercase;
  letter-spacing:0.12em;color:var(--accent);font-weight:700;}
.gotm-sub{font-family:'DM Mono',monospace;font-size:0.6rem;color:var(--dim);}
.gotm-sub a{color:var(--muted);}
.gotm-rows{display:flex;flex-direction:column;gap:4px;margin-top:0.6rem;}
.gotm-row{display:flex;align-items:center;gap:0.5rem;flex-wrap:wrap;
  padding:0.4rem 0.5rem;border-radius:7px;background:var(--surface2);
  border-left:3px solid var(--dim);}
.gotm-row.urgent{border-left-color:#f54242;background:#f5424212;}
.gotm-row.soonish{border-left-color:#f5a042;background:#f5a04210;}
.gotm-row.current{border-left-color:var(--accent);}
.gotm-left{font-family:'DM Mono',monospace;font-size:0.62rem;font-weight:700;min-width:4.4em;flex-shrink:0;}
.gotm-row.urgent .gotm-left{color:#f54242;}
.gotm-row.soonish .gotm-left{color:#f5a042;}
.gotm-row:not(.urgent):not(.soonish) .gotm-left{color:var(--muted);}
.gotm-name{flex:1;font-size:0.8rem;font-weight:600;min-width:0;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap;}
.gotm-name a{color:inherit;text-decoration:none;}
.gotm-name a:hover{text-decoration:underline;}
.gotm-state{font-family:'DM Mono',monospace;font-size:0.58rem;padding:2px 7px;border-radius:99px;
  white-space:nowrap;background:#ffffff08;color:var(--muted);border:1px solid #ffffff12;}
.gotm-state.act{background:#c8f54218;color:var(--accent);border-color:#c8f54230;}
.gotm-foot{font-family:'DM Mono',monospace;font-size:0.58rem;color:var(--dim);margin-top:0.55rem;line-height:1.5;}
.gotm-warn{color:#f5a042;}

/* Loading placeholders. The shimmer is gated on prefers-reduced-motion; the boxes themselves
   still convey "content is coming" without it. */
.skel{background:var(--surface);border:1px solid var(--border);border-radius:10px;}
@media (prefers-reduced-motion:no-preference){
  .skel{background:linear-gradient(90deg,var(--surface) 25%,var(--surface2) 50%,var(--surface) 75%);
    background-size:200% 100%;animation:skel 1.4s ease-in-out infinite;}
  @keyframes skel{0%{background-position:200% 0;}100%{background-position:-200% 0;}}
}
.stats-row{display:flex;gap:0.5rem;margin-bottom:2rem;flex-wrap:wrap;}
.stat{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:0.75rem 1rem;text-align:center;min-width:72px;flex:1;}
.stat-n{font-size:1.5rem;font-weight:800;line-height:1;}
.stat-l{font-size:0.62rem;font-family:'DM Mono',monospace;color:var(--muted);margin-top:3px;text-transform:uppercase;letter-spacing:0.08em;}
.slabel{font-size:0.65rem;font-weight:400;font-family:'DM Mono',monospace;color:var(--dim);text-transform:uppercase;letter-spacing:0.12em;margin-bottom:0.6rem;margin-top:1.5rem;}
section:first-of-type .slabel{margin-top:0;}
.game-list{display:flex;flex-direction:column;gap:5px;}

/* Cards */
.card{background:var(--surface);border:1px solid var(--border);border-radius:10px;overflow:hidden;display:flex;flex-direction:row;transition:border-color 0.15s;}
.card:hover{border-color:var(--border2);}
.card.now{border-left:3px solid var(--playing);}
.card.dormant{border-left:3px solid var(--dim);opacity:0.75;}
.card.faded{opacity:0.55;}

/* Hover-lift only for devices with real mouse hover — gated so touch/mobile never gets a
   half-working hover state. Nothing is ever hidden behind hover; this is pure polish. */
@media (hover:hover) and (pointer:fine){
  .card{transition:border-color 0.15s, transform 0.15s ease, box-shadow 0.15s ease;}
  .card:hover{transform:translateY(-2px);box-shadow:0 6px 16px rgba(0,0,0,0.35);}
}

/* Thumbnail */
.thumb{width:88px;min-width:88px;height:66px;object-fit:cover;object-position:center;display:block;align-self:center;margin:8px 0 8px 8px;border-radius:4px;}
.thumb-placeholder{width:88px;min-width:88px;height:66px;display:flex;align-items:center;justify-content:center;font-size:1.6rem;flex-shrink:0;align-self:center;margin:8px 0 8px 8px;border-radius:4px;}

/* Now Playing: Steam Deck-style capsule cards — landscape art band (460:215, the real Steam
   capsule ratio your existing Steam header images are already shaped for) on top, metadata
   in a normal-flow panel below rather than overlaid on the image. An overlay would've meant
   either cropping real data (genre/GOTM/mastery/diff/achievements) to fit a short strip, or
   fighting for contrast against busy art — a separate panel avoids both for free.
   auto-fit collapses to a single column on phones with no media query needed. */
.hero-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:1rem;}
.hero-card{background:var(--surface);border:1px solid var(--border);border-radius:6px;overflow:hidden;}
.hero-card.now{box-shadow:0 0 0 2px var(--playing) inset;}
.hero-card.dormant{opacity:0.7;box-shadow:0 0 0 2px var(--dim) inset;}
/* Crisp hover highlight, gated to real pointer devices only (see the .card rule above for
   why) — the closest honest equivalent to Steam Deck's focus ring, which is actually
   gamepad/keyboard focus, not mouse hover; these cards aren't a keyboard-navigable grid. */
@media (hover:hover) and (pointer:fine){
  .hero-card{transition:box-shadow 0.15s ease, transform 0.15s ease;}
  .hero-card:hover{transform:scale(1.015);box-shadow:0 0 0 2px var(--text), 0 8px 20px rgba(0,0,0,0.4);}
}
.hero-art{position:relative;aspect-ratio:460/215;background:var(--surface2);}
.hero-bg-img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center;}
.hero-bg-fallback{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:3rem;}
.hero-top{position:absolute;top:8px;right:8px;z-index:2;}
.hero-content{padding:10px 12px;display:flex;flex-direction:column;gap:6px;}
/* Two lines rather than one ellipsised line: hero cards have the vertical room, and a
   single nowrap line was truncating real titles ("Castlevania: Symphony of the Night").
   Titles carry a title="" tooltip too, for anything still long enough to clip at two lines. */
.hero-title{font-size:0.95rem;font-weight:700;color:var(--text);line-height:1.25;overflow:hidden;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;}
.hero-meta{display:flex;flex-wrap:wrap;gap:0.35rem;align-items:center;}
.hero-hltb{display:flex;gap:0.5rem;}

/* Up Next: same cards as before, just wrapped so they flow into columns on wider screens
   instead of one long vertical list. Collapses to a single column on phones same as above. */
.queue-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:8px;}

/* Card content */
.card-content{flex:1;padding:0.65rem 0.75rem;display:flex;flex-direction:column;gap:5px;min-width:0;}
.row1{display:flex;align-items:center;gap:0.5rem;min-width:0;margin-top:4px;}
.row2{display:flex;align-items:center;gap:0.4rem;flex-wrap:wrap;}
.row3{padding-top:2px;}
.qnum{font-family:'DM Mono',monospace;font-size:0.7rem;color:var(--dim);min-width:18px;text-align:center;flex-shrink:0;}
.gtitle{flex:1;font-size:0.9rem;font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}

@media(max-width:400px){
  .thumb{width:72px;min-width:72px;height:54px;}
  .thumb-placeholder{width:40px;min-width:40px;height:40px;font-size:1.1rem;}
  .gtitle{font-size:0.85rem;}
  .hltb{font-size:0.7rem;}
}

/* HLTB + playtime */
.hltb{font-family:'DM Mono',monospace;font-size:0.78rem;font-weight:700;color:#42c8f5;white-space:nowrap;flex-shrink:0;letter-spacing:-0.02em;}
.hltb-sm{font-size:0.55rem;font-weight:400;opacity:0.65;}
.actual-time{font-family:'DM Mono',monospace;font-size:0.65rem;color:#a06bff;white-space:nowrap;flex-shrink:0;}

/* Platform badges */
.plat{font-family:'DM Mono',monospace;font-size:0.6rem;padding:3px 7px;border-radius:99px;white-space:nowrap;flex-shrink:0;letter-spacing:0.04em;}
.p-steam    {background:#00e5ff22;color:#00e5ff;border:1px solid #00e5ff44;}
.p-steamdeck{background:#a06bff22;color:#a06bff;border:1px solid #a06bff44;}
.p-ps5      {background:#ff6b4a22;color:#ff6b4a;border:1px solid #ff6b4a44;}
.p-switch   {background:#ff4a6b22;color:#ff4a6b;border:1px solid #ff4a6b44;}
.p-switch2  {background:#4aff8c22;color:#4aff8c;border:1px solid #4aff8c44;}
.p-ayn      {background:#ff4af022;color:#ff4af0;border:1px solid #ff4af044;}
.p-retro    {background:#ffb84a22;color:#ffb84a;border:1px solid #ffb84a44;}
.p-wiiu     {background:#009ac722;color:#009ac7;border:1px solid #009ac744;}

/* Meta pills */
.yr{font-family:'DM Mono',monospace;font-size:0.62rem;color:var(--dim);}
.genre-tag{font-size:0.6rem;font-family:'DM Mono',monospace;padding:2px 7px;border-radius:4px;background:#ffffff08;color:var(--muted);white-space:nowrap;}
.rating{font-family:'DM Mono',monospace;font-size:0.7rem;font-weight:600;color:var(--accent);}
.gotm{font-size:0.58rem;font-family:'DM Mono',monospace;padding:2px 7px;border-radius:99px;background:#c8f54218;color:var(--accent);border:1px solid #c8f54230;white-space:nowrap;}
.dropped-pill{font-size:0.58rem;font-family:'DM Mono',monospace;padding:2px 7px;border-radius:99px;background:#f5424218;color:var(--dropped);border:1px solid #f5424230;white-space:nowrap;}
.note-pill{font-size:0.58rem;font-family:'DM Mono',monospace;padding:2px 7px;border-radius:99px;background:#a06bff18;color:#a06bff;border:1px solid #a06bff30;white-space:nowrap;}
.dormant-pill{font-size:0.58rem;font-family:'DM Mono',monospace;padding:2px 7px;border-radius:99px;background:#55556018;color:var(--dim);border:1px solid #55556030;white-space:nowrap;}
.casual-pill{font-size:0.58rem;font-family:'DM Mono',monospace;padding:2px 7px;border-radius:99px;background:#42c8f510;color:#42c8f580;border:1px solid #42c8f520;white-space:nowrap;}
.start-pill{font-size:0.58rem;font-family:'DM Mono',monospace;padding:2px 7px;border-radius:99px;background:#c8f54210;color:#c8f54270;border:1px solid #c8f54220;white-space:nowrap;}
.queued-pill{font-size:0.58rem;font-family:'DM Mono',monospace;padding:2px 7px;border-radius:99px;background:#55556015;color:var(--dim);border:1px solid #55556025;white-space:nowrap;}
.lp-pill{font-size:0.58rem;font-family:'DM Mono',monospace;padding:2px 7px;border-radius:99px;background:#ffffff08;color:var(--muted);border:1px solid #ffffff10;white-space:nowrap;}

/* Mastery */
.mast{font-size:0.58rem;font-family:'DM Mono',monospace;padding:2px 7px;border-radius:99px;white-space:nowrap;}
.mast-progress{background:#f5c84218;color:#f5c842;border:1px solid #f5c84230;}
.mast-mastered{background:#ffb84a22;color:#ffb84a;border:1px solid #ffb84a44;}
.mast-platinum{background:#c8b4ff22;color:#c8b4ff;border:1px solid #c8b4ff44;}
.mast-100{background:#42f5a022;color:var(--done);border:1px solid #42f5a044;}

/* Difficulty */
.diff{font-size:0.58rem;font-family:'DM Mono',monospace;padding:2px 7px;border-radius:99px;white-space:nowrap;}
.diff-1{background:#42f5a018;color:#42f5a0;border:1px solid #42f5a030;}
.diff-2{background:#42c8f518;color:#42c8f5;border:1px solid #42c8f530;}
.diff-3{background:#f5e04218;color:#f5e042;border:1px solid #f5e04230;}
.diff-4{background:#f5a04218;color:#f5a042;border:1px solid #f5a04230;}
.diff-5{background:#f5424218;color:#f54242;border:1px solid #f5424230;}

/* Achievement bar */
.ach-bar-wrap{display:flex;align-items:center;gap:8px;}
.ach-bar-track{flex:1;background:var(--surface2);border-radius:3px;height:4px;overflow:hidden;}
.ach-bar-fill{height:4px;border-radius:3px;}
.ach-pct{font-family:'DM Mono',monospace;font-size:0.58rem;color:var(--muted);min-width:48px;text-align:right;flex-shrink:0;}
.ach-lbl{font-family:'DM Mono',monospace;font-size:0.55rem;color:var(--dim);flex-shrink:0;}

/* Collapsible */
.cr{display:flex;align-items:center;gap:0.5rem;cursor:pointer;padding:0.85rem 0;color:var(--dim);font-size:0.68rem;font-family:'DM Mono',monospace;text-transform:uppercase;letter-spacing:0.1em;border-top:1px solid var(--border);margin-top:1.5rem;user-select:none;touch-action:manipulation;}
.cr:hover{color:var(--muted);}
.cr:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px;}

.search-box{width:100%;background:var(--surface);border:1px solid var(--border);border-radius:8px;color:var(--text);font-family:'Syne',sans-serif;font-size:0.85rem;padding:0.6rem 0.8rem;margin-bottom:0.75rem;}
.search-box::placeholder{color:var(--dim);}
.search-box:focus{outline:none;border-color:var(--accent);}

/* Year log */
.yg{margin-bottom:1.5rem;}
.yhead{font-size:1rem;font-weight:700;color:var(--accent);margin-bottom:0.75rem;display:flex;align-items:baseline;gap:0.75rem;}
.ysub{font-size:0.7rem;font-family:'DM Mono',monospace;color:var(--muted);font-weight:400;}
.ystats{display:grid;grid-template-columns:repeat(auto-fill,minmax(80px,1fr));gap:6px;margin-bottom:1rem;}
.ys{background:var(--surface2);border-radius:6px;padding:8px 10px;text-align:center;}
.ys-n{font-size:1.1rem;font-weight:800;}
.ys-l{font-size:0.58rem;font-family:'DM Mono',monospace;color:var(--muted);margin-top:2px;text-transform:uppercase;}
.bsec{margin-bottom:0.75rem;}
.blbl{font-size:0.58rem;font-family:'DM Mono',monospace;color:var(--dim);text-transform:uppercase;letter-spacing:0.1em;margin-bottom:4px;}
.brow{display:flex;align-items:center;gap:8px;margin:3px 0;}
.bname{font-size:0.68rem;font-family:'DM Mono',monospace;color:var(--muted);width:110px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex-shrink:0;}
.btrack{flex:1;background:var(--surface2);border-radius:2px;height:4px;}
.bfill{height:4px;border-radius:2px;}
.bval{font-size:0.62rem;font-family:'DM Mono',monospace;color:var(--dim);min-width:14px;text-align:right;}
.hlg{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:1rem 0;}
.hl{background:var(--surface2);border-radius:8px;padding:10px 12px;}
.hl-l{font-size:0.58rem;font-family:'DM Mono',monospace;color:var(--dim);text-transform:uppercase;letter-spacing:0.08em;}
.hl-v{font-size:0.8rem;font-weight:700;margin-top:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.hl-s{font-size:0.62rem;font-family:'DM Mono',monospace;color:var(--muted);}
.mg{margin-bottom:1rem;}
.mh{font-size:0.6rem;font-family:'DM Mono',monospace;color:var(--dim);text-transform:uppercase;letter-spacing:0.1em;margin-bottom:6px;}
.empty{color:var(--dim);font-size:0.8rem;font-family:'DM Mono',monospace;padding:0.5rem 0;}
</style>
</head>
<body>
<div class="header"><h1>GAME LOG</h1><a id="add-link" class="add-link" href="add.html" style="display:none;">+ Add game</a><button id="edit-toggle" class="edit-toggle" style="display:none;" onclick="setEditMode(!editMode)">Edit mode: Off</button></div>
<div class="move-bar" id="move-bar" style="display:none;" role="status">
  <span class="move-bar-title" id="move-bar-title"></span>
  <span class="move-bar-hint">Tap a section, or</span>
  <button type="button" onclick="cancelMoveMode()">Cancel</button>
</div>
<div class="updated" id="updated-stamp">loading…</div>
<div class="banner" id="load-error" role="alert"></div>
<div class="stats-row" id="stats"></div>
<section class="gotm-sec" id="gotm-sec" style="display:none;" aria-labelledby="gotm-heading"></section>
<section aria-labelledby="now-playing-heading">
  <h2 class="slabel" id="now-playing-heading">Now playing</h2>
  <div class="hero-grid" id="now"></div>
</section>
<section aria-labelledby="up-next-heading">
  <h2 class="slabel" id="up-next-heading">Up next</h2>
  <div class="queue-grid" id="queue"></div>
</section>
<section aria-label="Soon">
  <div class="cr" id="so-toggle" role="button" tabindex="0" aria-expanded="false" aria-controls="so-panel" onclick="tog('so')" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();tog('so');}"><span id="so-arr" aria-hidden="true">▶</span><span id="so-lbl">Soon™ (0)</span></div>
  <div id="so-panel" style="display:none;margin-top:0.75rem;">
    <div class="queue-grid" id="soon"></div>
  </div>
</section>

<section aria-label="Archive">
  <div class="cr" id="ar-toggle" role="button" tabindex="0" aria-expanded="false" aria-controls="ar-panel" onclick="tog('ar')" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();tog('ar');}"><span id="ar-arr" aria-hidden="true">▶</span><span id="ar-lbl">Archive (0)</span></div>
  <div id="ar-panel" style="display:none;margin-top:0.75rem;">
    <input type="text" id="ar-search" class="search-box" placeholder="Search archive by title…" aria-label="Search archive by title" oninput="renderPanels()">
    <div id="ar-list"></div>
  </div>
</section>
<section aria-label="Year log">
  <div class="cr" id="yl-toggle" role="button" tabindex="0" aria-expanded="false" aria-controls="yl-panel" onclick="tog('yl')" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();tog('yl');}"><span id="yl-arr" aria-hidden="true">▶</span><span>Year log</span></div>
  <div id="yl-panel" style="display:none;margin-top:0.75rem;"></div>
</section>

<script src="worker-config.js"></script>
<script>
// Data lives in games.json/covers.json, kept current by the daily GitHub Action
// (scripts/sync-apis.mjs) instead of being hand-edited into a `const G=[...]` here.
// Everything below — every render function, every pill, the whole Year Log/Archive
// engine — carries over unchanged from the hand-maintained version; only how the
// data arrives changed.
let COVERS = {};
let G = [];

const M=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const PL={steam:'Steam',steamdeck:'Steam Deck',ps5:'PS5',switch:'Switch',switch2:'Switch 2',ayn:'AYN Thor',retro:'Retro',wiiu:'Wii U'};
const PC={steam:'#00e5ff',steamdeck:'#a06bff',ps5:'#ff6b4a',switch:'#ff4a6b',switch2:'#4aff8c',ayn:'#ff4af0',retro:'#ffb84a',wiiu:'#009ac7'};
const PLAT_EMOJI={steam:'🖥',steamdeck:'🎮',ps5:'🎮',switch:'🎮',switch2:'🎮',ayn:'📱',retro:'👾',wiiu:'🎮'};
const DIFF_LABELS={1:'Easy',2:'Normal',3:'Hard',4:'Expert',5:'Brutal'};
let NOW = new Date();
let open={ar:false,yl:false,so:false};
// Whether the Worker is configured. Cards only become links to their edit form when it is,
// for the same reason the "+ Add game" link is hidden otherwise: add.html can't do anything
// but show its setup notice, so the link would be a dead end.
const CAN_EDIT = !!(typeof WORKER !== 'undefined' && WORKER.url && WORKER.key);

// Titles, genres and notes are free text entered through add.html and interpolated into
// markup below — including into attributes now that cards carry title="" tooltips and link
// hrefs. games.json already contains "Suikoden I & II HD", whose bare ampersand is only
// tolerated by browser error recovery, and a title containing a double quote would break out
// of an attribute outright. One helper, applied at every interpolation of user text.
function esc(s){
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function getCover(g) {
  return COVERS[g.t.toLowerCase()] || null;
}

function thumbEl(g) {
  const url = getCover(g);
  const color = PC[g.p] || '#555';
  const emoji = PLAT_EMOJI[g.p] || '🎮';
  if (url) {
    return `<img class="thumb" src="${url}" alt="${esc(g.t)}" loading="lazy" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'">
            <div class="thumb-placeholder" style="background:${color}18;color:${color};display:none">${emoji}</div>`;
  }
  return `<div class="thumb-placeholder" style="background:${color}18;color:${color}">${emoji}</div>`;
}

// Same cover-art lookup as thumbEl, but fills the Now Playing hero cards' capsule art band.
// Games without real cover art (most non-Steam platforms right now — see the covers.json
// gap) get a colored gradient + big platform emoji instead of a broken image or an empty
// box, so a missing cover still reads as "styled," not "broken."
function heroArt(g) {
  const url = getCover(g);
  const color = PC[g.p] || '#555';
  const emoji = PLAT_EMOJI[g.p] || '🎮';
  const fallback = `<div class="hero-bg-fallback" style="background:linear-gradient(160deg, ${color}40, ${color}10);color:${color}${url ? ';display:none' : ''}">${emoji}</div>`;
  if (url) {
    return `<img class="hero-bg-img" src="${url}" alt="${esc(g.t)}" loading="lazy" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'">${fallback}`;
  }
  return fallback;
}

// ─── Helpers ──────────────────────────────────────────
function pb(p){return `<span class="plat p-${p}">${PL[p]||p}</span>`;}

function isDormant(g){
  if(!g.lastPlayed) return false;
  return (NOW - new Date(g.lastPlayed))/(1000*60*60*24) > 30;
}

function hltbEl(g){
  const parts=[];
  if(g.h) parts.push(`<span class="hltb">⏱ ${g.h}<span class="hltb-sm"> est</span></span>`);
  if(g.actualHours) parts.push(`<span class="actual-time">▶ ${g.actualHours}h</span>`);
  return parts.join('');
}

function achBar(g){
  if(g.casual||g.achPct===null) return '';
  const pct=g.achPct;
  const count=g.achCount?`${g.achCount[0]}/${g.achCount[1]}`:'';
  let color = pct>=100?'#42f5a0':pct>=75?'#c8f542':pct>=50?'#f5e042':'#f5a042';
  return `<div class="ach-bar-wrap">
    <span class="ach-lbl">achievements</span>
    <div class="ach-bar-track"><div class="ach-bar-fill" style="width:${pct}%;background:${color};"></div></div>
    <span class="ach-pct">${count} · ${pct}%</span>
  </div>`;
}

function masteryBadge(m){
  if(!m) return '';
  const map={'in-progress':['mast-progress','RA ★ in progress'],'mastered':['mast-mastered','RA ✓ Mastered'],'platinum':['mast-platinum','🏆 Platinum'],'100pct':['mast-100','✓ 100%']};
  const [cls,lbl]=map[m]||['',''];
  return cls?`<span class="mast ${cls}">${lbl}</span>`:'';
}

function diffBadge(d){ return d?`<span class="diff diff-${d}">${DIFF_LABELS[d]}</span>`:''; }
function gotmBadge(g){ return g?`<span class="gotm">GOTM ${esc(g)}</span>`:''; }

function parseHltb(h){
  if(!h) return null;
  if(h.includes('-')){const[a,b]=h.replace(/h/g,'').split('-');return(parseFloat(a)+parseFloat(b))/2;}
  return parseFloat(h.replace('h','').replace('+',''))||null;
}

function daysSince(dateStr){
  if(!dateStr) return null;
  const diff = NOW - new Date(dateStr);
  return Math.floor(diff/(1000*60*60*24));
}

function fmtDate(dateStr){
  if(!dateStr) return null;
  const [,mo,da] = dateStr.split('-');
  return M[parseInt(mo,10)-1]+' '+parseInt(da,10);
}

function startEl(g){
  if(!g.start) return '';
  const d = daysSince(g.start);
  if(d===null) return '';
  const label = d===0?'started today':d===1?'1 day in':`${d} days in`;
  return `<span class="start-pill">▷ ${label}</span>`;
}

function lastPlayedEl(g){
  if(!g.lastPlayed) return '';
  const d = daysSince(g.lastPlayed);
  if(d===null) return '';
  const label = d===0?'played today':d===1?'played yesterday':`played ${fmtDate(g.lastPlayed)}`;
  return `<span class="lp-pill">${label}</span>`;
}

function queuedEl(g){
  if(!g.queued) return '';
  const f = fmtDate(g.queued);
  return f?`<span class="queued-pill">queued ${f}</span>`:'';
}

// ─── Card builders ─────────────────────────────────────
// Wraps a card so clicking it opens that game's edit form. Gated on the Worker being
// configured, for the same reason the "+ Add game" link is: without it add.html can only show
// its setup notice, so linking there would be a dead end. Archive cards get this too — it's
// the route for filling in the completion dates the Year Log note points at.
function cardLink(g, inner){
  if(!CAN_EDIT) return inner;
  return `<a class="card-link" href="add.html?id=${g.id}" draggable="false">${inner}</a>`;
}

function nowC(g){
  const dormant=isDormant(g);
  return cardLink(g, `<div class="hero-card ${dormant?'dormant':'now'}" data-id="${g.id}">
    <div class="hero-art">
      ${heroArt(g)}
      <div class="hero-top">${pb(g.p)}</div>
    </div>
    <div class="hero-content">
      <div class="hero-title" title="${esc(g.t)}">${esc(g.t)}</div>
      <div class="hero-meta">
        ${g.y?`<span class="yr">${g.y}</span>`:''}
        ${g.g?`<span class="genre-tag">${esc(g.g)}</span>`:''}
        ${gotmBadge(g.gotm)}${masteryBadge(g.mastery)}${diffBadge(g.diff)}
        ${startEl(g)}
        ${dormant?'<span class="dormant-pill">💤 dormant</span>':lastPlayedEl(g)}
        ${g.casual?'<span class="casual-pill">casual play</span>':''}
        ${g.note?`<span class="note-pill">📌 ${esc(g.note)}</span>`:''}
      </div>
      ${hltbEl(g)?`<div class="hero-hltb">${hltbEl(g)}</div>`:''}
      ${achBar(g)}
    </div>
  </div>`);
}

function qC(g,n,showNum=true){
  const num=showNum?`<span class="qnum">${n}</span>`:'';
  return cardLink(g, `<div class="card" data-id="${g.id}">
    ${thumbEl(g)}
    <div class="card-content">
      <div class="row1">${num}${pb(g.p)}<span class="gtitle" title="${esc(g.t)}">${esc(g.t)}</span></div>
      <div class="row2">
        ${hltbEl(g)}
        ${g.y?`<span class="yr">${g.y}</span>`:''}
        ${g.g?`<span class="genre-tag">${esc(g.g)}</span>`:''}
        ${gotmBadge(g.gotm)}${masteryBadge(g.mastery)}${diffBadge(g.diff)}
        ${queuedEl(g)}
        ${g.casual?'<span class="casual-pill">casual play</span>':''}
        ${g.note?`<span class="note-pill">📌 ${esc(g.note)}</span>`:''}
      </div>
      ${achBar(g)?`<div class="row3">${achBar(g)}</div>`:''}
    </div>
  </div>`);
}

function aC(g){
  const gap=(g.y&&g.cy)?(g.cy-g.y):null;
  const dropped=g.s==='dropped';
  return cardLink(g, `<div class="card faded">
    ${thumbEl(g)}
    <div class="card-content">
      <div class="row1">${pb(g.p)}<span class="gtitle" title="${esc(g.t)}">${esc(g.t)}</span></div>
      <div class="row2">
        ${hltbEl(g)}
        ${g.cm!=null?`<span class="yr">${M[g.cm]} ${g.cy}</span>`:''}
        ${g.r?`<span class="rating">${g.r}/10</span>`:''}
        ${g.g?`<span class="genre-tag">${esc(g.g)}</span>`:''}
        ${gap!=null?`<span class="yr">${gap===0?'same yr':gap+'yr gap'}</span>`:''}
        ${gotmBadge(g.gotm)}${masteryBadge(g.mastery)}${diffBadge(g.diff)}
        ${g.note?`<span class="note-pill">📌 ${esc(g.note)}</span>`:''}
        ${dropped?'<span class="dropped-pill">dropped</span>':''}
      </div>
      ${achBar(g)?`<div class="row3">${achBar(g)}</div>`:''}
    </div>
  </div>`);
}

// ─── Year stats ────────────────────────────────────────
function ystats(list){
  const done=list.filter(g=>g.s==='done');
  const rated=done.filter(g=>g.r>0);
  const avg=rated.length?(rated.reduce((s,g)=>s+g.r,0)/rated.length).toFixed(1):null;
  const wg=done.filter(g=>g.y&&g.cy);
  const avgAge=wg.length?Math.round(wg.reduce((s,g)=>s+(g.cy-g.y),0)/wg.length):null;
  const totalHrs=done.reduce((s,g)=>{const h=g.actualHours||parseHltb(g.h);return s+(h||0);},0);
  const mastCount=done.filter(g=>g.mastery&&g.mastery!=='in-progress').length;
  const dwellGames=done.filter(g=>g.start&&g.cy&&g.cm!=null);
  const avgDwell=dwellGames.length?Math.round(dwellGames.reduce((s,g)=>{
    const started=new Date(g.start);
    const finished=new Date(`${g.cy}-${String(g.cm+1).padStart(2,'0')}-15`);
    return s+(finished-started)/(1000*60*60*24);
  },0)/dwellGames.length):null;
  let h=`<div class="ystats">
    <div class="ys"><div class="ys-n" style="color:var(--done)">${done.length}</div><div class="ys-l">Done</div></div>
    <div class="ys"><div class="ys-n" style="color:var(--accent)">${avg?avg+'/10':'—'}</div><div class="ys-l">Avg</div></div>
    ${totalHrs>0?`<div class="ys"><div class="ys-n" style="color:#42c8f5">${Math.round(totalHrs)}h</div><div class="ys-l">Hours</div></div>`:''}
    ${mastCount>0?`<div class="ys"><div class="ys-n" style="color:#ffb84a">${mastCount}</div><div class="ys-l">Mastered</div></div>`:''}
    ${avgAge!=null?`<div class="ys"><div class="ys-n">${avgAge}yr</div><div class="ys-l">Avg gap</div></div>`:''}
    ${avgDwell!=null?`<div class="ys"><div class="ys-n" style="color:#c8f542">${avgDwell}d</div><div class="ys-l">Avg dwell</div></div>`:''}
  </div>`;
  const pc={};done.forEach(g=>{pc[g.p]=(pc[g.p]||0)+1;});
  const mp=Math.max(...Object.values(pc),1);
  if(Object.keys(pc).length){h+=`<div class="bsec"><div class="blbl">Platform</div>${Object.entries(pc).sort((a,b)=>b[1]-a[1]).map(([p,c])=>`<div class="brow"><span class="bname">${PL[p]||p}</span><div class="btrack"><div class="bfill" style="width:${Math.round(c/mp*100)}%;background:${PC[p]||'#888'};"></div></div><span class="bval">${c}</span></div>`).join('')}</div>`;}
  const gc={};done.forEach(g=>{if(g.g)gc[g.g]=(gc[g.g]||0)+1;});
  const mg2=Math.max(...Object.values(gc),1);
  if(Object.keys(gc).length){h+=`<div class="bsec"><div class="blbl">Genre</div>${Object.entries(gc).sort((a,b)=>b[1]-a[1]).map(([gn,c])=>`<div class="brow"><span class="bname" title="${esc(gn)}">${esc(gn)}</span><div class="btrack"><div class="bfill" style="width:${Math.round(c/mg2*100)}%;background:#c8f542;opacity:0.6;"></div></div><span class="bval">${c}</span></div>`).join('')}</div>`;}
  const bm={};done.forEach(g=>{if(g.cm!=null)bm[g.cm]=(bm[g.cm]||0)+1;});
  const mm=Math.max(...Object.values(bm),1);
  if(Object.keys(bm).length){h+=`<div class="bsec"><div class="blbl">Month</div>${Object.entries(bm).sort((a,b)=>a[0]-b[0]).map(([mo,c])=>`<div class="brow"><span class="bname">${M[mo]}</span><div class="btrack"><div class="bfill" style="width:${Math.round(c/mm*100)}%;background:#42c8f5;opacity:0.6;"></div></div><span class="bval">${c}</span></div>`).join('')}</div>`;}
  const br=rated.length?rated.reduce((a,b)=>a.r>=b.r?a:b):null;
  const old=wg.length?wg.reduce((a,b)=>a.y<=b.y?a:b):null;
  const big=wg.length?wg.reduce((a,b)=>(a.cy-a.y)>=(b.cy-b.y)?a:b):null;
  const longest=done.filter(g=>g.actualHours||parseHltb(g.h)).reduce((a,b)=>((a?.actualHours||parseHltb(a?.h)||0)>=(b?.actualHours||parseHltb(b?.h)||0))?a:b,null);
  const hardest=done.filter(g=>g.diff).reduce((a,b)=>(a?.diff||0)>=(b?.diff||0)?a:b,null);
  const hls=[];
  if(br) hls.push(`<div class="hl"><div class="hl-l">Best rated</div><div class="hl-v" title="${esc(br.t)}">${esc(br.t)}</div><div class="hl-s">${br.r}/10</div></div>`);
  if(old) hls.push(`<div class="hl"><div class="hl-l">Most vintage</div><div class="hl-v" title="${esc(old.t)}">${esc(old.t)}</div><div class="hl-s">Released ${old.y}</div></div>`);
  if(longest) hls.push(`<div class="hl"><div class="hl-l">Longest played</div><div class="hl-v" title="${esc(longest.t)}">${esc(longest.t)}</div><div class="hl-s">${longest.actualHours||parseHltb(longest.h)}h</div></div>`);
  if(hardest) hls.push(`<div class="hl"><div class="hl-l">Hardest mastered</div><div class="hl-v" title="${esc(hardest.t)}">${esc(hardest.t)}</div><div class="hl-s">${DIFF_LABELS[hardest.diff]}</div></div>`);
  if(big&&(big.cy-big.y)>0) hls.push(`<div class="hl"><div class="hl-l">Biggest backlog gap</div><div class="hl-v" title="${esc(big.t)}">${esc(big.t)}</div><div class="hl-s">${big.cy-big.y}yr</div></div>`);
  if(hls.length) h+=`<div class="hlg">${hls.join('')}</div>`;
  return h;
}

// ─── Panels ────────────────────────────────────────────
// Keyed off the id prefix (ar/yl/so) rather than the previous two-way isAr ternary, which
// couldn't express a third panel. All three already follow the same <k>-arr/-panel/-toggle
// naming, so this is a straight generalisation.
function paintPanel(k){
  document.getElementById(`${k}-arr`).textContent=open[k]?'▼':'▶';
  document.getElementById(`${k}-panel`).style.display=open[k]?'block':'none';
  document.getElementById(`${k}-toggle`).setAttribute('aria-expanded', open[k]?'true':'false');
}

// Which panels are open survives a reload. Soon™ now defaults closed (42 cards otherwise sit
// between Up Next and everything below it), and having that choice reset on every refresh
// would be its own annoyance — same localStorage-with-try/catch approach as the edit-mode
// toggle below.
function savePanelState(){
  try { localStorage.setItem('gt_panels', JSON.stringify(open)); } catch(e){}
}

function tog(k){
  open[k]=!open[k];
  paintPanel(k);
  savePanelState();
  renderPanels();
}

function renderPanels(){
  const arch=G.filter(g=>g.s==='done'||g.s==='dropped').sort((a,b)=>(b.cy||0)-(a.cy||0)||((b.cm??-1)-(a.cm??-1)));
  document.getElementById('ar-lbl').textContent=`Archive (${arch.length})`;
  if(open.ar){
    const q=(document.getElementById('ar-search').value||'').trim().toLowerCase();
    const filtered=q?arch.filter(g=>g.t.toLowerCase().includes(q)):arch;
    if(q && filtered.length===0){
      document.getElementById('ar-list').innerHTML='<div class="empty">No archived games match that search.</div>';
    } else {
      const bym={};
      filtered.forEach(g=>{const k=`${g.cy||'?'}__${g.cm??'?'}`;if(!bym[k])bym[k]={year:g.cy,month:g.cm,games:[]};bym[k].games.push(g);});
      document.getElementById('ar-list').innerHTML=Object.values(bym).sort((a,b)=>(b.year||0)-(a.year||0)||((b.month??-1)-(a.month??-1))).map(grp=>`<div class="mg"><div class="mh">${grp.month!=null?M[grp.month]+' '+grp.year:String(grp.year||'Unknown')}</div><div class="game-list">${grp.games.map(aC).join('')}</div></div>`).join('');
    }
  }
  if(open.yl){
    const fin=G.filter(g=>(g.s==='done'||g.s==='dropped')&&g.cy);
    const by={};fin.forEach(g=>{(by[g.cy]=by[g.cy]||[]).push(g);});
    const yrs=Object.keys(by).sort((a,b)=>b-a);
    // A finished game with no cy can't be filed under any year, so it's absent from
    // everything above — which silently makes these totals disagree with the "Done" stat in
    // the header. Saying so, with a count and where to fix it, beats letting the two numbers
    // quietly contradict each other.
    const undated=G.filter(g=>(g.s==='done'||g.s==='dropped')&&!g.cy).length;
    const note=undated?`<div class="empty">+ ${undated} finished ${undated===1?'game has':'games have'} no completion date, so ${undated===1?'it isn’t':'they aren’t'} counted here — add one via <a href="add.html" style="color:var(--muted)">Add / Edit</a> (marked “needs date”).</div>`:'';
    document.getElementById('yl-panel').innerHTML=(yrs.length?yrs.map(yr=>{const list=by[yr];return `<div class="yg"><div class="yhead">${yr}<span class="ysub">${list.filter(g=>g.s==='done').length} completed</span></div>${ystats(list)}<div class="game-list">${list.map(aC).join('')}</div></div>`;}).join(''):'<div class="empty">No completed games yet.</div>')+note;
  }
}

// ─── GOTM club ─────────────────────────────────────────
// gotm.json is bot-written by scripts/fetch-gotm.mjs and mirrors r/SBCGaming's club. Two rules
// from the club drive everything here:
//  1. A pick stays claimable for 12 months, then retires. So this is a deadline list sorted by
//     time remaining — an expired pick is not "late", it's unobtainable, and nagging about it
//     is pure noise.
//  2. Each month sets its own completion criteria on its own post, and they differ wildly. The
//     tracker cannot know them, so every row links to its post rather than asserting anything.
// Consequently `s:"done"` does NOT clear a pick — only gotmFlair does. Finishing the game and
// meeting that month's requirement are different things.
let GOTM = null;

// The gotm tag is the join, never the title: club and tracker names drift ("Tomb Raider" vs
// "Tomb Raider I Remastered"), and fuzzy matching pairs the club's "Super Mario World" with
// this library's "Super Mario World 2: Yoshi's Island", a different game.
function gameForPick(pick){
  return G.find(g => g.gotm === pick.tag) || null;
}

function gotmRow(pick){
  const g = gameForPick(pick);
  const left = pick.monthsLeft;
  const cls = left <= 2 ? 'urgent' : left <= 4 ? 'soonish' : (pick.isCurrent ? 'current' : '');
  const leftLbl = left === 1 ? 'LAST' : `${left}mo`;
  let state, stateCls = '';
  if(!g){
    state = CAN_EDIT
      ? `<a href="add.html?t=${encodeURIComponent(pick.game)}&gotm=${encodeURIComponent(pick.tag)}">+ add to tracker</a>`
      : 'not tracked';
    stateCls = 'act';
  } else if(g.s === 'done'){
    state = 'played · verify flair'; stateCls = 'act';
  } else {
    state = g.s === 'playing' ? 'playing' : g.s === 'queue' ? 'up next' : g.s === 'soon' ? 'soon' : g.s;
  }
  const name = pick.url
    ? `<a href="${esc(pick.url)}" target="_blank" rel="noopener noreferrer">${esc(pick.game)}</a>`
    : esc(pick.game);
  return `<div class="gotm-row ${cls}">
    <span class="gotm-left">${leftLbl}</span>
    <span class="gotm-name" title="${esc(pick.game)}${g&&g.t!==pick.game?' — tracked as '+esc(g.t):''}">${name}</span>
    <span class="gotm-state ${stateCls}">${state}</span>
  </div>`;
}

function renderGotm(){
  const sec = document.getElementById('gotm-sec');
  if(!GOTM || !Array.isArray(GOTM.picks) || !GOTM.picks.length){ sec.style.display='none'; return; }

  // Anything already claimed drops out entirely — that's what gotmFlair is for.
  const outstanding = GOTM.picks
    .filter(p => !p.retired)
    .filter(p => { const g = gameForPick(p); return !(g && g.gotmFlair); })
    .sort((a,b) => a.monthsLeft - b.monthsLeft);

  // Expired-and-unclaimed gets one muted line, never a row: the deadline has passed, so there
  // is nothing to act on.
  const missed = GOTM.picks
    .filter(p => p.retired)
    .filter(p => { const g = gameForPick(p); return g && !g.gotmFlair && g.s !== 'done'; });

  const cur = GOTM.picks.find(p => p.isCurrent);
  const src = GOTM.sourceUrl ? `<a href="${esc(GOTM.sourceUrl)}" target="_blank" rel="noopener noreferrer">r/SBCGaming</a>` : 'r/SBCGaming';
  const staleBits = [];
  if(GOTM.error) staleBits.push(`<span class="gotm-warn">⚠ Club list couldn’t be refreshed (${esc(GOTM.error)}) — showing the last known copy.</span>`);
  if(GOTM.seeded) staleBits.push('Seeded by hand from the August 2026 post; the first successful fetch replaces it.');
  if(cur && !outstanding.some(p => p.isCurrent)) staleBits.push(`This month’s pick (${esc(cur.game)}) is already claimed.`);
  staleBits.push('Completion rules differ every month — check each pick’s own post.');

  sec.innerHTML = `
    <div class="gotm-head">
      <h2 id="gotm-heading">Game of the Month</h2>
      <span class="gotm-sub">${outstanding.length} claimable · 12-month window · ${src}</span>
    </div>
    ${outstanding.length
      ? `<div class="gotm-rows">${outstanding.map(gotmRow).join('')}</div>`
      : '<div class="empty">Nothing outstanding — every live pick is claimed.</div>'}
    <div class="gotm-foot">
      ${missed.length?`Expired unclaimed: ${missed.map(p=>esc(p.game)).join(', ')}.<br>`:''}
      ${staleBits.join('<br>')}
    </div>`;
  sec.style.display = 'block';
}

// ─── Main render ───────────────────────────────────────
function render(){
  const playing=G.filter(g=>g.s==='playing');
  const queue=G.filter(g=>g.s==='queue');
  const soon=G.filter(g=>g.s==='soon');
  const done=G.filter(g=>g.s==='done');
  const backlogHrs=[...playing,...queue,...soon].reduce((s,g)=>s+(parseHltb(g.h)||0),0);
  const rated=done.filter(g=>g.r>0);
  const avg=rated.length?(rated.reduce((s,g)=>s+g.r,0)/rated.length).toFixed(1):'—';
  const mastTotal=G.filter(g=>g.mastery&&g.mastery!=='in-progress').length;
  document.getElementById('stats').innerHTML=`
    <div class="stat"><div class="stat-n" style="color:#42c8f5">${playing.length}</div><div class="stat-l">Playing</div></div>
    <div class="stat"><div class="stat-n" style="color:#888">${queue.length+soon.length}</div><div class="stat-l">Backlog</div></div>
    <div class="stat"><div class="stat-n" style="color:#42c8f5;font-size:1.1rem">${Math.round(backlogHrs)}h</div><div class="stat-l">Backlog hrs</div></div>
    <div class="stat"><div class="stat-n" style="color:#42f5a0">${done.length}</div><div class="stat-l">Done</div></div>
    <div class="stat"><div class="stat-n" style="color:#ffb84a">${mastTotal}</div><div class="stat-l">Mastered</div></div>
    <div class="stat"><div class="stat-n" style="color:#c8f542">${avg}</div><div class="stat-l">Avg${rated.length?` · ${rated.length} rated`:' rating'}</div></div>
  `;
  document.getElementById('now').innerHTML=playing.length?playing.map(nowC).join(''):'<div class="empty">Nothing playing.</div>';
  document.getElementById('queue').innerHTML=queue.length?queue.map((g,i)=>qC(g,i+1,true)).join(''):'<div class="empty">Nothing up next.</div>';
  document.getElementById('so-lbl').textContent=`Soon™ (${soon.length})`;
  document.getElementById('soon').innerHTML=soon.length?soon.map(g=>qC(g,0,false)).join(''):'<div class="empty">Nothing here yet.</div>';
  renderGotm();
  renderPanels();
}

// ─── Edit mode + drag-and-drop ──────────────────────────
// Pointer Events, not HTML5 Drag-and-Drop: native draggable/dragstart does not reliably
// fire on touch on iOS/Android, which would break "works on both mobile and desktop."
// pointerdown/pointermove/pointerup/pointercancel with setPointerCapture unify mouse/touch/
// pen in one code path instead.
//
// Cross-section drops only (Now Playing / Up Next / Soon) — dragging within a section is a
// no-op, same as dropping outside any of the three. In-section priority reordering would
// need a new order/priority field this schema doesn't have; out of scope for this pass.
//
// The edit-mode toggle is a declutter control, not a security boundary — WORKER.key is
// already committed in plaintext to the public worker-config.js once deployed (same
// "public key deters drive-by, doesn't authenticate" model documented in worker/README.md),
// so hiding drag handles behind a toggle only keeps the default view clean for anyone
// landing on this public page, it doesn't gate who *could* call the Worker directly.
const DRAG_THRESHOLD = 6;
let editMode = false;
let drag = null;

// Continuous pointer-drag needs a fine pointer with real hover to be usable at all — the
// same capability test already used for hover-lift styling (see .card:hover above), not a
// viewport-width guess. Coarse pointers (touch) get tap-to-move instead (further down):
// pick up with one tap, commit with a second tap on a destination section. This is a new
// way to trigger the exact same move — it shares sectionPatch() and moveGameToSection()
// with the drag path below, not a second implementation of "move a game."
const canHoverDrag = window.matchMedia('(hover: hover) and (pointer: fine)').matches;
let moveMode = null; // { g, sourceId } while a tap-to-move is in progress

// Cards are links now, and cards are also what you drag or tap-to-move — so the click a
// browser fires after any pointer gesture has to be filtered, or every drag/tap-to-move
// would navigate away to the edit form mid-move. Two cases, both capture-phase so they beat
// the anchor's default:
//   - Edit mode on: a press on a card means "pick this up", never "open it". Suppress always.
//   - Edit mode off: suppress only if the pointer actually travelled past DRAG_THRESHOLD, so
//     a scroll started on a card doesn't navigate on release, while a genuine tap still does.
// Also doubles as tap-vs-scroll disambiguation for handleTapMove() below, on coarse pointers.
let clickGuard = { suppress: false, downX: 0, downY: 0 };
document.addEventListener('pointerdown', (e) => {
  clickGuard = { suppress: false, downX: e.clientX, downY: e.clientY };
}, true);
document.addEventListener('pointerup', (e) => {
  clickGuard.suppress = Math.hypot(e.clientX - clickGuard.downX, e.clientY - clickGuard.downY) >= DRAG_THRESHOLD;
}, true);

// Pure and stateless on purpose (no DOM, no globals besides their own args) so they're
// unit-testable the same way the rest of this project's scripts are, unlike the pointer
// choreography around them, which needs a real browser and is verified by hand instead.
function todayStr(){
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}

function sectionPatch(sectionId, g){
  if (sectionId==='now')   return { s:'playing', start: todayStr() };
  if (sectionId==='queue') return { s:'queue', queued: g.queued || todayStr() };
  if (sectionId==='soon')  return { s:'soon',  queued: g.queued || todayStr() };
  return null;
}

function setEditMode(on){
  editMode = on;
  document.body.classList.toggle('edit-mode', on);
  const btn = document.getElementById('edit-toggle');
  btn.textContent = on ? 'Edit mode: On' : 'Edit mode: Off';
  btn.classList.toggle('active', on);
  if (!on) cancelMoveMode();
  try { localStorage.setItem('gt_edit_mode', on ? '1' : '0'); } catch(e){}
}

function cardSectionAt(x, y){
  const el = document.elementFromPoint(x, y);
  return el ? el.closest('#now, #queue, #soon') : null;
}

function beginVisualDrag(){
  const { el, width, height, left, top } = drag;
  el.classList.add('dragging');
  Object.assign(el.style, {
    position:'fixed', zIndex:'1000', width:width+'px', height:height+'px',
    left:left+'px', top:top+'px', margin:'0', transition:'none', pointerEvents:'none',
  });
  autoScrollTick();
}

// Auto-scroll while dragging near the top/bottom edge of the viewport. Without this, a
// real drag from Now Playing to Up Next/Soon (or back) can be flat-out impossible: those
// sections are routinely below the fold from each other at a normal window height (Now
// Playing's hero cards alone can run past 800px), and elementFromPoint — what drop-target
// detection is built on — can only ever see what's actually rendered in the viewport. There
// is no mouse position that represents "off-screen," so without scrolling the page itself,
// some drags have literally no reachable drop target, not just an inconvenient one.
const SCROLL_EDGE = 72;   // px from the top/bottom edge that starts auto-scroll
const SCROLL_SPEED = 14;  // px per frame at the very edge, scaled down near the zone's outer edge
function autoScrollTick(){
  if (!drag || !drag.moved) return;
  const y = drag.lastClientY ?? 0;
  let dy = 0;
  if (y < SCROLL_EDGE) dy = -SCROLL_SPEED * (1 - y / SCROLL_EDGE);
  else if (y > window.innerHeight - SCROLL_EDGE) dy = SCROLL_SPEED * (1 - (window.innerHeight - y) / SCROLL_EDGE);
  if (dy){
    window.scrollBy(0, dy);
    // Fixed-position elements don't move on their own when the page scrolls, and neither
    // does the drop-target check unless something re-runs it — without this, holding still
    // while the page auto-scrolls would leave both stuck referencing where things were
    // before the scroll started.
    updateDragPosition(drag.lastClientX ?? 0, drag.lastClientY);
  }
  requestAnimationFrame(autoScrollTick);
}

function onPointerDown(e){
  if (!editMode || drag) return;                          // one drag at a time
  if (!canHoverDrag) return;                               // coarse pointers use tap-to-move
  if (e.pointerType==='mouse' && e.button!==0) return;     // left-click only
  const cardEl = e.target.closest('.hero-card, .card');
  if (!cardEl || !cardEl.dataset.id) return;                // absent on Archive/Year Log cards
  const container = cardEl.closest('#now, #queue, #soon');
  if (!container) return;
  const g = G.find(x => x.id === Number(cardEl.dataset.id));
  if (!g) return;
  const rect = cardEl.getBoundingClientRect();
  drag = { el: cardEl, g, sourceId: container.id, pointerId: e.pointerId,
    startX: e.clientX, startY: e.clientY,
    offsetX: e.clientX - rect.left, offsetY: e.clientY - rect.top,
    width: rect.width, height: rect.height, left: rect.left, top: rect.top,
    moved: false, hoverId: null };
  cardEl.setPointerCapture(e.pointerId);
}

// Shared by onPointerMove and the auto-scroll loop — the drop-target highlight has to keep
// re-evaluating even when the pointer itself isn't moving, since holding still in the edge
// zone is exactly what triggers the page to scroll and reveal a new section underneath it.
// If only pointermove drove this, releasing without one final wiggle after an auto-scroll
// would drop against a stale, pre-scroll hover state.
function updateDragPosition(x, y){
  drag.el.style.left = (x - drag.offsetX) + 'px';
  drag.el.style.top  = (y - drag.offsetY) + 'px';
  const hover = cardSectionAt(x, y);
  const hoverId = hover ? hover.id : null;
  if (hoverId !== drag.hoverId){
    if (drag.hoverId) document.getElementById(drag.hoverId).classList.remove('drop-hover');
    if (hoverId) document.getElementById(hoverId).classList.add('drop-hover');
    drag.hoverId = hoverId;
  }
}

function onPointerMove(e){
  if (!drag || e.pointerId !== drag.pointerId) return;
  drag.lastClientX = e.clientX;
  drag.lastClientY = e.clientY;
  const dx = e.clientX - drag.startX, dy = e.clientY - drag.startY;
  if (!drag.moved){
    if (Math.hypot(dx, dy) < DRAG_THRESHOLD) return;
    drag.moved = true;
    beginVisualDrag();
  }
  updateDragPosition(e.clientX, e.clientY);
}

// Shared by the desktop drag-drop path and mobile tap-to-move — one optimistic-update-then-
// rollback implementation for "move a game to a different section," regardless of which
// gesture triggered it.
async function moveGameToSection(g, sectionId){
  const patch = sectionPatch(sectionId, g);
  const prev = { s: g.s, start: g.start, queued: g.queued };
  Object.assign(g, patch);
  render();                                                // optimistic
  try {
    const res = await fetch(WORKER.url + '/games/edit', {
      method:'POST',
      headers:{ 'Content-Type':'application/json', 'X-Sync-Key': WORKER.key },
      body: JSON.stringify({ id: g.id, ...patch }),
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || `request failed (${res.status})`);
  } catch (err) {
    Object.assign(g, prev);
    render();
    alert(`Couldn't move "${g.t}": ${err.message}`);
  }
}

async function onPointerUp(e){
  if (!drag || e.pointerId !== drag.pointerId) return;
  const { g, sourceId, hoverId, moved } = drag;
  if (drag.hoverId) document.getElementById(drag.hoverId).classList.remove('drop-hover');
  drag = null;
  if (!moved) return;                                     // plain tap — never left flow
  if (!hoverId || hoverId === sourceId){ render(); return; } // cancel/no-op: snap back
  await moveGameToSection(g, hoverId);
}

document.addEventListener('pointerdown', onPointerDown);
document.addEventListener('pointermove', onPointerMove);
document.addEventListener('pointerup', onPointerUp);
document.addEventListener('pointercancel', onPointerUp);

// --- Mobile tap-to-move (coarse pointers only — see canHoverDrag) ---------------------
// Two taps instead of one continuous gesture: pick up, then tap a destination section.
// Deliberately not a port of the drag engine — touch dragging has real, separate problems
// (a dragged card occludes exactly the drop target underneath the finger; no auto-scroll
// gesture can coexist with a finger already committed to dragging) that a second interaction
// model sidesteps rather than fights. No touch-action:none is needed anywhere in this flow,
// so normal page scroll in Edit mode is fully unaffected on phones, unlike the drag path.
function cancelMoveMode(){
  if (!moveMode) return;
  const el = document.querySelector(`[data-id="${moveMode.g.id}"]`);
  if (el) el.classList.remove('move-picked');
  ['now','queue','soon'].forEach(id => document.getElementById(id).classList.remove('move-target'));
  moveMode = null;
  document.getElementById('move-bar').style.display = 'none';
}

async function commitMove(sectionId){
  const { g, sourceId } = moveMode;
  cancelMoveMode();
  if (sectionId === sourceId) return;                     // tapping your own section: no-op
  await moveGameToSection(g, sectionId);
}

function beginMoveMode(g, sourceId, cardEl){
  moveMode = { g, sourceId };
  cardEl.classList.add('move-picked');
  ['now','queue','soon'].filter(id => id !== sourceId)
    .forEach(id => document.getElementById(id).classList.add('move-target'));
  document.getElementById('move-bar-title').textContent = `Moving "${g.t}"`;
  document.getElementById('move-bar').style.display = 'flex';
}

function handleTapMove(e){
  if (!editMode || canHoverDrag) return;
  if (clickGuard.suppress) return;                        // the pointer travelled — a scroll, not a tap
  const sectionEl = e.target.closest('#now, #queue, #soon');
  if (moveMode){
    if (sectionEl) commitMove(sectionEl.id);
    return;                                                // tap outside any section: leave move mode open
  }
  const cardEl = e.target.closest('.hero-card, .card');
  if (!cardEl || !cardEl.dataset.id || !sectionEl) return;
  const g = G.find(x => x.id === Number(cardEl.dataset.id));
  if (!g) return;
  beginMoveMode(g, sectionEl.id, cardEl);
}
document.addEventListener('pointerup', handleTapMove);

document.addEventListener('click', (e) => {
  if (!e.target.closest('.card-link')) return;
  if (editMode || clickGuard.suppress) e.preventDefault();
}, true);

if (WORKER.url && WORKER.key){
  document.getElementById('edit-toggle').style.display = '';
  document.getElementById('add-link').style.display = '';
  let stored = '0';
  try { stored = localStorage.getItem('gt_edit_mode') || '0'; } catch(e){}
  setEditMode(stored === '1');
}

// ─── Bootstrap ─────────────────────────────────────────
// Restored before the first render so a panel that was left open doesn't flash shut and then
// reopen once data arrives.
try {
  const stored=JSON.parse(localStorage.getItem('gt_panels')||'null');
  if(stored) for(const k of ['ar','yl','so']) if(typeof stored[k]==='boolean') open[k]=stored[k];
} catch(e){}
['ar','yl','so'].forEach(paintPanel);

// Placeholder cards while the two fetches resolve. Without these the entire page — stats,
// every section — is blank on arrival, which reads as "no games" rather than "still loading".
function showSkeletons(){
  const card=(h)=>`<div class="skel" style="height:${h}"></div>`;
  document.getElementById('stats').innerHTML=Array.from({length:6},()=>card('62px')).join('');
  document.getElementById('now').innerHTML=Array.from({length:2},()=>card('210px')).join('');
  document.getElementById('queue').innerHTML=Array.from({length:4},()=>card('84px')).join('');
}
showSkeletons();

Promise.all([
  fetch('games.json').then(r=>r.json()),
  fetch('covers.json').then(r=>r.ok?r.json():{}).catch(()=>({})),
  fetch('gotm.json').then(r=>r.ok?r.json():null).catch(()=>null),
]).then(([games,covers,gotm])=>{
  G=games;
  COVERS=covers;
  GOTM=gotm;
  NOW=new Date();
  render();
}).catch(err=>{
  console.error('Failed to load game data', err);
  // Page-level, not tucked into #now: previously the stats row and every other section were
  // left as-is on a failed load, so a fetch error looked identical to an empty tracker.
  const banner=document.getElementById('load-error');
  banner.innerHTML=`Couldn’t load game data (${esc(err.message||'network error')}). <button class="banner-btn" onclick="location.reload()">Retry</button>`;
  banner.style.display='flex';
  document.getElementById('stats').innerHTML='';
  document.getElementById('now').innerHTML='';
  document.getElementById('queue').innerHTML='';
});

// The sync job runs daily at 13:00 UTC. A static date reads as fine forever if that job
// breaks — secrets expiring, a workflow failure — so this reports age relative to now and
// turns amber past two days, i.e. after at least one scheduled run has visibly not happened.
const STALE_HOURS = 48;
function syncStampText(syncedAt, now){
  const then=new Date(syncedAt);
  if(isNaN(then)) return null;
  const mins=Math.round((now-then)/60000);
  const rel = mins < 1 ? 'just now'
    : mins < 60 ? `${mins} minute${mins===1?'':'s'} ago`
    : mins < 60*24 ? `${Math.round(mins/60)} hour${Math.round(mins/60)===1?'':'s'} ago`
    : `${Math.round(mins/1440)} day${Math.round(mins/1440)===1?'':'s'} ago`;
  const hours=mins/60;
  const abs=then.toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'});
  return { stale: hours>STALE_HOURS, rel, abs, hours };
}

fetch('last-synced.json').then(r=>r.ok?r.json():null).then(d=>{
  const el=document.getElementById('updated-stamp');
  const s=d&&d.syncedAt?syncStampText(d.syncedAt,new Date()):null;
  if(!s){ el.textContent=''; return; }
  el.classList.toggle('stale',s.stale);
  el.textContent=s.stale
    ? `⚠ Steam & RA data last synced ${s.rel} (${s.abs}) — the daily sync may be failing`
    : `🔄 Steam & RA data synced ${s.rel} (${s.abs})`;
}).catch(()=>{ document.getElementById('updated-stamp').textContent=''; });
</script>
</body>
