name: Sync Steam & RetroAchievements

on:
  schedule:
    - cron: '0 13 * * *'   # daily, ~1pm UTC — matches steph-tv-tracker's own nightly job
  workflow_dispatch: {}     # lets you trigger it manually from the Actions tab

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 20

      - name: Sync Steam + RA data and push to the hub
        env:
          STEAM_API_KEY: ${{ secrets.STEAM_API_KEY }}
          STEAM_ID: ${{ secrets.STEAM_ID }}
          RA_USER: ${{ secrets.RA_USER }}
          RA_API_KEY: ${{ secrets.RA_API_KEY }}
          HUB_STATUS_TOKEN: ${{ secrets.HUB_STATUS_TOKEN }}
        run: node scripts/sync-apis.mjs

      # Its own step so a Reddit outage can't stop the Steam/RA sync from committing, and so
      # this step alone goes red when the club fetch breaks — that red run IS the "tell me when
      # the fetch fails" notification, via GitHub's own workflow-failure email.
      # continue-on-error keeps the commit step below running, so the error marker written into
      # gotm.json still lands and the page can show the list as stale.
      - name: Refresh the r/SBCGaming Game of the Month list
        id: gotm
        continue-on-error: true
        env:
          REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
          REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
          # Optional. Only completes Reddit's preferred User-Agent string; not a credential.
          REDDIT_USERNAME: ${{ secrets.REDDIT_USERNAME }}
        run: node scripts/fetch-gotm.mjs

      - name: Commit results if anything changed
        run: |
          git config user.name "game-tracker-bot"
          git config user.email "actions@users.noreply.github.com"
          git add games.json last-synced.json gotm.json
          git diff --staged --quiet || git commit -m "Sync Steam & RetroAchievements data"
          git pull --rebase origin main
          git push

      - name: Fail the run if the club fetch failed
        if: steps.gotm.outcome == 'failure'
        run: |
          echo "::error::GOTM fetch failed - gotm.json kept its last known picks and is marked stale."
          exit 1
