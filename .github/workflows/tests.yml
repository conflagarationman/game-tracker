name: Tests

# The suites are plain Node scripts with no dependencies, no network and no tokens, so this
# needs no install step and no secrets — which is exactly why there was no good reason for
# them to have gone unrun on changes for this long. Each one prints "N/N passing" and exits
# non-zero on failure.
on:
  pull_request: {}
  # Only main on push: a PR branch already gets covered by the pull_request trigger above,
  # and without this restriction every PR push would run the suite twice for no extra signal.
  push:
    branches: [main]

# Read-only. Unlike sync-games.yml this job commits nothing; it only runs tests.
permissions:
  contents: read

# A new push to the same PR makes the in-flight run irrelevant — cancel it rather than
# letting two runs race to report on the same branch.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 20

      # Every suite is discovered, not listed: a new scripts/*.test.mjs is run the day it is added,
      # with nobody to remember to edit this file. A suite that fails is named in the summary but
      # the loop carries on, so one red run shows every broken suite at once. Finding no suites at
      # all is a failure too (a renamed folder or a bad glob must not pass by running nothing).
      - name: Run every suite (scripts/*.test.mjs and the Worker's)
        run: |
          shopt -s nullglob
          suites=(scripts/*.test.mjs)
          if [ "${#suites[@]}" -eq 0 ]; then
            echo "::error::found no scripts/*.test.mjs suites"
            exit 1
          fi
          if [ ! -f worker/index.test.mjs ]; then
            echo "::error::worker/index.test.mjs is missing"
            exit 1
          fi
          failed=()
          for s in "${suites[@]}"; do
            echo "::group::$s"
            if ! node "$s"; then failed+=("$s"); fi
            echo "::endgroup::"
          done
          echo "::group::worker/index.test.mjs"
          if ! (cd worker && node index.test.mjs); then failed+=("worker/index.test.mjs"); fi
          echo "::endgroup::"
          echo "Ran $(( ${#suites[@]} + 1 )) suites."
          if [ "${#failed[@]}" -gt 0 ]; then
            for f in "${failed[@]}"; do echo "::error::suite failed: $f"; done
            exit 1
          fi

  # The pages themselves, in a real browser. Separate from the job above because it is the
  # only thing here that needs an install step (Playwright + Chromium) and network for it.
  # The Worker is stubbed inside the test, so this can never write to games.json.
  browser:
    # Pinned: ubuntu-latest became 26.04 (Oct 2026), which Playwright has no Chromium build for yet.
    # Move back to ubuntu-latest once Playwright supports it.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 20

      - name: Install Playwright and Chromium
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium

      - name: Pages smoke test (index, add, wrapped at phone and desktop widths)
        run: node scripts/smoke.browser.mjs
