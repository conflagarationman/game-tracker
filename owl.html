<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kaepora Gaebora</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>%F0%9F%A6%89</text></svg>">
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* Same palette as index.html, plus the two Hyrule text-box colours: OoT draws key words in red
   and places in blue, and the owl's dialogue keeps that convention. */
:root{
  --bg:#0e0e10;--surface:#17171a;--surface2:#1f1f24;--border:#2a2a30;--border2:#3a3a42;
  --text:#f0f0f0;--muted:#888890;--dim:#555560;--accent:#c8f542;
  --box:#0b1430e6;--box-edge:#5a6aa8;--hy-red:#ff5a5a;--hy-blue:#6ab4ff;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
body{background:radial-gradient(ellipse at 50% 0%,#1b2340 0%,var(--bg) 60%);background-color:var(--bg);color:var(--text);
  font-family:'Syne',sans-serif;min-height:100vh;padding:1rem 16px max(2rem,env(safe-area-inset-bottom));}
.wrap{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:1rem;}
.top{display:flex;align-items:center;justify-content:space-between;gap:.75rem;}
.back{font-family:'DM Mono',monospace;font-size:.7rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);text-decoration:none;
  padding:.4rem .8rem;border:1px solid var(--border2);border-radius:99px;white-space:nowrap;}
.back:hover{color:var(--text);}
/* Syne's 800 weight is wide: at 1.4rem the title alone overflowed a 375px phone. */
h1{font-size:1.4rem;font-weight:800;letter-spacing:-.03em;color:var(--accent);white-space:nowrap;min-width:0;}

@media (max-width:440px){ h1{font-size:1.1rem;} .back{padding:.35rem .6rem;} }

/* The owl. Bobs on its branch and blinks; both stop under reduced motion. */
.perch{display:flex;justify-content:center;padding-top:.5rem;}
.owl{width:150px;height:auto;animation:bob 3.2s ease-in-out infinite;transform-origin:50% 100%;}
.owl .lid{transform-box:fill-box;transform-origin:50% 0;transform:scaleY(0);animation:blink 5s infinite;}
.owl.talking .beak-low{animation:talk .18s ease-in-out infinite alternate;}
.owl.flap .wing-l{animation:flapL .25s ease-in-out 6 alternate;transform-box:fill-box;transform-origin:100% 20%;}
.owl.flap .wing-r{animation:flapR .25s ease-in-out 6 alternate;transform-box:fill-box;transform-origin:0% 20%;}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-1deg);}50%{transform:translateY(-6px) rotate(1deg);}}
@keyframes blink{0%,92%,100%{transform:scaleY(0);}95%{transform:scaleY(1);}}
@keyframes talk{from{transform:translateY(0);}to{transform:translateY(2px);}}
@keyframes flapL{to{transform:rotate(35deg);}}
@keyframes flapR{to{transform:rotate(-35deg);}}

/* The text box: OoT's translucent navy panel with a bevelled edge and the blinking ▼. */
.box{position:relative;background:var(--box);border:2px solid var(--box-edge);border-radius:14px;
  box-shadow:inset 0 0 0 2px #00000080,0 10px 30px #0008;padding:1rem 1.1rem 1.6rem;min-height:7.5rem;cursor:pointer;
  font-size:1.05rem;line-height:1.55;font-weight:600;}
.box .r{color:var(--hy-red);} .box .b{color:var(--hy-blue);}
.box .more{position:absolute;right:.9rem;bottom:.45rem;color:var(--hy-red);font-size:.8rem;opacity:0;}
.box.done .more{opacity:1;animation:nudge .8s ease-in-out infinite alternate;}
@keyframes nudge{to{transform:translateY(3px);}}

.choices{display:flex;flex-wrap:wrap;gap:.5rem;justify-content:center;min-height:2.6rem;}
.choice{font-family:'Syne',sans-serif;font-weight:700;font-size:.95rem;color:var(--text);background:var(--surface);
  border:1px solid var(--border2);border-radius:99px;padding:.6rem 1.1rem;cursor:pointer;}
.choice:hover,.choice:focus-visible{border-color:var(--accent);outline:none;}
.choice.yes{border-color:var(--hy-red);}
.choice.go{background:var(--accent);color:#0e0e10;border-color:var(--accent);}
.choice:disabled{opacity:.5;cursor:default;}

/* The pick, shown under the box once the owl names it. */
.pick{display:none;gap:.9rem;align-items:center;background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:.75rem;}
.pick.show{display:flex;}
.cover{width:72px;height:96px;flex:none;border-radius:8px;object-fit:cover;background:var(--surface2);}
.cover-fallback{width:72px;height:96px;flex:none;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:1.8rem;}
.pick-main{min-width:0;display:flex;flex-direction:column;gap:.3rem;}
.pick-title{font-weight:800;font-size:1.05rem;line-height:1.2;overflow-wrap:anywhere;}
.plat{font-family:'DM Mono',monospace;font-size:.65rem;text-transform:uppercase;letter-spacing:.06em;padding:.15rem .5rem;border-radius:99px;align-self:flex-start;}
.why{font-family:'DM Mono',monospace;font-size:.75rem;color:var(--muted);line-height:1.5;}
.count{font-family:'DM Mono',monospace;font-size:.65rem;color:var(--dim);text-align:center;}
.redo{background:none;border:none;color:var(--muted);font-family:'DM Mono',monospace;font-size:.7rem;text-transform:uppercase;
  letter-spacing:.08em;cursor:pointer;text-decoration:underline;align-self:center;padding:.4rem;}
.redo[hidden]{display:none;}

@media (prefers-reduced-motion:reduce){
  .owl,.owl .lid,.owl.talking .beak-low,.owl.flap .wing-l,.owl.flap .wing-r,.box.done .more{animation:none;}
}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <a class="back" href="index.html">← Tracker</a>
    <h1>Kaepora Gaebora</h1>
  </div>

  <div class="perch" aria-hidden="true">
    <svg class="owl" id="owl" viewBox="0 0 160 170" xmlns="http://www.w3.org/2000/svg">
      <!-- branch -->
      <path d="M8 158 Q80 150 152 160" stroke="#5a3d22" stroke-width="9" stroke-linecap="round" fill="none"/>
      <path d="M118 156 l16 -12" stroke="#5a3d22" stroke-width="5" stroke-linecap="round"/>
      <!-- wings -->
      <path class="wing-l" d="M38 70 Q14 100 30 140 Q44 128 50 96 Z" fill="#6b4a2b"/>
      <path class="wing-r" d="M122 70 Q146 100 130 140 Q116 128 110 96 Z" fill="#6b4a2b"/>
      <!-- body -->
      <ellipse cx="80" cy="100" rx="44" ry="52" fill="#8a6239"/>
      <ellipse cx="80" cy="112" rx="28" ry="36" fill="#d9c3a0"/>
      <g stroke="#8a6239" stroke-width="2.5" fill="none" stroke-linecap="round">
        <path d="M66 100 l5 5 l5 -5"/><path d="M84 100 l5 5 l5 -5"/>
        <path d="M60 114 l5 5 l5 -5"/><path d="M75 116 l5 5 l5 -5"/><path d="M90 114 l5 5 l5 -5"/>
        <path d="M68 128 l5 5 l5 -5"/><path d="M82 128 l5 5 l5 -5"/>
      </g>
      <!-- ear tufts + head -->
      <path d="M44 40 L36 10 L62 34 Z" fill="#6b4a2b"/>
      <path d="M116 40 L124 10 L98 34 Z" fill="#6b4a2b"/>
      <ellipse cx="80" cy="56" rx="46" ry="34" fill="#8a6239"/>
      <!-- facial discs -->
      <circle cx="60" cy="56" r="20" fill="#e8d7b8"/>
      <circle cx="100" cy="56" r="20" fill="#e8d7b8"/>
      <!-- eyes -->
      <circle cx="60" cy="56" r="13" fill="#ffcf33"/>
      <circle cx="100" cy="56" r="13" fill="#ffcf33"/>
      <circle cx="61" cy="57" r="7" fill="#111"/>
      <circle cx="101" cy="57" r="7" fill="#111"/>
      <circle cx="63" cy="54" r="2.2" fill="#fff"/>
      <circle cx="103" cy="54" r="2.2" fill="#fff"/>
      <rect class="lid" x="46" y="42" width="28" height="28" rx="14" fill="#8a6239"/>
      <rect class="lid" x="86" y="42" width="28" height="28" rx="14" fill="#8a6239"/>
      <!-- brows -->
      <path d="M40 38 Q60 30 76 44" stroke="#4a311b" stroke-width="4" fill="none" stroke-linecap="round"/>
      <path d="M120 38 Q100 30 84 44" stroke="#4a311b" stroke-width="4" fill="none" stroke-linecap="round"/>
      <!-- beak -->
      <path d="M72 70 L88 70 L80 84 Z" fill="#f2a33a"/>
      <path class="beak-low" d="M75 78 L85 78 L80 88 Z" fill="#c97d1f"/>
      <!-- talons -->
      <g fill="#f2a33a"><circle cx="66" cy="152" r="4"/><circle cx="74" cy="153" r="4"/><circle cx="86" cy="153" r="4"/><circle cx="94" cy="152" r="4"/></g>
    </svg>
  </div>

  <div class="box" id="box" role="status" aria-live="polite" tabindex="0"><span id="text"></span><span class="more">▼</span></div>

  <div class="pick" id="pick"></div>
  <div class="choices" id="choices"></div>
  <div class="count" id="count"></div>
  <button type="button" class="redo" id="redo" hidden onclick="ask()">Change my answers</button>
</div>

<script src="worker-config.js"></script>
<script src="pick.js"></script>
<script>
// ─── Kaepora Gaebora ───────────────────────────────────
// The owl from Ocarina of Time, who gives long-winded advice and then asks whether you'd like
// to hear it again. Here "Yes" is the reroll (the next game down GTPick's ranking) and "No" is
// the commitment: it moves the game to Now Playing through the Worker, exactly like the
// picker's ▶ Start on index.html. The ranking itself is pick.js; this page is only the owl.
const PL={steam:'Steam',steamdeck:'Steam Deck',pc:'PC',ps5:'PS5',switch:'Switch',switch2:'Switch 2',ayn:'AYN Thor',retro:'Retro',wiiu:'Wii U'};
const PC={steam:'#00e5ff',steamdeck:'#a06bff',pc:'#9aa7b8',ps5:'#ff6b4a',switch:'#ff4a6b',switch2:'#4aff8c',ayn:'#ff4af0',retro:'#ffb84a',wiiu:'#009ac7'};
const PLAT_EMOJI={steam:'🖥',steamdeck:'🎮',pc:'💻',ps5:'🎮',switch:'🎮',switch2:'🎮',ayn:'📱',retro:'👾',wiiu:'🎮'};
const CAN_EDIT = !!(typeof WORKER !== 'undefined' && WORKER.url && WORKER.key);
const DEVICE_SAY = { any:'whatever is nearest', pc:'the PC', deck:'the Deck', thor:'the Thor', switch:'the Switch', ps5:'the PS5', wiiu:'the Wii U' };
const MOOD_ASK = { chill:'Something easy on the mind', deep:'Something to sink into', finish:'Wrap something up' };

let G = [], COVERS = {}, PLAY = null, GOTM = null;
let ANS = { device:null, time:null, mood:null };
let PICKS = [], AT = 0, timer = null, finishTyping = null;
try { Object.assign(ANS, JSON.parse(localStorage.getItem('gt_owl') || '{}')); } catch(e){}

function esc(s){ return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function todayStr(){
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}
const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;

// Lines are written with *red* and _blue_ markers, OoT's two highlight colours. Typed out a
// character at a time; tapping the box finishes the line at once.
function markup(line){ return esc(line).replace(/\*(.+?)\*/g,'<span class="r">$1</span>').replace(/_(.+?)_/g,'<span class="b">$1</span>'); }
function say(line){
  return new Promise(resolve => {
    clearInterval(timer);
    const box = document.getElementById('box'), out = document.getElementById('text'), owl = document.getElementById('owl');
    const html = markup(line);
    choices([]);                                   // nothing to answer while the owl is talking
    box.classList.remove('done');
    const end = () => { clearInterval(timer); out.innerHTML = html; box.classList.add('done'); owl.classList.remove('talking'); finishTyping = null; resolve(); };
    finishTyping = end;
    if (reduced) return end();
    // Walk the visible characters while keeping the colour spans intact.
    const tmp = document.createElement('div'); tmp.innerHTML = html;
    const total = tmp.textContent.length; let n = 0;
    owl.classList.add('talking');
    timer = setInterval(() => {
      n += 2;
      if (n >= total) return end();
      out.innerHTML = clip(html, n);
    }, 22);
  });
}
// The first n visible characters of a marked-up string, tags kept balanced.
function clip(html, n){
  let out = '', seen = 0, open = 0;
  for (let i = 0; i < html.length && seen < n; i++){
    if (html[i] === '<'){
      const j = html.indexOf('>', i); const tag = html.slice(i, j+1);
      open += tag.startsWith('</') ? -1 : 1; out += tag; i = j; continue;
    }
    if (html[i] === '&'){ const j = html.indexOf(';', i); out += html.slice(i, j+1); i = j; seen++; continue; }
    out += html[i]; seen++;
  }
  return out + '</span>'.repeat(Math.max(0, open));
}
document.getElementById('box').addEventListener('click', () => finishTyping && finishTyping());
document.getElementById('box').addEventListener('keydown', e => { if ((e.key==='Enter'||e.key===' ') && finishTyping){ e.preventDefault(); finishTyping(); } });

function choices(list, focusFirst){
  const el = document.getElementById('choices');
  el.innerHTML = '';
  list.forEach(([label, fn, cls]) => {
    const b = document.createElement('button');
    b.type = 'button'; b.className = 'choice' + (cls ? ' ' + cls : ''); b.textContent = label;
    b.onclick = () => { el.querySelectorAll('button').forEach(x => x.disabled = true); fn(); };
    el.appendChild(b);
  });
  if (focusFirst && el.firstChild) el.firstChild.focus({ preventScroll:true });
}

// ─── The conversation ──────────────────────────────────
async function ask(){
  document.getElementById('pick').classList.remove('show');
  document.getElementById('count').textContent = '';
  document.getElementById('redo').hidden = true;
  choices([]);
  const { DEVICES, TIMES, MOODS, devicesWithGames } = GTPick;
  await say('Hoo hoot! Jonny… look up here! Before you go anywhere, answer me this. What have you got in your hands?');
  choices(devicesWithGames(G).map(k => [DEVICES[k].label, () => { ANS.device = k; askTime(); }]));

  async function askTime(){
    await say(`_${DEVICE_SAY[ANS.device] || DEVICES[ANS.device].label}_, hoo. And how long until you must be on your way?`);
    choices(Object.entries(TIMES).map(([k,t]) => [t.label, () => { ANS.time = k; askMood(); }]));
  }
  async function askMood(){
    await say('Hoo hoo. And what does your heart want tonight?');
    choices(Object.entries(MOODS).map(([k]) => [MOOD_ASK[k], () => { ANS.mood = k; decide(); }]));
  }
}

function decide(){
  try { localStorage.setItem('gt_owl', JSON.stringify(ANS)); } catch(e){}
  PICKS = GTPick.pickGames(G, { device:ANS.device, time:ANS.time, mood:ANS.mood, play:PLAY, gotm:GOTM, limit:8 });
  AT = 0;
  if (!PICKS.length){
    say(`Hoo… nothing in Now Playing or Up Next plays on _${DEVICE_SAY[ANS.device] || ANS.device}_. Add something to Up Next, and come find me again.`);
    choices([['Ask again', ask]]);
    return;
  }
  reveal(true);
}

const OPENERS = [
  'Listen well. The road ahead leads to',
  'Very well, then. Hoo. I see',
  'Hmm… this time, look toward',
  'Then hear this, and listen closely:',
  'Hoo hoot! Perhaps instead',
];

async function reveal(first){
  const p = PICKS[AT], g = p.g;
  showCard(p);
  document.getElementById('count').textContent = `${AT+1} of ${PICKS.length}`;
  document.getElementById('redo').hidden = false;
  const opener = first ? OPENERS[0] : OPENERS[1 + (AT - 1) % (OPENERS.length - 1)];
  const why = p.reasons.length ? ` ${p.reasons.join('. ')}.` : '';
  await say(`${opener} *${g.t}*.${why}`);
  await say('Hoo hoot! …Did you get all that? Do you want to hear it again?');
  // The cursor starts on "Yes", as it always did. Everyone who played OoT remembers why.
  choices([
    ['Yes', again, 'yes'],
    ['No', () => commit(g), 'go'],
  ], true);
}

async function again(){
  AT++;
  if (AT >= PICKS.length){
    AT = 0;
    document.getElementById('owl').classList.add('flap');
    setTimeout(() => document.getElementById('owl').classList.remove('flap'), 1600);
    await say("Hoo… that's every road I know. Very well. From the beginning, then.");
  }
  reveal(false);
}

async function commit(g){
  const owl = document.getElementById('owl');
  if (g.s === 'playing' || g.s === 'ongoing' || !CAN_EDIT){
    owl.classList.add('flap');
    await say(`Hoo hoo hoo! Then off you go to *${g.t}*. I'll be watching.`);
  } else {
    const ok = await startGame(g);
    owl.classList.add('flap');
    await say(ok
      ? `Hoo hoo hoo! *${g.t}* is in Now Playing. Off you go. I'll be watching.`
      : `Hoo… the message didn't reach the tracker. Go play *${g.t}* anyway, and mark it later.`);
  }
  choices([['Ask me again', ask], ['Back to the tracker', () => { location.href = 'index.html'; }]]);
}

// Same request as saveEdit() in index.html: the Worker's /games/edit with the shared key.
async function startGame(g){
  try {
    const res = await fetch(WORKER.url + '/games/edit', {
      method:'POST',
      headers:{ 'Content-Type':'application/json', 'X-Sync-Key': WORKER.key },
      body: JSON.stringify({ id: g.id, s:'playing', start: todayStr() }),
    });
    if (!res.ok) throw new Error(`request failed (${res.status})`);
    g.s = 'playing';
    return true;
  } catch (err) {
    console.error('Start failed', err);
    return false;
  }
}

function showCard(p){
  const g = p.g, url = COVERS[g.t.toLowerCase()], color = PC[g.p] || '#555';
  const fallback = `<div class="cover-fallback" style="background:${color}20;color:${color}${url ? ';display:none' : ''}">${PLAT_EMOJI[g.p] || '🎮'}</div>`;
  const art = url ? `<img class="cover" src="${esc(url)}" alt="" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'">${fallback}` : fallback;
  const el = document.getElementById('pick');
  el.innerHTML = `${art}<div class="pick-main"><div class="pick-title">${esc(g.t)}</div>
    <span class="plat" style="background:${color}22;color:${color}">${esc(PL[g.p] || g.p)}</span>
    <div class="why">${p.reasons.map(esc).join(' · ')}</div></div>`;
  el.classList.add('show');
}

// ─── Load ──────────────────────────────────────────────
// Same cache-busting reads and GOTM window refresh as index.html (see the notes there).
const fresh = (file) => fetch(`${file}?_=${Date.now()}`);
function refreshGotmWindows(gotm, now = new Date()){
  if (!gotm || !Array.isArray(gotm.picks)) return gotm;
  const nowIdx = now.getFullYear() * 12 + now.getMonth();
  for (const p of gotm.picks){
    const m = /^(\d{4})-(\d{2})$/.exec(p.month || '');
    if (!m) continue;
    p.monthsLeft = Number(m[1]) * 12 + (Number(m[2]) - 1) + 12 - nowIdx;
    p.retired = p.monthsLeft <= 0;
  }
  return gotm;
}
Promise.all([
  fresh('games.json').then(r => r.json()),
  fresh('covers.json').then(r => r.ok ? r.json() : {}).catch(() => ({})),
  fresh('gotm.json').then(r => r.ok ? r.json() : null).catch(() => null),
  fresh('play-check.json').then(r => r.ok ? r.json() : null).catch(() => null),
]).then(([games, covers, gotm, play]) => {
  G = games; COVERS = covers; GOTM = refreshGotmWindows(gotm); PLAY = play;
  ask();
}).catch(err => {
  console.error('Failed to load game data', err);
  say(`Hoo… I can't see the tracker from here (${err.message || 'network error'}). Try again in a moment.`);
  choices([['Try again', () => location.reload()]]);
});
</script>
</body>
</html>
