name: Sync Steam & RetroAchievements

on:
  schedule:
    - cron: '0 13 * * *'   # daily, ~1pm UTC — matches steph-tv-tracker's own nightly job
  workflow_dispatch:        # lets you trigger it manually from the Actions tab
    inputs:
      library_meta:
        description: "Also fill a slice of library-meta.json (Steam genres/Metacritic/Deck)"
        type: boolean
        default: false

permissions:
  contents: write

# Every status change made through the Worker dispatches this workflow, and the tracker's
# triage flow can make a dozen of those in a minute. Without a group they'd all run at once
# and race each other to push games.json; with one, a burst collapses to one run plus one
# queued run (GitHub keeps only the newest pending run in a group).
concurrency:
  group: sync-games
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Healthcheck - signal start
        run: curl -fsS -m 10 --retry 3 https://hc-ping.com/8cb20190-ff66-41b6-a8bc-4b4bd993082a/start

      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 20

      - name: Sync Steam + RA data
        env:
          STEAM_API_KEY: ${{ secrets.STEAM_API_KEY }}
          STEAM_ID: ${{ secrets.STEAM_ID }}
          RA_USER: ${{ secrets.RA_USER }}
          RA_API_KEY: ${{ secrets.RA_API_KEY }}
          HUB_STATUS_TOKEN: ${{ secrets.HUB_STATUS_TOKEN }}
          HUB_ASF_TOKEN: ${{ secrets.HUB_ASF_TOKEN }}
        run: node scripts/sync-apis.mjs

      # Reads the club's post from Arctic Shift (a Reddit archive), which needs no key. The
      # old Reddit OAuth path is gone: new Reddit API apps now need manual pre-approval, and
      # this step sat disabled for want of secrets that could no longer be obtained.
      - name: Refresh the r/SBCGaming Game of the Month list
        id: gotm
        continue-on-error: true
        run: node scripts/fetch-gotm.mjs

      # Genres, Metacritic and Deck rating for the owl's Steam wildcards, a slice a day (it
      # takes several minutes, so not on every Worker-dispatched run). Never fails the sync.
      - name: Library meta for the owl's wildcards
        if: github.event_name == 'schedule' || inputs.library_meta
        continue-on-error: true
        timeout-minutes: 12
        run: node scripts/library-meta.mjs

      # HowLongToBeat estimates for the owl's wildcards (about 40 a day, ~1s each), after the meta
      # step so Metacritic scores are in. Never fails the sync, and says so on the run page if it
      # couldn't reach HowLongToBeat.
      - name: Play-length estimates for the owl's wildcards
        if: github.event_name == 'schedule' || inputs.library_meta
        continue-on-error: true
        timeout-minutes: 8
        run: node scripts/library-hltb.mjs

      # Kaepora Gaebora's pick for the Home Hub's owl: the real pick.js, run here so the hub
      # reads plain data instead of re-implementing the ranking. Never fails the sync.
      - name: Owl's pick for the Home Hub
        continue-on-error: true
        run: node scripts/owl-pick.mjs

      # On the first sync of a new year (8 AM ET Jan 1), saves last year's review inputs as
      # wrapped-<year>.json so later syncs can't change a finished year. A no-op every other day.
      - name: Freeze last year's Wrapped
        continue-on-error: true
        run: node scripts/freeze-wrapped.mjs

      - name: Commit results if anything changed
        run: |
          git config user.name "game-tracker-bot"
          git config user.email "actions@users.noreply.github.com"
          git add games.json last-synced.json gotm.json play-check.json asf-idle.json owl-pick.json library.json library-meta.json library-hltb.json ledger.json achievements-log.json
          git add wrapped-2*.json 2>/dev/null || true
          git diff --staged --quiet || git commit -m "Sync Steam & RetroAchievements data"
          # actions/checkout sets the local branch to track its own origin ref, so a bare
          # `pull --rebase` reconciles against whatever branch actually got checked out — on
          # main that's a concurrent-commit race, but a hardcoded "origin main" here breaks a
          # manual workflow_dispatch run against any other branch: it rebases that branch's
          # unrelated history onto main and every file conflicts as add/add.
          git pull --rebase
          git push

      - name: Healthcheck - signal success
        if: success()
        run: curl -fsS -m 10 --retry 3 https://hc-ping.com/8cb20190-ff66-41b6-a8bc-4b4bd993082a

      - name: Healthcheck - signal failure
        if: failure()
        run: curl -fsS -m 10 --retry 3 https://hc-ping.com/8cb20190-ff66-41b6-a8bc-4b4bd993082a/fail

      # After the commit and the healthcheck ping on purpose: a failed club fetch has already
      # kept the last known picks and recorded its error in gotm.json, and the Steam/RA sync
      # succeeded. Going red here is the notification that the club list is going stale.
      - name: Fail the run if the club fetch failed
        if: steps.gotm.outcome == 'failure'
        run: |
          echo "::error::GOTM fetch failed - gotm.json kept its last known picks and is marked stale."
          exit 1
