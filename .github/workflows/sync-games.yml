name: Sync Steam & RetroAchievements

on:
  schedule:
    - cron: '0 13 * * *'   # daily, ~1pm UTC — matches steph-tv-tracker's own nightly job
  workflow_dispatch: {}     # lets you trigger it manually from the Actions tab

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 20

      - name: Sync Steam + RA data and push to the hub
        env:
          STEAM_API_KEY: ${{ secrets.STEAM_API_KEY }}
          STEAM_ID: ${{ secrets.STEAM_ID }}
          RA_USER: ${{ secrets.RA_USER }}
          RA_API_KEY: ${{ secrets.RA_API_KEY }}
          HUB_STATUS_TOKEN: ${{ secrets.HUB_STATUS_TOKEN }}
        run: node scripts/sync-apis.mjs

      # TODO: re-enable once REDDIT_CLIENT_ID/REDDIT_CLIENT_SECRET are set as repo secrets again.
      # Was failing every run with "missing REDDIT_CLIENT_ID/REDDIT_CLIENT_SECRET" (they're unset),
      # which tripped the intentional fail-the-run step below and marked every run red even though
      # the Steam/RA sync itself was succeeding. Disabled here rather than deleting so it's a
      # one-line restore: uncomment this step and the "Fail the run" step, and re-add the secrets.
      # - name: Refresh the r/SBCGaming Game of the Month list
      #   id: gotm
      #   continue-on-error: true
      #   env:
      #     REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
      #     REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
      #     # Optional. Only completes Reddit's preferred User-Agent string; not a credential.
      #     REDDIT_USERNAME: ${{ secrets.REDDIT_USERNAME }}
      #   run: node scripts/fetch-gotm.mjs

      - name: Commit results if anything changed
        run: |
          git config user.name "game-tracker-bot"
          git config user.email "actions@users.noreply.github.com"
          git add games.json last-synced.json gotm.json
          git diff --staged --quiet || git commit -m "Sync Steam & RetroAchievements data"
          git pull --rebase origin main
          git push

      # See TODO above - paired with the disabled GOTM step; re-enable both together.
      # - name: Fail the run if the club fetch failed
      #   if: steps.gotm.outcome == 'failure'
      #   run: |
      #     echo "::error::GOTM fetch failed - gotm.json kept its last known picks and is marked stale."
      #     exit 1
