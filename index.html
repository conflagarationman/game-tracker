<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Game Tracker</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg:#0e0e10;--surface:#17171a;--surface2:#1f1f24;
  --border:#2a2a30;--border2:#3a3a42;--text:#f0f0f0;
  --muted:#888890;--dim:#555560;--accent:#c8f542;
  --playing:#42c8f5;--done:#42f5a0;--dropped:#f54242;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
body{background:var(--bg);color:var(--text);font-family:'Syne',sans-serif;min-height:100vh;padding:2rem 1rem;padding-bottom:max(2rem,env(safe-area-inset-bottom));}
.header{display:flex;align-items:baseline;gap:1rem;margin-bottom:0.5rem;}
h1{font-size:2rem;font-weight:800;letter-spacing:-0.04em;color:var(--accent);}
.updated{font-family:'DM Mono',monospace;font-size:0.62rem;color:var(--dim);margin-bottom:1.5rem;}
.stats-row{display:flex;gap:0.5rem;margin-bottom:2rem;flex-wrap:wrap;}
.stat{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:0.75rem 1rem;text-align:center;min-width:72px;flex:1;}
.stat-n{font-size:1.5rem;font-weight:800;line-height:1;}
.stat-l{font-size:0.62rem;font-family:'DM Mono',monospace;color:var(--muted);margin-top:3px;text-transform:uppercase;letter-spacing:0.08em;}
.slabel{font-size:0.65rem;font-weight:400;font-family:'DM Mono',monospace;color:var(--dim);text-transform:uppercase;letter-spacing:0.12em;margin-bottom:0.6rem;margin-top:1.5rem;}
section:first-of-type .slabel{margin-top:0;}
.game-list{display:flex;flex-direction:column;gap:5px;}

/* Cards */
.card{background:var(--surface);border:1px solid var(--border);border-radius:10px;overflow:hidden;display:flex;flex-direction:row;transition:border-color 0.15s;}
.card:hover{border-color:var(--border2);}
.card.now{border-left:3px solid var(--playing);}
.card.dormant{border-left:3px solid var(--dim);opacity:0.75;}
.card.faded{opacity:0.55;}

/* Thumbnail */
.thumb{width:88px;min-width:88px;height:66px;object-fit:cover;object-position:center;display:block;align-self:center;margin:8px 0 8px 8px;border-radius:4px;}
.thumb-placeholder{width:88px;min-width:88px;height:66px;display:flex;align-items:center;justify-content:center;font-size:1.6rem;flex-shrink:0;align-self:center;margin:8px 0 8px 8px;border-radius:4px;}

/* Now Playing gets a visual-hierarchy bump — bigger art than every other section, scoped
   by container id so it also covers dormant now-playing cards, not just `.card.now`. */
#now .thumb, #now .thumb-placeholder{width:120px;min-width:120px;height:90px;}
#now .thumb-placeholder{font-size:2rem;}

/* Card content */
.card-content{flex:1;padding:0.65rem 0.75rem;display:flex;flex-direction:column;gap:5px;min-width:0;}
.row1{display:flex;align-items:center;gap:0.5rem;min-width:0;}
.row2{display:flex;align-items:center;gap:0.4rem;flex-wrap:wrap;}
.row3{padding-top:2px;}
.qnum{font-family:'DM Mono',monospace;font-size:0.7rem;color:var(--dim);min-width:18px;text-align:center;flex-shrink:0;}
.gtitle{flex:1;font-size:0.9rem;font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}

@media(max-width:400px){
  .thumb{width:72px;min-width:72px;height:54px;}
  .thumb-placeholder{width:40px;min-width:40px;height:40px;font-size:1.1rem;}
  .gtitle{font-size:0.85rem;}
  .hltb{font-size:0.7rem;}
  #now .thumb, #now .thumb-placeholder{width:96px;min-width:96px;height:72px;font-size:1.4rem;}
}

/* HLTB + playtime */
.hltb{font-family:'DM Mono',monospace;font-size:0.78rem;font-weight:700;color:#42c8f5;white-space:nowrap;flex-shrink:0;letter-spacing:-0.02em;}
.hltb-sm{font-size:0.55rem;font-weight:400;opacity:0.65;}
.actual-time{font-family:'DM Mono',monospace;font-size:0.65rem;color:#a06bff;white-space:nowrap;flex-shrink:0;}

/* Platform badges */
.plat{font-family:'DM Mono',monospace;font-size:0.6rem;padding:3px 7px;border-radius:99px;white-space:nowrap;flex-shrink:0;letter-spacing:0.04em;}
.p-steam    {background:#00e5ff22;color:#00e5ff;border:1px solid #00e5ff44;}
.p-steamdeck{background:#a06bff22;color:#a06bff;border:1px solid #a06bff44;}
.p-ps5      {background:#ff6b4a22;color:#ff6b4a;border:1px solid #ff6b4a44;}
.p-switch   {background:#ff4a6b22;color:#ff4a6b;border:1px solid #ff4a6b44;}
.p-switch2  {background:#4aff8c22;color:#4aff8c;border:1px solid #4aff8c44;}
.p-ayn      {background:#ff4af022;color:#ff4af0;border:1px solid #ff4af044;}
.p-retro    {background:#ffb84a22;color:#ffb84a;border:1px solid #ffb84a44;}
.p-wiiu     {background:#009ac722;color:#009ac7;border:1px solid #009ac744;}

/* Meta pills */
.yr{font-family:'DM Mono',monospace;font-size:0.62rem;color:var(--dim);}
.genre-tag{font-size:0.6rem;font-family:'DM Mono',monospace;padding:2px 7px;border-radius:4px;background:#ffffff08;color:var(--muted);white-space:nowrap;}
.rating{font-family:'DM Mono',monospace;font-size:0.7rem;font-weight:600;color:var(--accent);}
.gotm{font-size:0.58rem;font-family:'DM Mono',monospace;padding:2px 7px;border-radius:99px;background:#c8f54218;color:var(--accent);border:1px solid #c8f54230;white-space:nowrap;}
.dropped-pill{font-size:0.58rem;font-family:'DM Mono',monospace;padding:2px 7px;border-radius:99px;background:#f5424218;color:var(--dropped);border:1px solid #f5424230;white-space:nowrap;}
.note-pill{font-size:0.58rem;font-family:'DM Mono',monospace;padding:2px 7px;border-radius:99px;background:#a06bff18;color:#a06bff;border:1px solid #a06bff30;white-space:nowrap;}
.dormant-pill{font-size:0.58rem;font-family:'DM Mono',monospace;padding:2px 7px;border-radius:99px;background:#55556018;color:var(--dim);border:1px solid #55556030;white-space:nowrap;}
.casual-pill{font-size:0.58rem;font-family:'DM Mono',monospace;padding:2px 7px;border-radius:99px;background:#42c8f510;color:#42c8f580;border:1px solid #42c8f520;white-space:nowrap;}
.start-pill{font-size:0.58rem;font-family:'DM Mono',monospace;padding:2px 7px;border-radius:99px;background:#c8f54210;color:#c8f54270;border:1px solid #c8f54220;white-space:nowrap;}
.queued-pill{font-size:0.58rem;font-family:'DM Mono',monospace;padding:2px 7px;border-radius:99px;background:#55556015;color:var(--dim);border:1px solid #55556025;white-space:nowrap;}
.lp-pill{font-size:0.58rem;font-family:'DM Mono',monospace;padding:2px 7px;border-radius:99px;background:#ffffff08;color:var(--muted);border:1px solid #ffffff10;white-space:nowrap;}

/* Mastery */
.mast{font-size:0.58rem;font-family:'DM Mono',monospace;padding:2px 7px;border-radius:99px;white-space:nowrap;}
.mast-progress{background:#f5c84218;color:#f5c842;border:1px solid #f5c84230;}
.mast-mastered{background:#ffb84a22;color:#ffb84a;border:1px solid #ffb84a44;}
.mast-platinum{background:#c8b4ff22;color:#c8b4ff;border:1px solid #c8b4ff44;}
.mast-100{background:#42f5a022;color:var(--done);border:1px solid #42f5a044;}

/* Difficulty */
.diff{font-size:0.58rem;font-family:'DM Mono',monospace;padding:2px 7px;border-radius:99px;white-space:nowrap;}
.diff-1{background:#42f5a018;color:#42f5a0;border:1px solid #42f5a030;}
.diff-2{background:#42c8f518;color:#42c8f5;border:1px solid #42c8f530;}
.diff-3{background:#f5e04218;color:#f5e042;border:1px solid #f5e04230;}
.diff-4{background:#f5a04218;color:#f5a042;border:1px solid #f5a04230;}
.diff-5{background:#f5424218;color:#f54242;border:1px solid #f5424230;}

/* Achievement bar */
.ach-bar-wrap{display:flex;align-items:center;gap:8px;}
.ach-bar-track{flex:1;background:var(--surface2);border-radius:3px;height:4px;overflow:hidden;}
.ach-bar-fill{height:4px;border-radius:3px;}
.ach-pct{font-family:'DM Mono',monospace;font-size:0.58rem;color:var(--muted);min-width:48px;text-align:right;flex-shrink:0;}
.ach-lbl{font-family:'DM Mono',monospace;font-size:0.55rem;color:var(--dim);flex-shrink:0;}

/* Collapsible */
.cr{display:flex;align-items:center;gap:0.5rem;cursor:pointer;padding:0.85rem 0;color:var(--dim);font-size:0.68rem;font-family:'DM Mono',monospace;text-transform:uppercase;letter-spacing:0.1em;border-top:1px solid var(--border);margin-top:1.5rem;user-select:none;touch-action:manipulation;}
.cr:hover{color:var(--muted);}
.cr:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px;}

.search-box{width:100%;background:var(--surface);border:1px solid var(--border);border-radius:8px;color:var(--text);font-family:'Syne',sans-serif;font-size:0.85rem;padding:0.6rem 0.8rem;margin-bottom:0.75rem;}
.search-box::placeholder{color:var(--dim);}
.search-box:focus{outline:none;border-color:var(--accent);}

/* Year log */
.yg{margin-bottom:1.5rem;}
.yhead{font-size:1rem;font-weight:700;color:var(--accent);margin-bottom:0.75rem;display:flex;align-items:baseline;gap:0.75rem;}
.ysub{font-size:0.7rem;font-family:'DM Mono',monospace;color:var(--muted);font-weight:400;}
.ystats{display:grid;grid-template-columns:repeat(auto-fill,minmax(80px,1fr));gap:6px;margin-bottom:1rem;}
.ys{background:var(--surface2);border-radius:6px;padding:8px 10px;text-align:center;}
.ys-n{font-size:1.1rem;font-weight:800;}
.ys-l{font-size:0.58rem;font-family:'DM Mono',monospace;color:var(--muted);margin-top:2px;text-transform:uppercase;}
.bsec{margin-bottom:0.75rem;}
.blbl{font-size:0.58rem;font-family:'DM Mono',monospace;color:var(--dim);text-transform:uppercase;letter-spacing:0.1em;margin-bottom:4px;}
.brow{display:flex;align-items:center;gap:8px;margin:3px 0;}
.bname{font-size:0.68rem;font-family:'DM Mono',monospace;color:var(--muted);width:110px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex-shrink:0;}
.btrack{flex:1;background:var(--surface2);border-radius:2px;height:4px;}
.bfill{height:4px;border-radius:2px;}
.bval{font-size:0.62rem;font-family:'DM Mono',monospace;color:var(--dim);min-width:14px;text-align:right;}
.hlg{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:1rem 0;}
.hl{background:var(--surface2);border-radius:8px;padding:10px 12px;}
.hl-l{font-size:0.58rem;font-family:'DM Mono',monospace;color:var(--dim);text-transform:uppercase;letter-spacing:0.08em;}
.hl-v{font-size:0.8rem;font-weight:700;margin-top:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.hl-s{font-size:0.62rem;font-family:'DM Mono',monospace;color:var(--muted);}
.mg{margin-bottom:1rem;}
.mh{font-size:0.6rem;font-family:'DM Mono',monospace;color:var(--dim);text-transform:uppercase;letter-spacing:0.1em;margin-bottom:6px;}
.empty{color:var(--dim);font-size:0.8rem;font-family:'DM Mono',monospace;padding:0.5rem 0;}
</style>
</head>
<body>
<div class="header"><h1>GAME LOG</h1></div>
<div class="updated" id="updated-stamp">loading…</div>
<div class="stats-row" id="stats"></div>
<section aria-labelledby="now-playing-heading">
  <h2 class="slabel" id="now-playing-heading">Now playing</h2>
  <div class="game-list" id="now"></div>
</section>
<section aria-labelledby="up-next-heading">
  <h2 class="slabel" id="up-next-heading">Up next</h2>
  <div class="game-list" id="queue"></div>
</section>
<section aria-labelledby="soon-heading">
  <h2 class="slabel" id="soon-heading">Soon™</h2>
  <div class="game-list" id="soon"></div>
</section>

<section aria-label="Archive">
  <div class="cr" id="ar-toggle" role="button" tabindex="0" aria-expanded="false" aria-controls="ar-panel" onclick="tog('ar')" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();tog('ar');}"><span id="ar-arr" aria-hidden="true">▶</span><span id="ar-lbl">Archive (0)</span></div>
  <div id="ar-panel" style="display:none;margin-top:0.75rem;">
    <input type="text" id="ar-search" class="search-box" placeholder="Search archive by title…" aria-label="Search archive by title" oninput="renderPanels()">
    <div id="ar-list"></div>
  </div>
</section>
<section aria-label="Year log">
  <div class="cr" id="yl-toggle" role="button" tabindex="0" aria-expanded="false" aria-controls="yl-panel" onclick="tog('yl')" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();tog('yl');}"><span id="yl-arr" aria-hidden="true">▶</span><span>Year log</span></div>
  <div id="yl-panel" style="display:none;margin-top:0.75rem;"></div>
</section>

<script>
// Data lives in games.json/covers.json, kept current by the daily GitHub Action
// (scripts/sync-apis.mjs) instead of being hand-edited into a `const G=[...]` here.
// Everything below — every render function, every pill, the whole Year Log/Archive
// engine — carries over unchanged from the hand-maintained version; only how the
// data arrives changed.
let COVERS = {};
let G = [];

const M=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const PL={steam:'Steam',steamdeck:'Steam Deck',ps5:'PS5',switch:'Switch',switch2:'Switch 2',ayn:'AYN Thor',retro:'Retro',wiiu:'Wii U'};
const PC={steam:'#00e5ff',steamdeck:'#a06bff',ps5:'#ff6b4a',switch:'#ff4a6b',switch2:'#4aff8c',ayn:'#ff4af0',retro:'#ffb84a',wiiu:'#009ac7'};
const PLAT_EMOJI={steam:'🖥',steamdeck:'🎮',ps5:'🎮',switch:'🎮',switch2:'🎮',ayn:'📱',retro:'👾',wiiu:'🎮'};
const DIFF_LABELS={1:'Easy',2:'Normal',3:'Hard',4:'Expert',5:'Brutal'};
let NOW = new Date();
let open={ar:false,yl:false};

function getCover(g) {
  return COVERS[g.t.toLowerCase()] || null;
}

function thumbEl(g) {
  const url = getCover(g);
  const color = PC[g.p] || '#555';
  const emoji = PLAT_EMOJI[g.p] || '🎮';
  if (url) {
    return `<img class="thumb" src="${url}" alt="${g.t}" loading="lazy" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'">
            <div class="thumb-placeholder" style="background:${color}18;color:${color};display:none">${emoji}</div>`;
  }
  return `<div class="thumb-placeholder" style="background:${color}18;color:${color}">${emoji}</div>`;
}

// ─── Helpers ──────────────────────────────────────────
function pb(p){return `<span class="plat p-${p}">${PL[p]||p}</span>`;}

function isDormant(g){
  if(!g.lastPlayed) return false;
  return (NOW - new Date(g.lastPlayed))/(1000*60*60*24) > 30;
}

function hltbEl(g){
  const parts=[];
  if(g.h) parts.push(`<span class="hltb">⏱ ${g.h}<span class="hltb-sm"> est</span></span>`);
  if(g.actualHours) parts.push(`<span class="actual-time">▶ ${g.actualHours}h</span>`);
  return parts.join('');
}

function achBar(g){
  if(g.casual||g.achPct===null) return '';
  const pct=g.achPct;
  const count=g.achCount?`${g.achCount[0]}/${g.achCount[1]}`:'';
  let color = pct>=100?'#42f5a0':pct>=75?'#c8f542':pct>=50?'#f5e042':'#f5a042';
  return `<div class="ach-bar-wrap">
    <span class="ach-lbl">achievements</span>
    <div class="ach-bar-track"><div class="ach-bar-fill" style="width:${pct}%;background:${color};"></div></div>
    <span class="ach-pct">${count} · ${pct}%</span>
  </div>`;
}

function masteryBadge(m){
  if(!m) return '';
  const map={'in-progress':['mast-progress','RA ★ in progress'],'mastered':['mast-mastered','RA ✓ Mastered'],'platinum':['mast-platinum','🏆 Platinum'],'100pct':['mast-100','✓ 100%']};
  const [cls,lbl]=map[m]||['',''];
  return cls?`<span class="mast ${cls}">${lbl}</span>`:'';
}

function diffBadge(d){ return d?`<span class="diff diff-${d}">${DIFF_LABELS[d]}</span>`:''; }
function gotmBadge(g){ return g?`<span class="gotm">GOTM ${g}</span>`:''; }

function parseHltb(h){
  if(!h) return null;
  if(h.includes('-')){const[a,b]=h.replace(/h/g,'').split('-');return(parseFloat(a)+parseFloat(b))/2;}
  return parseFloat(h.replace('h','').replace('+',''))||null;
}

function daysSince(dateStr){
  if(!dateStr) return null;
  const diff = NOW - new Date(dateStr);
  return Math.floor(diff/(1000*60*60*24));
}

function fmtDate(dateStr){
  if(!dateStr) return null;
  const [,mo,da] = dateStr.split('-');
  return M[parseInt(mo,10)-1]+' '+parseInt(da,10);
}

function startEl(g){
  if(!g.start) return '';
  const d = daysSince(g.start);
  if(d===null) return '';
  const label = d===0?'started today':d===1?'1 day in':`${d} days in`;
  return `<span class="start-pill">▷ ${label}</span>`;
}

function lastPlayedEl(g){
  if(!g.lastPlayed) return '';
  const d = daysSince(g.lastPlayed);
  if(d===null) return '';
  const label = d===0?'played today':d===1?'played yesterday':`played ${fmtDate(g.lastPlayed)}`;
  return `<span class="lp-pill">${label}</span>`;
}

function queuedEl(g){
  if(!g.queued) return '';
  const f = fmtDate(g.queued);
  return f?`<span class="queued-pill">queued ${f}</span>`:'';
}

// ─── Card builders ─────────────────────────────────────
function nowC(g){
  const dormant=isDormant(g);
  return `<div class="card ${dormant?'dormant':'now'}">
    ${thumbEl(g)}
    <div class="card-content">
      <div class="row1">${pb(g.p)}<span class="gtitle">${g.t}</span>${hltbEl(g)}</div>
      <div class="row2">
        ${g.y?`<span class="yr">${g.y}</span>`:''}
        ${g.g?`<span class="genre-tag">${g.g}</span>`:''}
        ${gotmBadge(g.gotm)}${masteryBadge(g.mastery)}${diffBadge(g.diff)}
        ${startEl(g)}
        ${dormant?'<span class="dormant-pill">💤 dormant</span>':lastPlayedEl(g)}
        ${g.casual?'<span class="casual-pill">casual play</span>':''}
        ${g.note?`<span class="note-pill">📌 ${g.note}</span>`:''}
      </div>
      ${achBar(g)?`<div class="row3">${achBar(g)}</div>`:''}
    </div>
  </div>`;
}

function qC(g,n,showNum=true){
  const num=showNum?`<span class="qnum">${n}</span>`:'';
  return `<div class="card">
    ${thumbEl(g)}
    <div class="card-content">
      <div class="row1">${num}${pb(g.p)}<span class="gtitle">${g.t}</span>${hltbEl(g)}</div>
      <div class="row2">
        ${g.y?`<span class="yr">${g.y}</span>`:''}
        ${g.g?`<span class="genre-tag">${g.g}</span>`:''}
        ${gotmBadge(g.gotm)}${masteryBadge(g.mastery)}${diffBadge(g.diff)}
        ${queuedEl(g)}
        ${g.casual?'<span class="casual-pill">casual play</span>':''}
        ${g.note?`<span class="note-pill">📌 ${g.note}</span>`:''}
      </div>
      ${achBar(g)?`<div class="row3">${achBar(g)}</div>`:''}
    </div>
  </div>`;
}

function aC(g){
  const gap=(g.y&&g.cy)?(g.cy-g.y):null;
  const dropped=g.s==='dropped';
  return `<div class="card faded">
    ${thumbEl(g)}
    <div class="card-content">
      <div class="row1">${pb(g.p)}<span class="gtitle">${g.t}</span>${hltbEl(g)}</div>
      <div class="row2">
        ${g.cm!=null?`<span class="yr">${M[g.cm]} ${g.cy}</span>`:''}
        ${g.r?`<span class="rating">${g.r}/10</span>`:''}
        ${g.g?`<span class="genre-tag">${g.g}</span>`:''}
        ${gap!=null?`<span class="yr">${gap===0?'same yr':gap+'yr gap'}</span>`:''}
        ${gotmBadge(g.gotm)}${masteryBadge(g.mastery)}${diffBadge(g.diff)}
        ${g.note?`<span class="note-pill">📌 ${g.note}</span>`:''}
        ${dropped?'<span class="dropped-pill">dropped</span>':''}
      </div>
      ${achBar(g)?`<div class="row3">${achBar(g)}</div>`:''}
    </div>
  </div>`;
}

// ─── Year stats ────────────────────────────────────────
function ystats(list){
  const done=list.filter(g=>g.s==='done');
  const rated=done.filter(g=>g.r>0);
  const avg=rated.length?(rated.reduce((s,g)=>s+g.r,0)/rated.length).toFixed(1):null;
  const wg=done.filter(g=>g.y&&g.cy);
  const avgAge=wg.length?Math.round(wg.reduce((s,g)=>s+(g.cy-g.y),0)/wg.length):null;
  const totalHrs=done.reduce((s,g)=>{const h=g.actualHours||parseHltb(g.h);return s+(h||0);},0);
  const mastCount=done.filter(g=>g.mastery&&g.mastery!=='in-progress').length;
  const dwellGames=done.filter(g=>g.start&&g.cy&&g.cm!=null);
  const avgDwell=dwellGames.length?Math.round(dwellGames.reduce((s,g)=>{
    const started=new Date(g.start);
    const finished=new Date(`${g.cy}-${String(g.cm+1).padStart(2,'0')}-15`);
    return s+(finished-started)/(1000*60*60*24);
  },0)/dwellGames.length):null;
  let h=`<div class="ystats">
    <div class="ys"><div class="ys-n" style="color:var(--done)">${done.length}</div><div class="ys-l">Done</div></div>
    <div class="ys"><div class="ys-n" style="color:var(--accent)">${avg?avg+'/10':'—'}</div><div class="ys-l">Avg</div></div>
    ${totalHrs>0?`<div class="ys"><div class="ys-n" style="color:#42c8f5">${Math.round(totalHrs)}h</div><div class="ys-l">Hours</div></div>`:''}
    ${mastCount>0?`<div class="ys"><div class="ys-n" style="color:#ffb84a">${mastCount}</div><div class="ys-l">Mastered</div></div>`:''}
    ${avgAge!=null?`<div class="ys"><div class="ys-n">${avgAge}yr</div><div class="ys-l">Avg gap</div></div>`:''}
    ${avgDwell!=null?`<div class="ys"><div class="ys-n" style="color:#c8f542">${avgDwell}d</div><div class="ys-l">Avg dwell</div></div>`:''}
  </div>`;
  const pc={};done.forEach(g=>{pc[g.p]=(pc[g.p]||0)+1;});
  const mp=Math.max(...Object.values(pc),1);
  if(Object.keys(pc).length){h+=`<div class="bsec"><div class="blbl">Platform</div>${Object.entries(pc).sort((a,b)=>b[1]-a[1]).map(([p,c])=>`<div class="brow"><span class="bname">${PL[p]||p}</span><div class="btrack"><div class="bfill" style="width:${Math.round(c/mp*100)}%;background:${PC[p]||'#888'};"></div></div><span class="bval">${c}</span></div>`).join('')}</div>`;}
  const gc={};done.forEach(g=>{if(g.g)gc[g.g]=(gc[g.g]||0)+1;});
  const mg2=Math.max(...Object.values(gc),1);
  if(Object.keys(gc).length){h+=`<div class="bsec"><div class="blbl">Genre</div>${Object.entries(gc).sort((a,b)=>b[1]-a[1]).map(([gn,c])=>`<div class="brow"><span class="bname">${gn}</span><div class="btrack"><div class="bfill" style="width:${Math.round(c/mg2*100)}%;background:#c8f542;opacity:0.6;"></div></div><span class="bval">${c}</span></div>`).join('')}</div>`;}
  const bm={};done.forEach(g=>{if(g.cm!=null)bm[g.cm]=(bm[g.cm]||0)+1;});
  const mm=Math.max(...Object.values(bm),1);
  if(Object.keys(bm).length){h+=`<div class="bsec"><div class="blbl">Month</div>${Object.entries(bm).sort((a,b)=>a[0]-b[0]).map(([mo,c])=>`<div class="brow"><span class="bname">${M[mo]}</span><div class="btrack"><div class="bfill" style="width:${Math.round(c/mm*100)}%;background:#42c8f5;opacity:0.6;"></div></div><span class="bval">${c}</span></div>`).join('')}</div>`;}
  const br=rated.length?rated.reduce((a,b)=>a.r>=b.r?a:b):null;
  const old=wg.length?wg.reduce((a,b)=>a.y<=b.y?a:b):null;
  const big=wg.length?wg.reduce((a,b)=>(a.cy-a.y)>=(b.cy-b.y)?a:b):null;
  const longest=done.filter(g=>g.actualHours||parseHltb(g.h)).reduce((a,b)=>((a?.actualHours||parseHltb(a?.h)||0)>=(b?.actualHours||parseHltb(b?.h)||0))?a:b,null);
  const hardest=done.filter(g=>g.diff).reduce((a,b)=>(a?.diff||0)>=(b?.diff||0)?a:b,null);
  const hls=[];
  if(br) hls.push(`<div class="hl"><div class="hl-l">Best rated</div><div class="hl-v">${br.t}</div><div class="hl-s">${br.r}/10</div></div>`);
  if(old) hls.push(`<div class="hl"><div class="hl-l">Most vintage</div><div class="hl-v">${old.t}</div><div class="hl-s">Released ${old.y}</div></div>`);
  if(longest) hls.push(`<div class="hl"><div class="hl-l">Longest played</div><div class="hl-v">${longest.t}</div><div class="hl-s">${longest.actualHours||parseHltb(longest.h)}h</div></div>`);
  if(hardest) hls.push(`<div class="hl"><div class="hl-l">Hardest mastered</div><div class="hl-v">${hardest.t}</div><div class="hl-s">${DIFF_LABELS[hardest.diff]}</div></div>`);
  if(big&&(big.cy-big.y)>0) hls.push(`<div class="hl"><div class="hl-l">Biggest backlog gap</div><div class="hl-v">${big.t}</div><div class="hl-s">${big.cy-big.y}yr</div></div>`);
  if(hls.length) h+=`<div class="hlg">${hls.join('')}</div>`;
  return h;
}

// ─── Panels ────────────────────────────────────────────
function tog(k){
  open[k]=!open[k];
  const isAr=k==='ar';
  document.getElementById(isAr?'ar-arr':'yl-arr').textContent=open[k]?'▼':'▶';
  document.getElementById(isAr?'ar-panel':'yl-panel').style.display=open[k]?'block':'none';
  document.getElementById(isAr?'ar-toggle':'yl-toggle').setAttribute('aria-expanded', open[k]?'true':'false');
  renderPanels();
}

function renderPanels(){
  const arch=G.filter(g=>g.s==='done'||g.s==='dropped').sort((a,b)=>(b.cy||0)-(a.cy||0)||((b.cm??-1)-(a.cm??-1)));
  document.getElementById('ar-lbl').textContent=`Archive (${arch.length})`;
  if(open.ar){
    const q=(document.getElementById('ar-search').value||'').trim().toLowerCase();
    const filtered=q?arch.filter(g=>g.t.toLowerCase().includes(q)):arch;
    if(q && filtered.length===0){
      document.getElementById('ar-list').innerHTML='<div class="empty">No archived games match that search.</div>';
    } else {
      const bym={};
      filtered.forEach(g=>{const k=`${g.cy||'?'}__${g.cm??'?'}`;if(!bym[k])bym[k]={year:g.cy,month:g.cm,games:[]};bym[k].games.push(g);});
      document.getElementById('ar-list').innerHTML=Object.values(bym).sort((a,b)=>(b.year||0)-(a.year||0)||((b.month??-1)-(a.month??-1))).map(grp=>`<div class="mg"><div class="mh">${grp.month!=null?M[grp.month]+' '+grp.year:String(grp.year||'Unknown')}</div><div class="game-list">${grp.games.map(aC).join('')}</div></div>`).join('');
    }
  }
  if(open.yl){
    const fin=G.filter(g=>(g.s==='done'||g.s==='dropped')&&g.cy);
    const by={};fin.forEach(g=>{(by[g.cy]=by[g.cy]||[]).push(g);});
    const yrs=Object.keys(by).sort((a,b)=>b-a);
    document.getElementById('yl-panel').innerHTML=yrs.length?yrs.map(yr=>{const list=by[yr];return `<div class="yg"><div class="yhead">${yr}<span class="ysub">${list.filter(g=>g.s==='done').length} completed</span></div>${ystats(list)}<div class="game-list">${list.map(aC).join('')}</div></div>`;}).join(''):'<div class="empty">No completed games yet.</div>';
  }
}

// ─── Main render ───────────────────────────────────────
function render(){
  const playing=G.filter(g=>g.s==='playing');
  const queue=G.filter(g=>g.s==='queue');
  const soon=G.filter(g=>g.s==='soon');
  const done=G.filter(g=>g.s==='done');
  const backlogHrs=[...playing,...queue,...soon].reduce((s,g)=>s+(parseHltb(g.h)||0),0);
  const rated=done.filter(g=>g.r>0);
  const avg=rated.length?(rated.reduce((s,g)=>s+g.r,0)/rated.length).toFixed(1):'—';
  const mastTotal=G.filter(g=>g.mastery&&g.mastery!=='in-progress').length;
  document.getElementById('stats').innerHTML=`
    <div class="stat"><div class="stat-n" style="color:#42c8f5">${playing.length}</div><div class="stat-l">Playing</div></div>
    <div class="stat"><div class="stat-n" style="color:#888">${queue.length+soon.length}</div><div class="stat-l">Backlog</div></div>
    <div class="stat"><div class="stat-n" style="color:#42c8f5;font-size:1.1rem">${Math.round(backlogHrs)}h</div><div class="stat-l">Backlog hrs</div></div>
    <div class="stat"><div class="stat-n" style="color:#42f5a0">${done.length}</div><div class="stat-l">Done</div></div>
    <div class="stat"><div class="stat-n" style="color:#ffb84a">${mastTotal}</div><div class="stat-l">Mastered</div></div>
    <div class="stat"><div class="stat-n" style="color:#c8f542">${avg}</div><div class="stat-l">Avg rating</div></div>
  `;
  document.getElementById('now').innerHTML=playing.length?playing.map(nowC).join(''):'<div class="empty">Nothing playing.</div>';
  document.getElementById('queue').innerHTML=queue.length?queue.map((g,i)=>qC(g,i+1,true)).join(''):'<div class="empty">Nothing up next.</div>';
  document.getElementById('soon').innerHTML=soon.length?soon.map(g=>qC(g,0,false)).join(''):'<div class="empty">Nothing here yet.</div>';
  renderPanels();
}

// ─── Bootstrap ─────────────────────────────────────────
Promise.all([
  fetch('games.json').then(r=>r.json()),
  fetch('covers.json').then(r=>r.ok?r.json():{}).catch(()=>({})),
]).then(([games,covers])=>{
  G=games;
  COVERS=covers;
  NOW=new Date();
  render();
}).catch(err=>{
  console.error('Failed to load game data', err);
  document.getElementById('now').innerHTML='<div class="empty">Couldn’t load game data — try refreshing.</div>';
});

fetch('last-synced.json').then(r=>r.ok?r.json():null).then(d=>{
  const el=document.getElementById('updated-stamp');
  if(d && d.syncedAt){
    el.textContent=`🔄 Last updated: ${new Date(d.syncedAt).toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'})} — Steam & RA data synced`;
  } else {
    el.textContent='';
  }
}).catch(()=>{ document.getElementById('updated-stamp').textContent=''; });
</script>
