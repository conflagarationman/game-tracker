<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Year in Games</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>%F0%9F%8E%AE</text></svg>">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Syne:wght@400;500;600;700;800&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="theme.css">
<style>
/* Tokens from theme.css, so this reads as part of the tracker rather than a new site. */
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--text);font-family:'Syne',sans-serif;min-height:100vh;padding:1.5rem 1rem 3rem;}
.wrap{max-width:820px;margin:0 auto;}
.top{display:flex;align-items:center;gap:0.75rem;flex-wrap:wrap;margin-bottom:1.25rem;}
.back{font-family:'DM Mono',monospace;font-size:0.68rem;color:var(--muted);text-decoration:none;text-transform:uppercase;letter-spacing:0.08em;}
.back:hover{color:var(--text);}
.years{display:flex;gap:6px;flex-wrap:wrap;margin-left:auto;}
.yr-chip{font-family:'DM Mono',monospace;font-size:0.7rem;padding:0.4rem 0.75rem;min-height:32px;display:inline-flex;align-items:center;border-radius:99px;border:1px solid var(--border2);color:var(--muted);text-decoration:none;}
.yr-chip[aria-current="page"]{background:var(--accent);color:var(--on-accent);border-color:var(--accent);font-weight:700;}
.yr-chip:focus-visible,.btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}

.hero{background:radial-gradient(120% 140% at 0% 0%,color-mix(in srgb, var(--accent) 13%, transparent),transparent 55%),radial-gradient(120% 140% at 100% 100%,color-mix(in srgb, var(--info) 11%, transparent),transparent 55%),var(--surface);
  border:1px solid var(--border);border-radius:16px;padding:1.5rem 1.25rem;margin-bottom:1rem;}
.kicker{font-family:'DM Mono',monospace;font-size:0.68rem;text-transform:uppercase;letter-spacing:0.14em;color:var(--muted);}
.hero h1{font-size:clamp(2.2rem,9vw,3.6rem);font-weight:800;letter-spacing:-0.04em;line-height:1;color:var(--accent);margin:0.35rem 0 1.1rem;}
.wr-big{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:0.75rem;}
.big-n{font-size:2rem;font-weight:800;line-height:1;}
.big-l{font-family:'DM Mono',monospace;font-size:0.62rem;color:var(--muted);text-transform:uppercase;letter-spacing:0.08em;margin-top:4px;}

.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,360px),1fr));gap:1rem;margin-bottom:1rem;}
.panel{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:1rem;min-width:0;}
.panel h2{font-family:'DM Mono',monospace;font-size:0.68rem;text-transform:uppercase;letter-spacing:0.12em;color:var(--muted);font-weight:500;margin-bottom:0.75rem;}

.top5{list-style:none;display:flex;flex-direction:column;gap:8px;}
.top5 li{display:flex;align-items:center;gap:0.65rem;min-width:0;}
.rank{font-family:'DM Mono',monospace;font-size:0.75rem;color:var(--dim);width:14px;text-align:center;flex-shrink:0;}
.cov{width:72px;height:34px;border-radius:4px;object-fit:cover;flex-shrink:0;background:var(--surface2);}
.cov-ph{width:72px;height:34px;border-radius:4px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:0.9rem;}
.t5-main{flex:1;min-width:0;}
.t5-t{font-size:0.88rem;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.t5-s{font-family:'DM Mono',monospace;font-size:0.6rem;color:var(--muted);}
.score{font-family:'DM Mono',monospace;font-size:0.85rem;font-weight:700;color:var(--accent);flex-shrink:0;}

.months{display:grid;grid-template-columns:repeat(12,1fr);gap:4px;align-items:end;height:120px;}
.mcol{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:4px;}
.mbar{width:100%;border-radius:3px 3px 0 0;background:var(--playing);opacity:0.75;min-height:2px;}
.mbar.zero{background:var(--border);opacity:1;}
.mbar.future{background:transparent;border:1px dashed var(--border);border-bottom:0;height:8px!important;}
.mn{font-family:'DM Mono',monospace;font-size:0.55rem;color:var(--dim);}
.mv{font-family:'DM Mono',monospace;font-size:0.58rem;color:var(--muted);}

.stack{display:flex;height:14px;border-radius:7px;overflow:hidden;margin-bottom:0.75rem;background:var(--surface2);}
.legend{display:flex;flex-wrap:wrap;gap:6px 12px;}
.lg{display:flex;align-items:center;gap:5px;font-family:'DM Mono',monospace;font-size:0.65rem;color:var(--muted);}
.dot{width:9px;height:9px;border-radius:50%;}
.brow{display:flex;align-items:center;gap:8px;margin:5px 0;}
.bname{font-family:'DM Mono',monospace;font-size:0.68rem;color:var(--muted);width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex-shrink:0;}
.btrack{flex:1;background:var(--surface2);border-radius:2px;height:5px;}
.bfill{height:5px;border-radius:2px;background:var(--accent);opacity:0.7;}
.bval{font-family:'DM Mono',monospace;font-size:0.65rem;color:var(--dim);min-width:16px;text-align:right;}

.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,180px),1fr));gap:8px;}
.fact{background:var(--surface2);border-radius:10px;padding:10px 12px;min-width:0;}
.fact-l{font-family:'DM Mono',monospace;font-size:0.58rem;color:var(--dim);text-transform:uppercase;letter-spacing:0.08em;}
.fact-v{font-size:0.85rem;font-weight:700;margin-top:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.fact-s{font-family:'DM Mono',monospace;font-size:0.62rem;color:var(--muted);}

.share{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:1.25rem 0 0.5rem;}
.btn{font-family:'DM Mono',monospace;font-size:0.72rem;text-transform:uppercase;letter-spacing:0.06em;padding:0.65rem 1rem;min-height:40px;border-radius:99px;
  border:1px solid var(--accent);background:color-mix(in srgb, var(--accent) 9%, transparent);color:var(--accent);cursor:pointer;font-weight:700;}
.btn:hover{background:color-mix(in srgb, var(--accent) 19%, transparent);}
.note{font-family:'DM Mono',monospace;font-size:0.65rem;color:var(--muted);line-height:1.6;}
.note a{color:var(--text);}
.persona{margin:-0.4rem 0 1.2rem;}
.persona-t{font-size:clamp(1.3rem,5vw,1.8rem);font-weight:800;letter-spacing:-0.02em;margin-top:2px;}
.persona-l{font-family:'DM Mono',monospace;font-size:0.72rem;color:var(--muted);margin-top:3px;}
.yoys{display:flex;flex-wrap:wrap;gap:6px;margin-top:1rem;}
.yoy{font-family:'DM Mono',monospace;font-size:0.65rem;padding:4px 10px;border-radius:99px;background:color-mix(in srgb, var(--text) 5%, transparent);color:var(--muted);}
.yoy.good{background:color-mix(in srgb, var(--accent) 13%, transparent);color:var(--accent);}
.goty{display:flex;flex-direction:column;gap:0.5rem;}
.goty-art{border-radius:8px;overflow:hidden;aspect-ratio:460/215;background:var(--surface2);}
.goty-img{width:100%;height:100%;object-fit:cover;display:block;}
.goty-img-ph{width:100%;height:100%;font-size:2.5rem;}
.goty-t{font-size:1.3rem;font-weight:800;line-height:1.2;}
.srow{display:grid;grid-template-columns:1fr auto;gap:2px 8px;margin:7px 0;}
.sname{font-size:0.8rem;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.sval{font-family:'DM Mono',monospace;font-size:0.7rem;color:var(--muted);}
.strack{grid-column:1 / 3;height:5px;background:var(--surface2);border-radius:3px;overflow:hidden;}
.strack div{height:5px;border-radius:3px;opacity:0.85;}
.dim{color:var(--dim);}
.hi{color:var(--text);font-weight:500;}
.stack.thin{height:8px;}
.standouts{list-style:none;display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,230px),1fr));gap:6px;margin-top:0.9rem;}
.standouts li{display:flex;align-items:center;gap:0.5rem;background:var(--surface2);border-radius:8px;padding:5px 8px;min-width:0;}
.mo{font-family:'DM Mono',monospace;font-size:0.62rem;color:var(--dim);text-transform:uppercase;width:28px;flex-shrink:0;}
.so-img,.so-img-ph{width:54px;height:25px;border-radius:3px;object-fit:cover;flex-shrink:0;font-size:0.8rem;}
.so-t{flex:1;min-width:0;font-size:0.76rem;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.score.sm{font-size:0.7rem;}
.farm-list{list-style:none;display:flex;flex-direction:column;gap:5px;margin-top:0.75rem;}
.farm-list li{display:flex;gap:0.5rem;align-items:baseline;min-width:0;}
.empty{color:var(--dim);font-family:'DM Mono',monospace;font-size:0.8rem;padding:2rem 0;text-align:center;}

/* Year of Play poster: the preview is the same drawing as the PNG, just smaller. */
.poster-panel{margin-bottom:1rem;}
.poster-wrap{display:flex;flex-direction:column;align-items:center;gap:0.75rem;}
#poster-canvas{width:100%;max-width:540px;height:auto;aspect-ratio:3/4;border-radius:6px;border:1px solid var(--border2);background:#12121c;image-rendering:pixelated;}
.poster-acts{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;}
@media print{
  @page{size:letter portrait;margin:0;}
  body *{visibility:hidden;}
  #poster-sec,#poster-sec *{visibility:visible;}
  #poster-sec{position:absolute;left:0;top:0;width:100%;}
  #poster-sec .poster-panel{background:#fff;border:0;padding:0;margin:0;}
  #poster-sec h2,#poster-sec .poster-acts,#poster-sec .note{display:none;}
  #poster-canvas{max-width:none;width:100vw;height:auto;border:0;border-radius:0;print-color-adjust:exact;-webkit-print-color-adjust:exact;}
}
.rp{font-family:'DM Mono',monospace;font-size:0.58rem;color:color-mix(in srgb, var(--accent) 69%, transparent);border:1px solid color-mix(in srgb, var(--accent) 19%, transparent);border-radius:99px;padding:1px 6px;margin-left:6px;vertical-align:middle;white-space:nowrap;}
.err{color:var(--dropped);font-family:'DM Mono',monospace;font-size:0.75rem;}
.hero-top{display:flex;align-items:center;justify-content:space-between;gap:0.75rem;flex-wrap:wrap;}
.btn.play{min-height:36px;padding:0.45rem 0.9rem;}
.clock{display:grid;grid-template-columns:repeat(24,1fr);gap:2px;align-items:end;height:68px;}
.ccol{display:flex;align-items:flex-end;height:100%;}
.cbar{width:100%;border-radius:2px 2px 0 0;background:var(--playing);opacity:0.7;}
.cbar.night{background:#a06bff;opacity:0.9;}
.clock-axis{display:flex;justify-content:space-between;font-family:'DM Mono',monospace;font-size:0.55rem;color:var(--dim);margin-top:4px;}

/* Story mode: the same numbers as full-screen cards, one at a time, for the Jan 1 reveal. */
.story{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;color:var(--text);background:var(--bg);
  padding:calc(env(safe-area-inset-top) + 14px) 18px calc(env(safe-area-inset-bottom) + 18px);overscroll-behavior:contain;}
.story[hidden]{display:none;}
.st-bars{display:flex;gap:4px;position:relative;z-index:2;}
.st-bar{flex:1;height:3px;border-radius:2px;background:color-mix(in srgb, var(--text) 15%, transparent);overflow:hidden;}
.st-bar i{display:block;height:100%;width:0;background:var(--text);}
.st-bar.seen i{width:100%;}
.st-head{display:flex;justify-content:space-between;align-items:center;margin-top:10px;position:relative;z-index:2;}
.st-x{font-family:'DM Mono',monospace;font-size:0.75rem;background:color-mix(in srgb, var(--text) 8%, transparent);color:var(--text);border:0;border-radius:99px;min-height:36px;padding:0 14px;cursor:pointer;}
.st-x:focus-visible,.st-nav:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}
.st-card{flex:1;display:flex;flex-direction:column;justify-content:center;gap:0.9rem;max-width:520px;width:100%;margin:0 auto;position:relative;z-index:1;min-height:0;}
.st-card.enter{animation:st-in .45s cubic-bezier(.2,.8,.2,1);}
@keyframes st-in{from{opacity:0;transform:translateY(18px);}to{opacity:1;transform:none;}}
@media (prefers-reduced-motion: reduce){.st-card.enter{animation:none;}}
.st-k{font-family:'DM Mono',monospace;font-size:0.72rem;text-transform:uppercase;letter-spacing:0.16em;color:var(--muted);}
.st-n{font-size:clamp(3.5rem,22vw,7.5rem);font-weight:800;letter-spacing:-0.05em;line-height:0.95;}
.st-n.mid{font-size:clamp(2rem,10vw,3.6rem);letter-spacing:-0.03em;line-height:1.05;text-wrap:balance;overflow-wrap:anywhere;}
.st-l{font-size:clamp(1.05rem,4.6vw,1.4rem);font-weight:600;line-height:1.35;text-wrap:balance;}
.st-s{font-family:'DM Mono',monospace;font-size:0.72rem;color:var(--muted);line-height:1.6;}
.st-art{border-radius:10px;overflow:hidden;aspect-ratio:460/215;background:var(--surface2);max-width:420px;width:100%;}
.st-art img,.st-art .goty-img-ph{width:100%;height:100%;object-fit:cover;align-items:center;justify-content:center;font-size:3rem;}
.st-list{list-style:none;display:flex;flex-direction:column;gap:10px;}
.st-list li{display:flex;align-items:baseline;gap:12px;font-size:clamp(1rem,4.4vw,1.25rem);font-weight:700;min-width:0;}
.st-list .r{font-family:'DM Mono',monospace;color:var(--dim);font-size:0.8rem;width:1.2em;flex-shrink:0;}
.st-list .t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.st-list .v{font-family:'DM Mono',monospace;font-size:0.85rem;color:var(--accent);flex-shrink:0;}
.st-clock{display:grid;grid-template-columns:repeat(24,1fr);gap:3px;align-items:end;height:110px;}
.st-clock div{border-radius:2px 2px 0 0;background:color-mix(in srgb, var(--text) 25%, transparent);}
.st-clock div.night{background:#a06bff;}
.st-clock div.peak{background:var(--accent);}
.st-acts{display:flex;gap:8px;flex-wrap:wrap;position:relative;z-index:3;}
.st-tap{position:absolute;left:0;right:0;top:0;bottom:0;z-index:1;background:none;border:0;cursor:pointer;-webkit-tap-highlight-color:transparent;}
.st-tap.prev{right:auto;width:30%;}
.st-tap.next{left:auto;width:70%;}
.st-foot{display:flex;justify-content:space-between;align-items:center;gap:8px;position:relative;z-index:2;}
.st-nav{font-family:'DM Mono',monospace;font-size:0.7rem;color:var(--muted);background:color-mix(in srgb, var(--bg) 50%, transparent);border:1px solid var(--border2);border-radius:99px;min-height:40px;padding:0 14px;cursor:pointer;}
.st-nav:disabled{opacity:0.35;cursor:default;}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <a class="back" href="index.html">← Game log</a>
    <nav class="years" id="years" aria-label="Year"></nav>
  </div>
  <main id="main"><div class="empty">loading…</div></main>
</div>

<div class="story" id="story" role="dialog" aria-modal="true" aria-labelledby="st-title" hidden>
  <div class="st-bars" id="st-bars"></div>
  <div class="st-head"><span class="st-k" id="st-title"></span><button type="button" class="st-x" id="st-x" onclick="closeCards()">Close ✕</button></div>
  <button type="button" class="st-tap prev" tabindex="-1" aria-hidden="true" onclick="stepCard(-1)"></button>
  <button type="button" class="st-tap next" tabindex="-1" aria-hidden="true" onclick="stepCard(1)"></button>
  <div class="st-card" id="st-card" aria-live="polite"></div>
  <div class="st-foot"><button type="button" class="st-nav" id="st-prev" onclick="stepCard(-1)">← Back</button><span class="st-s" id="st-count"></span><button type="button" class="st-nav" id="st-next" onclick="stepCard(1)">Next →</button></div>
</div>

<script src="wrapped-stats.js"></script>
<script>
// A year of finished games as one page you'd actually send someone, plus a share image drawn
// straight onto a canvas (no html-to-image library: this project has no dependencies). The
// Year Log on index.html stays the place for the full per-year list; this is the highlight reel.
const M=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const PL={steam:'Steam',steamdeck:'Steam Deck',pc:'PC',ps5:'PS5',switch:'Switch',switch2:'Switch 2',ayn:'AYN Thor',retro:'Retro',wiiu:'Wii U'};
const PC={steam:'#00e5ff',steamdeck:'#a06bff',pc:'#9aa7b8',ps5:'#ff6b4a',switch:'#ff4a6b',switch2:'#4aff8c',ayn:'#ff4af0',retro:'#ffb84a',wiiu:'#009ac7'};
const PLAT_EMOJI={steam:'🖥',steamdeck:'🎮',pc:'💻',ps5:'🎮',switch:'🎮',switch2:'🎮',ayn:'📱',retro:'👾',wiiu:'🎮'};
const DEV_COL={handheld:'#ff4af0',hybrid:'#4aff8c',desk:'#00e5ff'};
let G=[], COVERS={}, Y=null, D=null, ASF=null, POSTER_D=null, LEDGER=null, UNLOCKS=[];
// wrapped-<year>.json: a finished year's inputs as they stood on Jan 1 (scripts/freeze-wrapped.mjs).
// Preferred over the live files, which keep moving after the year is over.
const FROZEN={};

function esc(s){ return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
const hours = g => GTWrapped.hours(g);
const fmtH = h => h >= 100 ? Math.round(h).toLocaleString() : Math.round(h*10)/10;

// The numbers come from wrapped-stats.js (unit-tested); this adds the few page-only extras.
function yearSource(year){ return FROZEN[year]||{games:G,asfIdle:ASF,ledger:LEDGER,unlocks:UNLOCKS}; }
function yearData(year){
  const src=yearSource(year);
  const s=GTWrapped.yearStats(src.games,year,new Date(),src.asfIdle,{ledger:src.ledger,unlocks:src.unlocks});
  const byPlat={}; s.done.forEach(g=>{ byPlat[g.p]=(byPlat[g.p]||0)+1; });
  const timed=s.done.filter(hours);
  return Object.assign(s,{
    plats: Object.entries(byPlat).sort((a,b)=>b[1]-a[1]),
    busiest: s.months.some(m=>m.n) ? s.months.reduce((a,b)=>b.n>a.n?b:a).m : null,
    longest: timed.length ? timed.reduce((a,b)=>hours(b)>hours(a)?b:a) : null,
    shortest: timed.length ? timed.reduce((a,b)=>hours(b)<hours(a)?b:a) : null,
    undated: src.games.filter(g=>(g.s==='done'||g.s==='dropped')&&!g.cy).length,
    undatedMonth: s.done.filter(g=>g.cm==null).length,
  });
}

function cover(g, cls='cov'){
  const url=COVERS[g.t.toLowerCase()], c=PC[g.p]||'#555';
  const ph=`<div class="cov-ph ${cls}-ph" style="background:${c}22;color:${c}${url?';display:none':''}">${PLAT_EMOJI[g.p]||'🎮'}</div>`;
  return url ? `<img class="${cls}" src="${esc(url)}" alt="" loading="lazy" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'">${ph}` : ph;
}
const fact=(l,g,s)=>g?`<div class="fact"><div class="fact-l">${l}</div><div class="fact-v" title="${esc(g.t)}">${esc(g.t)}</div><div class="fact-s">${s}</div></div>`:'';
const factN=(l,n,s,tip='')=>`<div class="fact"${tip?` title="${esc(tip)}"`:''}><div class="fact-l">${l}</div><div class="fact-v">${n}</div><div class="fact-s">${s}</div></div>`;
const fmtDay=iso=>{ const [y,m,dd]=String(iso).split('-').map(Number); return m?`${M[m-1]} ${dd}, ${y}`:esc(iso); };
const signed=n=>n>0?`+${n}`:String(n);
const hourName=h=>`${(h%12)||12} ${h<12?'AM':'PM'}`;
const NIGHT_H=h=>h>=22||h<4;
const RETURN_LABEL={replay:'replay','100pct':'100% run','1.0':'1.0 launch'};
const kindLabel=g=>g?RETURN_LABEL[GTWrapped.returnKind(g)]||'':'';
const RP=g=>kindLabel(g)?`<span class="rp">↻ ${kindLabel(g)}</span>`:'';
const monthSpan=(a,b)=>a===b?M[a]:`${M[a]}–${M[b]}`;

function render(){
  const years=[...new Set(G.filter(g=>g.cy).map(g=>g.cy))].sort((a,b)=>b-a);
  if(!years.length){ document.getElementById('main').innerHTML='<div class="empty">No finished games with a year yet.</div>'; return; }
  const q=parseInt(new URLSearchParams(location.search).get('year'),10);
  Y = years.includes(q) ? q : years[0];
  if(Y<new Date().getFullYear() && !(Y in FROZEN)){
    FROZEN[Y]=null;
    fresh(`wrapped-${Y}.json`).then(r=>r.ok?r.json():null).then(f=>{ if(f&&f.games){ FROZEN[Y]=f; render(); } }).catch(()=>{});
  }
  document.getElementById('years').innerHTML=years.map(y=>`<a class="yr-chip" href="?year=${y}"${y===Y?' aria-current="page"':''}>${y}</a>`).join('');
  document.title=`${Y} in Games`;
  const d=D=yearData(Y);
  const maxM=Math.max(...d.months.map(m=>m.n),1);
  const totalP=d.done.length||1;
  const genres=d.genres.slice(0,6), maxG=genres.length?genres[0][1]:1;
  const perMonth=d.done.length/d.monthsElapsed;
  const share=d.hoursShare.slice(0,6), maxS=share.length?share[0].pct:1;
  const v=d.vsPrev;

// ─── Year of Play poster ───────────────────────────────
// Pixel-art cartridges on a shelf, drawn procedurally: platform colours and the title on a
// label, never cover art, which would taint the canvas and break the PNG export. Geometry
// comes from GTWrapped.posterStats (wrapped-stats.js, unit-tested); this file only paints it.
function posterAlt(){
  const P=POSTER_D; if(!P||!P.games) return `${Y} Year of Play poster: nothing finished yet`;
  return `${Y} Year of Play poster: ${P.games} games, ${fmtH(P.hours)} hours${P.goty?`, Game of the Year ${P.goty.t}`:''}`;
}
const POSTER_FONT="'DM Mono', monospace";
function shade(hex,f){ // f<1 darkens, >1 lightens toward white
  const n=parseInt(hex.slice(1),16), ch=i=>{ const v=(n>>(16-8*i))&255; return Math.max(0,Math.min(255,Math.round(f>1?v+(255-v)*(f-1):v*f))); };
  return `rgb(${ch(0)},${ch(1)},${ch(2)})`;
}
function wrapTitle(x,title,maxW,maxLines,size){
  // Shrinks the type until the title fits in maxLines, then ellipsises whatever still doesn't.
  for(let fs=size; fs>=Math.max(4,size*0.5); fs-=0.5){
    x.font=`700 ${fs}px ${POSTER_FONT}`;
    const words=title.split(/\s+/), lines=[]; let cur='';
    for(const w of words){
      let word=w;
      while(x.measureText(word).width>maxW&&word.length>1) { // a single over-long word: hard-break it
        let k=word.length-1; while(k>1&&x.measureText(word.slice(0,k)+'-').width>maxW) k--;
        if(cur){ lines.push(cur); cur=''; }
        lines.push(word.slice(0,k)+'-'); word=word.slice(k);
      }
      const t=cur?cur+' '+word:word;
      if(x.measureText(t).width<=maxW) cur=t; else { lines.push(cur); cur=word; }
    }
    if(cur) lines.push(cur);
    if(lines.length<=maxLines) return {fs,lines};
    if(fs-0.5<Math.max(4,size*0.5)){
      const out=lines.slice(0,maxLines); let last=out[maxLines-1];
      while(last.length>1&&x.measureText(last+'…').width>maxW) last=last.slice(0,-1);
      out[maxLines-1]=last+'…'; return {fs,lines:out};
    }
  }
}
function drawCart(x,c,G){
  const g=c.g, col=PC[g.p]||'var(--muted)', q=v=>Math.round(v/G)*G;
  const X=q(c.x), Y0=q(c.y), W=c.w, H=c.h, big=!!c.goty;
  // shell with notched top corners, a one-pixel bevel, and a connector strip with teeth
  x.fillStyle='#2b2b33'; x.fillRect(X+G,Y0,W-G*3,H); x.fillRect(X,Y0+G,W,H-G);
  x.fillStyle='#4a4a54'; x.fillRect(X+G,Y0,W-G*3,G/2); x.fillRect(X,Y0+G,G/2,H-G*2);
  x.fillStyle='#1a1a20'; x.fillRect(X+W-G/2,Y0+G*2,G/2,H-G*3);
  x.fillStyle='#1a1a20'; x.fillRect(X+G,Y0+H-G*2,W-G*2,G*2);
  x.fillStyle='#a8863a'; for(let tx=X+G*2; tx<X+W-G*2; tx+=G*2) x.fillRect(tx,Y0+H-G*1.5,G,G);
  // label
  const lx=X+G*2, lw=W-G*4, ly=Y0+G*3, lh=Math.round((H-G*7)/G)*G;
  x.fillStyle='#ece7d6'; x.fillRect(lx,ly,lw,lh);
  x.fillStyle=col; x.fillRect(lx,ly,lw,G*3);                       // platform band
  x.fillStyle=shade(col,0.55); x.fillRect(lx,ly+G*3,lw,G/2);
  x.fillStyle=col; x.fillRect(lx,ly+lh-G*1.5,lw,G*1.5);             // bottom stripe
  x.textBaseline='top'; x.textAlign='left';
  const code=(PL[g.p]||g.p).toUpperCase();
  x.font=`700 ${G*2}px ${POSTER_FONT}`; x.fillStyle='#14261a';
  let tag=code; while(tag.length>1&&x.measureText(tag).width>lw-G) tag=tag.slice(0,-1);
  x.fillText(tag,lx+G/2,ly+G*0.6);
  // title
  const bodyTop=ly+G*3.5+G/2, bodyH=lh-G*3.5-G*2, maxLines=big?4:W>=84?3:2;
  const size=big?G*6:Math.max(G*1.6,Math.min(G*2.6,lw/9));
  const t=wrapTitle(x,g.t,lw-G,maxLines,size); x.fillStyle='#14261a';
  const lineH=t.fs*1.15, blockH=lineH*t.lines.length, startY=bodyTop+Math.max(0,(bodyH-blockH)/2);
  x.font=`700 ${t.fs}px ${POSTER_FONT}`;
  t.lines.forEach((ln,i)=>x.fillText(ln,lx+G/2,startY+i*lineH));
  if(g.r&&(big||W>=84)){ x.font=`700 ${G*1.9}px ${POSTER_FONT}`; x.fillStyle='#14261a'; x.fillText(`${g.r}/10`,lx+G/2,ly+lh-G*1.4); }
}
function drawPoster(canvas,scale){
  const P=POSTER_D, L=P.layout, W=L.W, H=L.H, G=L.grid;
  canvas.width=W*scale; canvas.height=H*scale;
  const x=canvas.getContext('2d'); x.imageSmoothingEnabled=false;
  x.setTransform(scale,0,0,scale,0,0);
  // night wall with deterministic stars, so the same year always prints the same poster
  x.fillStyle='#12121c'; x.fillRect(0,0,W,H);
  x.fillStyle='#181826'; for(let sx=0;sx<W;sx+=G*12) x.fillRect(sx,0,G/2,H);
  let seed=Y*9301+49297; const rnd=()=>(seed=(seed*9301+49297)%233280)/233280;
  for(let i=0;i<70;i++){ x.fillStyle=rnd()>.8?'#e8c547':'#3a3a52'; x.fillRect(Math.round(rnd()*W/G)*G,Math.round(rnd()*190/G)*G,G,G); }
  // title block
  x.textBaseline='alphabetic'; x.textAlign='center';
  x.fillStyle='#888890'; x.font=`500 20px ${POSTER_FONT}`; x.fillText('YEAR OF PLAY',W/2,64);
  x.fillStyle='#2d3a0a'; x.font=`800 120px 'Syne', sans-serif`; x.fillText(String(P.year),W/2+G,164+G);
  x.fillStyle='#e8c547'; x.fillText(String(P.year),W/2,164);
  // shelves
  L.shelves.forEach(s=>{
    x.fillStyle='#a06a3f'; x.fillRect(s.x0,s.y,s.x1-s.x0,G); 
    x.fillStyle='#7a4e2d'; x.fillRect(s.x0,s.y+G,s.x1-s.x0,12);
    x.fillStyle='#4d2f1a'; x.fillRect(s.x0,s.y+G+12,s.x1-s.x0,G);
    x.fillStyle='#00000040'; x.fillRect(s.x0+G,s.y+G*2+12,s.x1-s.x0-G*2,G*2);
  });
  L.carts.forEach(c=>drawCart(x,c,G));
  if(L.goty){
    const c=L.goty, cx=c.x+c.w/2;
    // stepped gold halo, plaque, then the cartridge itself
    [[1.9,'#ffd23a14'],[1.55,'#ffd23a1c'],[1.25,'#ffd23a26']].forEach(([m,f])=>{ const w=Math.round(c.w*m/G)*G, h=Math.round(c.h*m/G)*G; x.fillStyle=f; x.fillRect(Math.round((cx-w/2)/G)*G,Math.round((c.y+c.h/2-h/2)/G)*G,w,h); });
    const pw=300, px=Math.round((W-pw)/G/2)*G;
    x.fillStyle='#a8863a'; x.fillRect(px,c.plaqueY+G,pw,36); x.fillStyle='#ffd23a'; x.fillRect(px+G,c.plaqueY+G*2,pw-G*2,36-G*2);
    x.fillStyle='#3a2a05'; x.font=`700 18px ${POSTER_FONT}`; x.textAlign='center'; x.textBaseline='middle';
    x.fillText('★ GAME OF THE YEAR ★',W/2,c.plaqueY+G+18);
    drawCart(x,Object.assign({},c,{goty:true}),G);
    x.textAlign='center'; x.textBaseline='top'; x.fillStyle='#ffd23a'; x.font=`700 16px ${POSTER_FONT}`;
    x.fillText(`${P.goty.r}/10 · ${fmtH(c.hours)}h`,W/2,c.y+c.h+G*5);
  }
  // footer
  const fy=1068, items=[[String(P.games),'GAMES'],[`${fmtH(P.hours)}h`,'HOURS'],[P.topPlatform?(PL[P.topPlatform.p]||P.topPlatform.p):'–','TOP PLATFORM'],[P.streak?`${P.streak} mo`:'–','LONGEST STREAK']];
  x.fillStyle='#1d1d2a'; x.fillRect(G*10,fy,W-G*20,96); x.fillStyle='#e8c547'; x.fillRect(G*10,fy,W-G*20,G/2);
  const colW=(W-G*20)/4; x.textBaseline='alphabetic';
  items.forEach(([n,l],i)=>{ const cx=G*10+colW*i+colW/2; x.textAlign='center';
    let fs=40; x.font=`800 ${fs}px 'Syne', sans-serif`; while(fs>18&&x.measureText(n).width>colW-16){ fs-=2; x.font=`800 ${fs}px 'Syne', sans-serif`; }
    x.fillStyle=['#42f5a0','#42c8f5','#e8c547','#ff4af0'][i]; x.fillText(n,cx,fy+54);
    x.fillStyle='#888890'; x.font=`500 14px ${POSTER_FONT}`; x.fillText(l,cx,fy+80); });
  x.fillStyle='#555560'; x.font=`500 14px ${POSTER_FONT}`; x.textAlign='center'; x.fillText('GAME LOG',W/2,H-18);
  x.textAlign='left';
}
async function drawPosterPreview(){
  const canvas=document.getElementById('poster-canvas'); if(!canvas) return;
  if(!POSTER_D||!POSTER_D.games) return;
  try{ await document.fonts.ready; }catch(e){}
  drawPoster(canvas,2);
}
// 3600x4800 (3:4, a 12x16 print at 300 dpi). That is over iOS Safari's canvas limit
// (16.7 megapixels), so a failed export steps down to 3000x4000 and then 1800x2400
// rather than giving up.
async function downloadPoster(){
  const msg=document.getElementById('poster-msg'); msg.textContent='Drawing…';
  try{
    await document.fonts.ready;
    let blob=null, used=0;
    for(const s of [4,3.333,2]){
      const c=document.createElement('canvas'); drawPoster(c,s);
      blob=await new Promise(r=>c.toBlob(r,'image/png')); used=s; if(blob&&blob.size>20000) break; blob=null;
    }
    if(!blob) throw new Error('this browser could not make an image that large');
    const file=new File([blob],`year-of-play-${Y}.png`,{type:'image/png'});
    const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=file.name; a.click();
    setTimeout(()=>URL.revokeObjectURL(a.href),5000);
    msg.textContent=`Saved ${900*used} × ${1200*used}.`;
  }catch(e){ msg.textContent=`Couldn’t make the poster: ${e.message}`; }
}

// ─── Share image ───────────────────────────────────────
// 1080x1350 (4:5, what phones and most feeds show uncropped). Drawn from the data rather than
// screenshotted, so cover art from other origins can't taint the canvas and block the export.
function drawShareCard(){
  const d=D, W=1080, H=1350, c=document.createElement('canvas');
  c.width=W; c.height=H;
  const x=c.getContext('2d');
  const font=(w,s,fam='Syne')=>`${w} ${s}px ${fam==='mono'?"'DM Mono', monospace":"'Syne', sans-serif"}`;
  x.fillStyle='#14261a'; x.fillRect(0,0,W,H);
  let gr=x.createRadialGradient(0,0,0,0,0,900); gr.addColorStop(0,'rgba(200,245,66,0.18)'); gr.addColorStop(1,'rgba(200,245,66,0)');
  x.fillStyle=gr; x.fillRect(0,0,W,H);
  gr=x.createRadialGradient(W,H,0,W,H,900); gr.addColorStop(0,'rgba(66,200,245,0.16)'); gr.addColorStop(1,'rgba(66,200,245,0)');
  x.fillStyle=gr; x.fillRect(0,0,W,H);

  const P=80;
  x.fillStyle='#888890'; x.font=font(500,26,'mono'); x.fillText((d.current?'SO FAR THIS YEAR':'MY YEAR IN GAMES'),P,120);
  x.fillStyle='#e8c547'; x.font=font(800,190); x.fillText(String(d.year),P-8,300);
  const fit=(t,max)=>{ if(x.measureText(t).width<=max) return t; while(t.length>1&&x.measureText(t+'…').width>max) t=t.slice(0,-1); return t+'…'; };
  if(d.persona){
    x.fillStyle='#f0f0f0'; x.font=font(800,40); x.fillText(fit(d.persona.title.toUpperCase(),W-P*2),P,365);
    x.fillStyle='#888890'; x.font=font(500,24,'mono'); x.fillText(fit(d.persona.line,W-P*2),P,405);
  }

  const stats=[[String(d.done.length),'finished','#42f5a0'],[`${fmtH(d.totalH)}h`,'played','#42c8f5'],[d.avg!=null?d.avg.toFixed(1):'–','avg rating','#e8c547']];
  stats.forEach(([n,l,col],i)=>{ const sx=P+i*320;
    // Syne is very wide: shrink a long figure ("1,204h") to its column instead of colliding.
    let size=84; x.font=font(800,size);
    while(size>40&&x.measureText(n).width>270){ size-=4; x.font=font(800,size); }
    x.fillStyle=col; x.fillText(n,sx,505);
    x.fillStyle='#888890'; x.font=font(500,24,'mono'); x.fillText(l.toUpperCase(),sx,545); });

  x.fillStyle='#888890'; x.font=font(500,24,'mono'); x.fillText('BEST OF THE YEAR',P,625);
  (d.top.length?d.top:d.done.slice(0,5)).forEach((g,i)=>{ const y=690+i*86;
    x.fillStyle='#555560'; x.font=font(500,30,'mono'); x.fillText(String(i+1),P,y);
    x.fillStyle=PC[g.p]||'#888'; x.beginPath(); x.arc(P+62,y-10,9,0,Math.PI*2); x.fill();
    x.fillStyle='#f0f0f0'; x.font=font(700,44); x.fillText(fit(g.t,W-P*2-260),P+90,y);
    if(g.r){ x.fillStyle='#e8c547'; x.font=font(700,40,'mono'); const s=`${g.r}/10`; x.fillText(s,W-P-x.measureText(s).width,y); } });

  const by=1150, bw=W-P*2, tot=d.done.length||1; let bx=P;
  x.fillStyle='#888890'; x.font=font(500,24,'mono'); x.fillText('WHERE I PLAYED',P,by-24);
  d.plats.forEach(([p,n])=>{ const w=n/tot*bw; x.fillStyle=PC[p]||'#888'; x.fillRect(bx,by,w,22); bx+=w; });
  x.font=font(500,22,'mono'); let lx=P;
  d.plats.slice(0,5).forEach(([p,n])=>{ const s=`${PL[p]||p} ${n}`; x.fillStyle=PC[p]||'#888'; x.fillRect(lx,by+48,14,14); x.fillStyle='#888890'; x.fillText(s,lx+22,by+62); lx+=x.measureText(s).width+52; });

  // Footer: the year's streak and launch-year count, the Replay/Year in Review-style extras.
  const foot=[d.streak.len>1?`${d.streak.len}-month streak`:'', d.launchYear.length?`${d.launchYear.length} played at launch`:'', d.perfect.length?`${d.perfect.length} mastered`:'']
    .filter(Boolean).join('  ·  ').toUpperCase();
  if(foot){ x.fillStyle='#888890'; x.font=font(500,22,'mono'); x.fillText(fit(foot,W-P*2-170),P+170,H-60); }
  x.fillStyle='#555560'; x.font=font(500,22,'mono'); x.fillText('GAME LOG',P,H-60);
  return c;
}

async function shareImage(){
  const msg=document.getElementById('share-msg');
  try{
    await document.fonts.ready;
    const blob=await new Promise(r=>drawShareCard().toBlob(r,'image/png'));
    const file=new File([blob],`games-${Y}.png`,{type:'image/png'});
    if(navigator.canShare&&navigator.canShare({files:[file]})){ await navigator.share({files:[file],title:`${Y} in games`}); msg.textContent=''; return; }
    const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=file.name; a.click();
    setTimeout(()=>URL.revokeObjectURL(a.href),5000);
    msg.textContent='Saved.';
  }catch(e){ if(e.name!=='AbortError') msg.textContent=`Couldn’t make the image: ${e.message}`; }
}

// ─── Story mode ────────────────────────────────────────
// The year as full-screen cards: tap the right of the screen (or swipe left, or →) for the next,
// the left for the previous, Esc to close. Built from the same D as the page; a card whose data
// is missing (no unlock log yet, nothing rated) is left out rather than shown empty.
const ST={i:0,cards:[]};
function buildCards(d){
  const out=[], C=(bg,html)=>out.push({bg,html});
  const y=d.year, P=d.played, U=d.unlocks, B=d.backlog;
  C('radial-gradient(120% 90% at 0% 0%,color-mix(in srgb, var(--accent) 20%, transparent),transparent 60%),var(--bg)',
    `<div class="st-k">${d.current?'Your year so far':'Your year in games'}</div><div class="st-n" style="color:var(--accent)">${y}</div>
     <div class="st-l">${d.current?`${d.monthsElapsed} months in. Here’s the story so far.`:'Here’s how it went.'}</div><div class="st-s">Tap or swipe to keep going</div>`);
  if(d.done.length) C('radial-gradient(110% 80% at 100% 0%,#42f5a033,transparent 60%),var(--bg)',
    `<div class="st-k">You finished</div><div class="st-n" style="color:var(--done)">${d.done.length}</div><div class="st-l">games${d.busiest!=null?`, the most in ${M[d.busiest]} (${d.months[d.busiest].n})`:''}.</div>
     ${d.replays.length?`<div class="st-s">${d.replays.length} of them ${d.replays.length===1?'was a return trip':'were return trips'}: ${esc(d.replays.slice(0,3).map(g=>`${g.t} (${kindLabel(g)})`).join(', '))}${d.replays.length>3?'…':''}.</div>`:''}
     ${d.streak.len>1?`<div class="st-s">A ${d.streak.len}-month streak, ${monthSpan(d.streak.from,d.streak.to)}, with something finished every month.</div>`:''}`);
  if(P&&P.total>0) C('radial-gradient(110% 80% at 0% 100%,#42c8f533,transparent 60%),var(--bg)',
    `<div class="st-k">You played</div><div class="st-n" style="color:var(--playing)">${fmtH(P.total)}h</div>
     <div class="st-l">${P.games[0]?`Most of it in <b>${esc(P.games[0].g.t)}</b>${P.games[0].replay?` (${RETURN_LABEL[P.games[0].replay]})`:''}: ${fmtH(P.games[0].hours)} hours.`:''}</div>
     <div class="st-s">Tracked Steam play across ${P.games.length} games, card idling taken out${P.since?`, logged since ${fmtDay(P.since)}`:''}.</div>`);
  if(d.goty) C('radial-gradient(100% 70% at 50% 0%,#ffd23a33,transparent 60%),var(--bg)',
    `<div class="st-k">★ Game of the year</div><div class="st-art">${cover(d.goty,'goty-img')}</div><div class="st-n mid">${esc(d.goty.t)}</div>${kindLabel(d.goty)?`<div class="st-s">↻ ${kindLabel(d.goty)}, and the best of the year</div>`:''}
     <div class="st-s">${d.goty.r}/10 · ${PL[d.goty.p]||d.goty.p}${d.goty.cm!=null?' · finished in '+M[d.goty.cm]:''}</div>`);
  if(d.top.length>1) C('radial-gradient(120% 80% at 100% 100%,color-mix(in srgb, var(--accent) 13%, transparent),transparent 60%),var(--bg)',
    `<div class="st-k">Best of the year</div><ol class="st-list">${d.top.map((g,i)=>`<li><span class="r">${i+1}</span><span class="t">${esc(g.t)}${RP(g)}</span><span class="v">${g.r}/10</span></li>`).join('')}</ol>`);
  if(U){
    const mx=Math.max(...U.hours);
    C('radial-gradient(120% 80% at 50% 100%,#a06bff40,transparent 60%),var(--bg)',
      `<div class="st-k">Your gaming hour</div><div class="st-n" style="color:#c9a6ff">${hourName(U.peakHour)}</div>
       <div class="st-clock" role="img" aria-label="Unlocks by hour of day">${U.hours.map((n,h)=>`<div class="${h===U.peakHour?'peak':NIGHT_H(h)?'night':''}" style="height:${Math.max(3,n/mx*100)}%"></div>`).join('')}</div>
       <div class="st-l">${U.nightPct>=30?`A night owl: ${U.nightPct}% of your unlocks came after 10 PM.`:`${U.nightPct}% of your unlocks came after 10 PM.`}</div>
       <div class="st-s">${U.count.toLocaleString()} unlocks, by the clock in Eastern time.</div>`);
    C('radial-gradient(110% 80% at 0% 0%,#ff4af033,transparent 60%),var(--bg)',
      `<div class="st-k">Your biggest day</div><div class="st-n mid">${fmtDay(U.busiest.date)}</div>
       <div class="st-l">${U.busiest.n} unlocks, mostly in <b>${esc(U.busiest.game)}</b>.</div>
       ${U.streak.len>1?`<div class="st-s">Longest run: ${U.streak.len} days in a row with an unlock (${fmtDay(U.streak.from)} to ${fmtDay(U.streak.to)}).</div>`:''}`);
    if(U.rarest) C('radial-gradient(100% 70% at 50% 0%,#ffd23a2e,transparent 60%),var(--bg)',
      `<div class="st-k">Rarest unlock</div><div class="st-n mid">${esc(U.rarest.name)}</div>
       <div class="st-l">Only <b style="color:#ffd23a">${U.rarest.pct}%</b> of ${esc(U.rarest.game)} players have it.</div><div class="st-s">${fmtDay(U.rarest.date)}</div>`);
  }
  if(d.oldest||d.launchYear.length) C('radial-gradient(110% 80% at 100% 0%,#a06bff33,transparent 60%),var(--bg)',
    `<div class="st-k">Old and new</div>
     ${d.oldest?`<div class="st-n mid">${esc(d.oldest.t)}</div><div class="st-l">from ${d.oldest.y}${d.oldest.y<y?`, ${y-d.oldest.y} years before you got to it`:''}.</div>`:''}
     ${d.launchYear.length?`<div class="st-s">${d.launchYear.length} played the year ${d.launchYear.length===1?'it':'they'} came out, like ${esc(d.launchYear[0].t)}.</div>`:''}`);
  if(B&&B.added){ const net=B.added-B.finished-B.dropped;
    C('radial-gradient(110% 80% at 0% 100%,#42f5a02e,transparent 60%),var(--bg)',
      `<div class="st-k">The backlog</div><div class="st-n" style="color:${net<=0?'var(--done)':'#ff6b4a'}">${signed(net)}</div>
       <div class="st-l">${net<0?`You shrank the pile by ${-net}.`:net>0?`The pile grew by ${net}.`:'The pile held steady.'}</div>
       <div class="st-s">${B.added} added, ${B.finished} finished${B.dropped?`, ${B.dropped} dropped`:''}.</div>`); }
  if(d.asf&&d.asf.hours) C('radial-gradient(110% 80% at 100% 100%,#00e5ff26,transparent 60%),var(--bg)',
    `<div class="st-k">Behind the scenes</div><div class="st-n" style="color:#00e5ff">${fmtH(d.asf.hours)}h</div>
     <div class="st-l">of card farming across ${d.asf.gameCount} games. None of it counted as play.</div>`);
  C('radial-gradient(120% 90% at 50% 0%,color-mix(in srgb, var(--accent) 20%, transparent),transparent 60%),radial-gradient(120% 90% at 50% 100%,#42c8f526,transparent 60%),var(--bg)',
    `<div class="st-k">Your play style</div><div class="st-n mid" style="color:var(--accent)">${esc(d.persona?d.persona.title:'The Player')}</div>
     <div class="st-l">${esc(d.persona?d.persona.line:`${d.done.length} games this year`)}.</div>
     <div class="st-acts"><button type="button" class="btn" onclick="shareImage()">Save share image</button>${POSTER_D&&POSTER_D.games?'<button type="button" class="btn" onclick="downloadPoster()">Poster</button>':''}<button type="button" class="btn" onclick="closeCards()">See all the numbers</button></div>`);
  return out;
}
function showCard(){
  const c=ST.cards[ST.i], el=document.getElementById('st-card');
  document.getElementById('story').style.background=c.bg;
  el.innerHTML=c.html; el.classList.remove('enter'); void el.offsetWidth; el.classList.add('enter');
  document.getElementById('st-bars').innerHTML=ST.cards.map((_,i)=>`<span class="st-bar${i<=ST.i?' seen':''}"><i></i></span>`).join('');
  document.getElementById('st-count').textContent=`${ST.i+1} / ${ST.cards.length}`;
  document.getElementById('st-prev').disabled=ST.i===0;
  document.getElementById('st-next').disabled=ST.i===ST.cards.length-1;
}
function stepCard(n){ const i=ST.i+n; if(i<0||i>=ST.cards.length) return; ST.i=i; showCard(); }
function openCards(){
  if(!D) return;
  ST.cards=buildCards(D); ST.i=0;
  document.getElementById('st-title').textContent=`${D.year} in games`;
  document.getElementById('story').hidden=false; document.body.style.overflow='hidden';
  showCard(); document.getElementById('st-x').focus({preventScroll:true});
}
function closeCards(){ document.getElementById('story').hidden=true; document.body.style.overflow=''; }
function openCardsFromUrl(){ if(new URLSearchParams(location.search).get('cards')==='1') openCards(); }
document.addEventListener('keydown',e=>{
  if(document.getElementById('story').hidden) return;
  if(e.key==='Escape') closeCards(); else if(e.key==='ArrowRight') stepCard(1); else if(e.key==='ArrowLeft') stepCard(-1);
});
(()=>{ // swipe: a mostly-horizontal drag of 50px or more
  let x0=null,y0=null; const st=document.getElementById('story');
  st.addEventListener('touchstart',e=>{ x0=e.touches[0].clientX; y0=e.touches[0].clientY; },{passive:true});
  st.addEventListener('touchend',e=>{ if(x0==null) return; const dx=e.changedTouches[0].clientX-x0, dy=e.changedTouches[0].clientY-y0; x0=null;
    if(Math.abs(dx)>50&&Math.abs(dx)>Math.abs(dy)*1.5) stepCard(dx<0?1:-1); },{passive:true});
})();

const fresh=f=>fetch(`${f}?_=${Date.now()}`);
const optional=f=>fresh(f).then(r=>r.ok?r.json():null).catch(()=>null);
Promise.all([fresh('games.json').then(r=>r.json()), fresh('covers.json').then(r=>r.ok?r.json():{}).catch(()=>({})),
  optional('asf-idle.json'), optional('ledger.json'), optional('achievements-log.json')])
  .then(([g,c,a,l,u])=>{ G=g; COVERS=c; ASF=a; LEDGER=l; UNLOCKS=(u&&u.unlocks)||[]; render(); openCardsFromUrl(); })
  .catch(e=>{ document.getElementById('main').innerHTML=`<p class="err">Couldn’t load game data (${esc(e.message)}).</p>`; });
</script>
